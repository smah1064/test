<title>Slot-fit test (cut this first) – PROTOTYPE</title>
<rect x="0" y="0" width="420" height="105.21" fill="#ffffff"/>
<g id="NOTES" fill="#666666" font-family="Arial, 'Noto Sans Arabic', sans-serif">
<rect x="3" y="3" width="414" height="49.21" fill="#fff6f6" stroke="#c00000" stroke-width="0.4"/>
<text x="8" y="10" font-size="7" font-weight="bold" fill="#555555">Slot-fit test (cut this first)</text>
<text x="8" y="20.15" font-size="4.2" font-weight="bold" fill="#c00000">PROTOTYPE – not for production until the workshop confirms material thickness, joint fit and LED dimensions</text>
<text x="410" y="26.24" font-size="4.6" font-weight="bold" fill="#c00000" direction="rtl" text-anchor="start" unicode-bidi="embed">نموذج أولي – ليس للإنتاج قبل تأكيد الورشة لسُمك الخامة وتركيب الوصلات ومقاس الـ LED</text>
<text x="8" y="32.91" font-size="3.6"  fill="#555555">Cut in the sheet you will use. Push the tab into each slot: pick the narrowest slot the tab enters by hand with light friction, and use that number as --slot.</text>
<text x="8" y="38.13" font-size="3.6"  fill="#555555">The finger pair checks the kerf: the fingers should press together by hand. Too loose → raise --kerf by 0.05; too tight → lower it.</text>
<text x="8" y="43.35" font-size="3.6"  fill="#555555">Parameters: thickness 3 mm · slot 3.1 mm · kerf 0.15 mm · min web 3 mm · LED 40 × 20 mm (pocket Ø41)</text>
<text x="8" y="48.57" font-size="3.2"  fill="#555555">Scale 1:1, units mm. Layers: CUT red #ff0000 0.1 mm · ENGRAVE black fill · SCORE blue · NOTES grey (do not output). Regenerate: node scripts/lantern-drawings.js --thickness 3 --slot 3.1 --kerf 0.15</text>
<text x="7" y="66.61" font-size="3.4">Slot strip: slot widths 2.8 … 3.4 mm (length 10.5) · 110 × 30</text>
<text x="279.25" y="66.61" font-size="3.4">Matching tab (10 mm): try it in each slot · 30 × 22</text>
<text x="133.5" y="66.61" font-size="3.4">Finger pair A (kerf-compensated) · 40 × 30</text>
<text x="224.9" y="66.61" font-size="3.4">Finger pair B · 40 × 30</text>

</g>
