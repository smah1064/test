apply plugin: 'com.android.application'

import groovy.json.JsonSlurper

// The version comes from mobile/package.json ("1.2.3"); the build number Google Play needs is worked out from
// it: major * 10000 + minor * 100 + patch (1.2.3 → 10203). Bump it with `npm run version:bump` in mobile/.
def appVersion = new JsonSlurper().parse(file('../../package.json')).version as String
def versionParts = appVersion.tokenize('.')
if (versionParts.size() != 3 || versionParts.any { !(it ==~ /\d+/) } || versionParts[1].toInteger() > 99 || versionParts[2].toInteger() > 99) {
    throw new GradleException("package.json version must look like 1.2.3 (minor and patch up to 99), not ${appVersion}")
}
def appVersionCode = versionParts[0].toInteger() * 10000 + versionParts[1].toInteger() * 100 + versionParts[2].toInteger()

// Plain http is only for a test build pointing at a copy of the shop (EBDA3_SITE_URL=http://…, see
// capacitor.config.ts); `npx cap sync` writes that choice into the app's copy of the settings.
def capConfigFile = file('src/main/assets/capacitor.config.json')
def capConfig = capConfigFile.exists() ? new JsonSlurper().parse(capConfigFile) : [:]
def testSiteOverHttp = capConfig.server?.cleartext == true

// Release signing (Google Play upload key) comes from the environment, never from the repository:
// EBDA3_UPLOAD_KEYSTORE (path to the .jks/.keystore file), EBDA3_UPLOAD_KEYSTORE_PASSWORD, EBDA3_UPLOAD_KEY_ALIAS,
// EBDA3_UPLOAD_KEY_PASSWORD. Without them, release builds come out unsigned.
def uploadKeystore = System.getenv('EBDA3_UPLOAD_KEYSTORE')

android {
    namespace = "me.ebda3.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "me.ebda3.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [usesCleartextTraffic: testSiteOverHttp ? "true" : "false"]
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (uploadKeystore) {
            upload {
                storeFile file(uploadKeystore)
                storePassword System.getenv('EBDA3_UPLOAD_KEYSTORE_PASSWORD')
                keyAlias System.getenv('EBDA3_UPLOAD_KEY_ALIAS')
                keyPassword System.getenv('EBDA3_UPLOAD_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            // Test builds are named "إبداع (تجربة)" (src/debug/res) so they're easy to tell apart.
            versionNameSuffix "-test"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (uploadKeystore) signingConfig signingConfigs.upload
        }
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
    lint {
        abortOnError true
        checkReleaseBuilds true
        warningsAsErrors false
    }
}

// A store build must never point at a test copy of the shop.
tasks.matching { it.name ==~ /(assemble|bundle)Release/ }.configureEach {
    doFirst {
        if (testSiteOverHttp || (capConfig.server?.url ?: '') != 'https://ebda3.me') {
            throw new GradleException("Release builds must use https://ebda3.me (run `npx cap sync` without EBDA3_SITE_URL)")
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.browser:browser:$androidxBrowserVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
