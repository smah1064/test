<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FAFAF7">
  <title>مفيش اتصال · No connection · إبداع</title>
  <!--
    The app's "no connection" page. The app opens it when a page of the shop can't be reached, as
    offline.html?from=<the page's address>. It is inside the app (nothing from the network), tries again by itself
    when the connection is back, and then goes back to that page. Same words as the website's /offline page.
  -->
  <style>
    :root { color-scheme: light; }
    html, body { margin: 0; background: #FAFAF7; }
    body { min-height: 100vh; display: grid; place-items: center; color: #16181d;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, "Noto Sans Arabic", sans-serif; }
    main { width: 100%; max-width: 420px; box-sizing: border-box; padding: 32px 20px; text-align: center; }
    img { width: 96px; height: 96px; }
    h1 { font-size: 22px; margin: 18px 0 8px; }
    p { margin: 0 0 6px; line-height: 1.6; color: #444; }
    .en { direction: ltr; margin-top: 18px; padding-top: 14px; border-top: 1px solid #e4e4de; }
    .en h1 { font-size: 18px; margin-top: 0; }
    button { margin-top: 22px; min-height: 48px; padding: 0 28px; border: 0; border-radius: 999px; background: #16181d;
      color: #fff; font: 600 16px/1.2 inherit; font-family: inherit; cursor: pointer; }
    button:focus-visible { outline: 3px solid #c21c7d; outline-offset: 3px; }
    button[disabled] { opacity: .6; }
    #status { min-height: 1.6em; margin-top: 12px; font-size: 14px; color: #6b6f78; }
  </style>
</head>
<body>
  <main>
    <img src="brand-mark.svg" alt="إبداع">
    <h1>مفيش اتصال بالإنترنت</h1>
    <p>اتأكد من النت وجرّب تاني. السلة والتصميمات اللي حفظتها لسه موجودة.</p>
    <div class="en" lang="en">
      <h1>No internet connection</h1>
      <p>Check your connection and try again. Your cart and saved designs are still here.</p>
    </div>
    <button id="retry" type="button">جرّب تاني · Try again</button>
    <div id="status" role="status" aria-live="polite"></div>
  </main>
  <script>
    (function () {
      'use strict';
      var params = new URLSearchParams(location.search);
      var target = null;
      try {
        var u = new URL(params.get('from') || '');
        if (u.protocol === 'https:' || u.protocol === 'http:') target = u;
      } catch (e) { /* no page to go back to */ }

      var btn = document.getElementById('retry');
      var status = document.getElementById('status');
      var going = false;

      function go() {
        if (going) return;
        going = true;
        btn.disabled = true;
        status.textContent = 'بنحاول تاني… · Trying again…';
        if (target) location.replace(target.href);
        else history.back();
        // If the page fails again, the app shows this page again; if nothing happens, allow another try.
        setTimeout(function () { going = false; btn.disabled = false; status.textContent = ''; }, 8000);
      }

      // Is the shop reachable? (A no-cors request: any answer means the connection is back.)
      function reachable() {
        if (!target || !window.fetch) return Promise.resolve(navigator.onLine !== false);
        var ctrl = window.AbortController ? new AbortController() : null;
        var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 6000);
        return fetch(target.origin + '/favicon.svg?online=' + Date.now(), {
          mode: 'no-cors', cache: 'no-store', credentials: 'omit', signal: ctrl ? ctrl.signal : undefined
        }).then(function () { return true; }, function () { return false; })
          .then(function (ok) { clearTimeout(timer); return ok; });
      }

      var delays = [3000, 5000, 8000, 10000];
      var tries = 0;
      var timer = null;
      function schedule() {
        clearTimeout(timer);
        timer = setTimeout(check, delays[Math.min(tries, delays.length - 1)]);
        tries++;
      }
      function check() {
        if (going || document.visibilityState === 'hidden') return schedule();
        reachable().then(function (ok) { if (ok) go(); else schedule(); });
      }

      btn.addEventListener('click', go);
      window.addEventListener('online', function () { tries = 0; check(); });
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') { tries = 0; check(); }
      });
      schedule();
    })();
  </script>
</body>
</html>
