# The إبداع phone apps (mobile/): tests, an Android test build and an iPhone simulator build, on GitHub's
# computers. Runs only for the app branch and only when the apps (or this file) change; the website is untouched.
name: Phone apps

on:
  push:
    branches: [mobile-apps]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-apps.yml'
  workflow_dispatch:

permissions:
  contents: read

# A new push waits for the running build to finish (the iPhone build is slow to start), keeping only the newest one waiting.
concurrency:
  group: mobile-apps-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  tests:
    name: Tests (page features, settings)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - name: Website packages (the tests run a copy of the shop)
        run: npm ci --no-audit --no-fund
      - name: App packages
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Browser for the tests
        working-directory: mobile
        run: npx playwright install --with-deps chromium
      - name: Tests
        working-directory: mobile
        run: npm test

  android:
    name: Android test build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      # The same signing key for every test build, so a new test app installs over the last one.
      - name: Test signing key (kept between runs, never in the repository)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1
      - name: App packages
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Copy the app's files into the Android project
        working-directory: mobile
        run: npx cap sync android
      - name: Logic tests, checks and the test app
        working-directory: mobile/android
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug bundleRelease
      - name: Name the test app
        id: apk
        run: |
          version=$(node -p "require('./mobile/package.json').version")
          name="ebda3-android-test-v${version}-run${GITHUB_RUN_NUMBER}.apk"
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "### Android test app: $name" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256 of the test signing key (for assetlinks.json while testing):" >> "$GITHUB_STEP_SUMMARY"
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey \
            | grep 'SHA256:' | sed 's/^[[:space:]]*/    /' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: android-test-app
          path: ${{ steps.apk.outputs.name }}
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            mobile/android/app/build/reports/
            mobile/android/app/build/test-results/
          retention-days: 14

  ios:
    name: iPhone build (simulator, not signed)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Newest Xcode on this computer
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: App packages
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Copy the app's files into the iPhone project
        working-directory: mobile
        run: npx cap sync ios
      - name: Link-rule tests (Swift)
        working-directory: mobile/ios/ShellCoreTests
        run: swift test
      - name: Build for the simulator
        working-directory: mobile/ios/App
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -n 60
      - name: Start it in a simulator and take a picture
        run: |
          set -e
          udid=$(xcrun simctl list devices available -j | node -e '
            let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => {
              const all = Object.entries(JSON.parse(s).devices).filter(([rt]) => rt.includes("iOS"))
                .sort(([a], [b]) => a.localeCompare(b, undefined, { numeric: true })).flatMap(([, d]) => d);
              const phone = all.reverse().find((d) => /^iPhone \d+( Pro)?$/.test(d.name)) || all.find((d) => /^iPhone/.test(d.name));
              process.stdout.write(phone.udid);
            });')
          echo "Simulator: $udid"
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" mobile/ios/App/build/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$udid" me.ebda3.app
          sleep 20
          mkdir -p screenshots
          xcrun simctl io "$udid" screenshot screenshots/iphone-launch.png
          xcrun simctl openurl "$udid" "me.ebda3.app://open?url=https%3A%2F%2Febda3.me%2Fprivacy"
          sleep 8
          xcrun simctl io "$udid" screenshot screenshots/iphone-deep-link.png
      - name: Website packages (for a copy of the shop)
        run: npm ci --no-audit --no-fund
      - name: Test app that uses the copy of the shop
        working-directory: mobile
        env:
          EBDA3_SITE_URL: http://localhost:3600
        run: |
          set -o pipefail
          npx cap sync ios
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-test CODE_SIGNING_ALLOWED=NO build | tail -n 20
      - name: Checks on the iPhone simulator (links, no connection, back online)
        working-directory: mobile
        run: node test/device/ios.mjs "$SIM_UDID" ios/App/build-test/Build/Products/Debug-iphonesimulator/App.app ../screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-screenshots
          path: screenshots/
          retention-days: 30

  android-device:
    name: Android emulator checks
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Website packages (for a copy of the shop)
        run: npm ci --no-audit --no-fund
      - name: App packages
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Test app that uses the copy of the shop
        working-directory: mobile
        env:
          EBDA3_SITE_URL: http://10.0.2.2:3600
        run: |
          npx cap sync android
          cd android && ./gradlew --no-daemon assembleDebug
      - name: Let the emulator use the computer's speed-up (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Checks on an Android 14 emulator (links, back button, no connection, saving)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: mobile
          script: node test/device/android.mjs android/app/build/outputs/apk/debug/app-debug.apk ../screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screenshots
          path: screenshots/
          retention-days: 30

  # One fixed link to the newest Android test app, for installing on a phone:
  # https://github.com/<owner>/<repo>/releases/download/android-test/ebda3-android-test.apk
  # Published only when the tests, the build and the emulator checks all passed.
  publish-android-test:
    name: Publish the Android test app link
    needs: [tests, android, android-device]
    if: github.ref == 'refs/heads/mobile-apps'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-test-app
          path: apk
      - name: Replace the test app on the "android-test" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          src=$(ls apk/*.apk | head -1)
          cp "$src" ebda3-android-test.apk
          notes="Test version of the إبداع Android app (built $(date -u '+%Y-%m-%d %H:%M') UTC from ${GITHUB_SHA::7}, $(basename "$src")).
          To install: open this link on the Android phone, download, open the file and allow installing from this source.
          A newer test version installs over this one. Not for the store."
          gh release delete android-test --cleanup-tag --yes 2>/dev/null || true
          gh release create android-test ebda3-android-test.apk --prerelease --target "$GITHUB_SHA" \
            --title "Android test app" --notes "$notes"
          echo "### Test app: https://github.com/${GH_REPO}/releases/download/android-test/ebda3-android-test.apk" >> "$GITHUB_STEP_SUMMARY"
