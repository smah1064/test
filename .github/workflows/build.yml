name: Build

on:
  push:
    paths: ['mobile/**', 'server/**', '.github/workflows/build.yml']
  workflow_dispatch:

jobs:
  server-tests:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
      - run: npm test

  android-apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.50.1, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Set the server address under Settings → Secrets and variables → Actions → Variables → API_URL
      - run: flutter build apk --release --dart-define=API_URL=${{ vars.API_URL || 'http://10.0.2.2:3000' }}
      - uses: actions/upload-artifact@v4
        with:
          name: attendance-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
