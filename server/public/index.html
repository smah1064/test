<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1f5fbf" />
  <title>Attendance</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="stylesheet" href="checkin.css" />
</head>
<body>
  <header class="bar">
    <div class="brand" id="brand" data-t="appTitle">Attendance</div>
    <div class="bar-actions">
      <button class="link" id="lang-btn" type="button">العربية</button>
      <button class="link hidden" id="logout-btn" type="button" data-t="logOut">Log out</button>
    </div>
  </header>

  <!-- Login -->
  <main id="login-view" class="view hidden">
    <form id="login-form" class="card stack" novalidate>
      <div class="hero-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="40" height="40"><path fill="currentColor" d="M19 3h-4.18C14.4 1.84 13.3 1 12 1s-2.4.84-2.82 2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2Zm-7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2Zm-2 14-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8Z"/></svg>
      </div>
      <h1 data-t="appTitle">Attendance</h1>
      <p class="muted center" data-t="loginSubtitle">Log in with the code your admin gave you</p>
      <label><span data-t="employeeCode">Employee code</span>
        <input name="emp_code" autocomplete="username" autocapitalize="none" required /></label>
      <label><span data-t="password">Password</span>
        <input name="password" type="password" autocomplete="current-password" required /></label>
      <p class="error" id="login-error" role="alert"></p>
      <button class="btn primary big" type="submit" data-t="logIn">Log in</button>
      <p class="muted small center" data-t="browserLinkNote">Your account will be linked to this browser the first time you log in. Don't use a private / incognito window.</p>
    </form>
  </main>

  <!-- Home -->
  <main id="home-view" class="view hidden">
    <section class="stack">
      <div>
        <h2 id="hello"></h2>
        <p class="muted" id="site-line"></p>
      </div>
      <div id="net-banner" class="banner hidden" role="status"></div>
      <div class="clock">
        <div class="time" id="clock-time"></div>
        <div class="muted" id="clock-date"></div>
      </div>
      <div class="center"><span class="chip" id="status-chip"></span></div>
      <button class="btn primary huge" id="punch-btn" type="button" disabled></button>
      <p class="muted small center hidden" id="step-line" aria-live="polite"></p>
    </section>

    <section class="stack">
      <div class="row-between">
        <h3 data-t="today">Today</h3>
        <button class="link" id="history-btn" type="button" data-t="myHistory">My history</button>
      </div>
      <ul class="list card" id="today-list"></ul>
    </section>
  </main>

  <!-- History -->
  <main id="history-view" class="view hidden">
    <section class="stack">
      <div class="row-between">
        <button class="link" id="back-btn" type="button" data-t="back">← Back</button>
      </div>
      <div class="month-nav">
        <button class="icon-btn" id="prev-month" type="button" aria-label="Previous month">‹</button>
        <h3 id="month-title"></h3>
        <button class="icon-btn" id="next-month" type="button" aria-label="Next month">›</button>
      </div>
      <p class="muted center" id="month-count"></p>
      <ul class="list card" id="history-list"></ul>
    </section>
  </main>

  <!-- Camera -->
  <div id="camera" class="camera hidden" role="dialog" aria-modal="true">
    <div class="camera-top">
      <button class="link light" id="cam-cancel" type="button" data-t="cancel">Cancel</button>
      <span id="cam-title"></span>
      <span></span>
    </div>
    <div class="camera-stage">
      <video id="cam-video" playsinline autoplay muted></video>
      <img id="cam-photo" class="hidden" alt="" />
      <div class="face-guide" aria-hidden="true"></div>
      <p class="cam-error hidden" id="cam-error"></p>
    </div>
    <div class="camera-bottom">
      <p class="cam-hint" id="cam-hint" data-t="lookAtCamera">Look at the camera. Your face must be clearly visible.</p>
      <button class="shutter" id="cam-shutter" type="button" aria-label="Take photo"></button>
      <div class="cam-review hidden" id="cam-review">
        <button class="btn ghost-light" id="cam-retake" type="button" data-t="retake">Retake</button>
        <button class="btn primary" id="cam-use" type="button" data-t="usePhoto">Use photo</button>
      </div>
    </div>
    <canvas id="cam-canvas" class="hidden"></canvas>
  </div>

  <dialog id="dialog">
    <div class="dialog-body">
      <div class="dialog-icon" id="dialog-icon"></div>
      <h3 id="dialog-title"></h3>
      <p id="dialog-text"></p>
      <button class="btn primary" id="dialog-ok" type="button" data-t="ok">OK</button>
    </div>
  </dialog>

  <script src="checkin.js"></script>
</body>
</html>
