<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OneOff Print</title>
  <script>(function(){var l;try{l=localStorage.getItem('pod-lang')}catch(e){}l=l==='en'?'en':'ar';var d=document.documentElement;d.lang=l;d.dir=l==='ar'?'rtl':'ltr'})()</script>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body data-title-key="order.pageTitle">
  <header class="site-header">
    <div class="container inner">
      <a class="brand" href="/"><span class="brand-mark">1</span>OneOff Print</a>
      <nav>
        <a href="/#products" data-i18n="nav.products"></a>
        <a href="/designs" data-i18n="nav.designs"></a>
        <a class="cart-link" href="/cart"><span data-i18n="nav.cart"></span> <span class="badge" data-cart-count hidden>0</span></a>
        <button class="btn btn-sm lang-toggle" data-lang-toggle data-i18n="lang.other"></button>
      </nav>
    </div>
  </header>

  <main class="container" style="max-width: 820px;">
    <div id="content"><div class="empty"><div class="spinner"></div></div></div>
  </main>

  <footer class="site-footer"><div class="container" data-i18n="footer"></div></footer>

  <script src="/js/i18n.js"></script>
  <script src="/js/common.js"></script>
  <script>
    (async () => {
      const { money, esc, t, tr } = POD;
      const params = new URLSearchParams(location.search);
      const content = document.getElementById('content');
      const STEPS = ['queued', 'printing', 'printed', 'shipped'];
      let order = null;
      let error = null;
      const catalog = await POD.loadCatalog().catch(() => null);
      const shopWa = catalog && catalog.contact && catalog.contact.whatsapp;
      /** A WhatsApp chat with the shop, the order details already typed. */
      function whatsappLink(o) {
        const items = o.items.map((it, i) => `${POD.num(i + 1)}. ${tr(it.productName)} · ${tr(it.color.name)} · ${tr(it.size.label)}${it.copies > 1 ? ` · ${t('cart.copies', { n: POD.num(it.copies) })}` : ''}`).join('\n');
        const text = t('order.waMessage', { n: o.number, items, total: money(o.total), name: o.customer.name });
        return `https://wa.me/${shopWa}?text=${encodeURIComponent(text)}`;
      }

      function render() {
        if (error) {
          content.innerHTML = `<div class="card empty"><h2>${esc(t('order.notFound'))}</h2><p class="muted">${esc(error)}</p><a class="btn" href="/">${esc(t('order.back'))}</a></div>`;
          return;
        }
        const o = order;
        const place = [o.customer.city, tr(o.customer.governorate)].filter(Boolean).join(POD.lang === 'ar' ? '، ' : ', ');
        content.innerHTML = `
          <div class="page-head">
            ${params.get('new') ? `<p class="notice" style="margin-bottom:16px">${esc(t('order.thanks'))}</p>` : ''}
            <h1>${esc(t('order.title', { n: o.number }))}</h1>
            <p class="muted">${esc(t('order.meta', { status: t('order.' + o.status), date: POD.date(o.createdAt), n: POD.num(o.items.length) }))}</p>
          </div>
          <div class="card order-items">
            ${o.items.map((item, i) => {
              const reached = STEPS.indexOf(item.status);
              return `
              <div class="cart-item">
                <img src="${esc(item.sides[0].previewUrl)}" alt="">
                <div>
                  <h3>${POD.num(i + 1)}. ${esc(tr(item.productName))}</h3>
                  <div class="meta">${esc(tr(item.color.name))} · ${esc(tr(item.size.label))} · ${esc(item.sides.map((s) => tr(s.name)).join(' + '))}${item.copies > 1 ? ` · <span class="cart-copies">${esc(t('cart.copies', { n: POD.num(item.copies) }))}</span>` : ''}</div>
                  <div class="status-label" style="margin-top:10px">${esc(t('item.' + item.status))}</div>
                  <div class="status-steps">${STEPS.map((s, k) => `<div class="${k <= reached ? 'done' : ''}" title="${esc(t('item.' + s))}"></div>`).join('')}</div>
                </div>
                <div class="price">${esc(money(item.price))}</div>
              </div>`;
            }).join('')}
          </div>
          <div class="card summary" style="margin-top:16px;position:static">
            <div class="line"><span>${esc(t('checkout.subtotal'))}</span><span>${esc(money(o.subtotal))}</span></div>
            ${o.discount ? `<div class="line discount-line"><span>${esc(t('coupon.discount'))} <bdi dir="ltr">${esc(o.coupon || '')}</bdi></span><span>-${esc(money(o.discount))}</span></div>` : ''}
            <div class="line"><span>${esc(t('checkout.shipping'))}</span><span>${o.shipping ? esc(money(o.shipping)) : esc(t('free'))}</span></div>
            <div class="line total"><span>${esc(t('checkout.total'))}</span><span>${esc(money(o.total))}</span></div>
            ${o.payment && o.payment.method === 'cod' ? `<div class="pay-box"><strong>${esc(t('order.payCod', { amount: money(o.total) }))}</strong><span>${esc(t('checkout.codText'))}</span></div>` : ''}
            <p class="muted small" style="margin-bottom:0;overflow-wrap:anywhere">${esc(t('order.deliverTo', { name: o.customer.name, place }))}</p>
          </div>
          ${shopWa ? `<div class="order-wa"><p>${esc(t('order.waText'))}</p><a class="btn btn-whatsapp" id="order-wa" target="_blank" rel="noopener" href="${esc(whatsappLink(o))}">${esc(t('order.waButton'))}</a></div>` : ''}`;
      }

      async function load() {
        try {
          order = await POD.api('/api/orders/' + encodeURIComponent(params.get('id') || ''));
          error = null;
        } catch (e) {
          // A failed refresh (weak signal) keeps showing the order already loaded.
          if (order && e.status !== 404) return;
          error = e.message;
        }
        render();
      }
      await load();
      setInterval(load, 30000);
      document.addEventListener('pod:langchange', render);
    })();
  </script>
</body>
</html>
