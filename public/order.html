<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إبداع · ebda3</title>
  <link rel="icon" href="/favicon.svg?v=ebda3" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico?v=ebda3" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=ebda3">
  <link rel="manifest" href="/site.webmanifest?v=ebda3">
  <meta name="theme-color" content="#FAFAF7">
  <script>(function(){var l;try{l=localStorage.getItem('pod-lang')}catch(e){}l=l==='en'?'en':'ar';var d=document.documentElement;d.lang=l;d.dir=l==='ar'?'rtl':'ltr'})()</script>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/aftercare.css">
  <link rel="stylesheet" href="/css/proof.css">
  <style>
    /* Just ordered: the delivery day and the way back to this page come first. */
    .placed { margin-bottom: 16px; padding: 16px 18px; border-color: #9fd6b6; background: #f6fbf8; }
    .placed h2 { font-size: 19px; margin: 0 0 6px; }
    .placed p { margin: 6px 0 0; line-height: 1.55; }
    .placed-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .placed-actions .btn { flex: 1 1 220px; }
    .dlv-top { margin: 8px 0 0; font-size: 16px; font-weight: 700; color: var(--ink); }
    .placed .dlv-top { font-size: 17px; }
  </style>
</head>
<body data-title-key="order.pageTitle">
  <header class="site-header">
    <div class="container inner">
      <a class="brand" href="/" aria-label="إبداع · ebda3"><img class="brand-logo brand-ar" src="/img/logo-ar-header.svg" alt="إبداع" width="61" height="40"><img class="brand-logo brand-en" src="/img/logo-en-header.svg" alt="ebda3" width="98" height="40"><img class="brand-logo brand-mark-logo" src="/img/logo-mark-header.svg" alt="ebda3" width="35" height="40"></a>
      <nav>
        <a href="/#products" data-i18n="nav.products"></a>
        <a href="/designs"><span class="nav-long" data-i18n="nav.designs"></span><span class="nav-short" data-i18n="nav.designsShort"></span></a>
        <a href="/photos"><span class="nav-long" data-i18n="nav.photos"></span><span class="nav-short" data-i18n="nav.photosShort"></span></a>
        <a class="nav-books" href="/book?b=space-hero"><span class="nav-long" data-i18n="nav.books"></span><span class="nav-short" data-i18n="nav.booksShort"></span></a>
        <a class="cart-link" href="/cart"><span data-i18n="nav.cart"></span> <span class="badge" data-cart-count hidden>0</span></a>
        <button class="btn btn-sm lang-toggle" data-lang-toggle data-i18n="lang.other"></button>
      </nav>
    </div>
  </header>

  <main class="container" style="max-width: 820px;">
    <div id="content"><div class="empty"><div class="spinner"></div></div></div>
  </main>

  <footer class="site-footer"><div class="container" data-i18n="footer"></div></footer>

  <script src="/js/i18n.js"></script>
  <script src="/js/i18n-aftercare.js"></script>
  <script src="/js/i18n-proof.js"></script>
  <script src="/js/common.js"></script>
  <script>
    (async () => {
      const { money, esc, t, tr } = POD;
      const params = new URLSearchParams(location.search);
      const content = document.getElementById('content');
      // Per-item print steps; the last one fills when the whole order is delivered.
      const STEPS = ['queued', 'printing', 'printed', 'shipped', 'delivered'];
      const TRACK = ['placed', 'production', 'printed', 'shipped', 'delivered'];
      const ICONS = {
        placed: '<path d="M6 2h9l5 5v15H6z"/><path d="M9 12h8M9 16h6"/>',
        production: '<path d="M7 9V3h10v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/>',
        printed: '<path d="M20 7 9 18l-5-5"/>',
        shipped: '<path d="M2 6h12v10H2zM14 10h4l4 4v2h-8"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/>',
        delivered: '<path d="M3 10 12 3l9 7v11H3z"/><path d="m8.5 14.5 2.5 2.5 4.5-5"/>',
      };
      let order = null;
      let error = null;
      // "Order again" state, kept across the auto-refresh re-renders.
      const reo = { busy: false, added: 0, skipped: null, error: null };
      const catalog = await POD.loadCatalog().catch(() => null);
      const shopWa = catalog && catalog.contact && catalog.contact.whatsapp;
      /** "3 names": Arabic takes the plural for 3–10 («٣ أسماء»), the singular otherwise («١١ اسم»). */
      const namesText = (n) => t(n % 100 >= 3 && n % 100 <= 10 ? 'cart.copies.few' : 'cart.copies', { n: POD.num(n) });
      /** A WhatsApp chat with the shop, the order details already typed. */
      function whatsappLink(o) {
        const A = PODAftercare;
        const items = o.items.map((it, i) => {
          const parts = [tr(it.productName)];
          if (A.showBreakdown(it)) parts.push(A.qtyText(it));
          else parts.push(tr(it.color.name), tr(it.size.label));
          if (A.isNameList(it)) parts.push(namesText(A.pieces(it)));
          else if (A.pieces(it) > 1) parts.push(A.piecesText(A.pieces(it)));
          return `${POD.num(i + 1)}. ${parts.join(' · ')}`;
        }).join('\n');
        const text = t('order.waMessage', { n: o.number, items, total: money(o.total), name: o.customer.name });
        return `https://wa.me/${shopWa}?text=${encodeURIComponent(text)}`;
      }
      /** 'YYYY-MM-DD' as a calendar day (no time-zone shift). */
      function day(ymd) {
        const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(ymd || '');
        if (!m) return '';
        return new Date(+m[1], m[2] - 1, +m[3]).toLocaleDateString(POD.lang === 'ar' ? 'ar-EG' : 'en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
      }
      /** The five tracking steps with their times; worked out from the status when the server sends none. */
      function steps(o) {
        let list = Array.isArray(o.timeline) && o.timeline.length ? TRACK.map((step) => ({ step, at: (o.timeline.find((s) => s.step === step) || {}).at || null })) : null;
        let cur;
        if (list) {
          cur = list.reduce((m, s, i) => (s.at ? i : m), 0);
        } else {
          const printed = o.items.length && o.items.every((i) => ['printed', 'shipped'].includes(i.status));
          cur = { received: 0, in_production: printed ? 2 : 1, shipped: 3, delivered: 4 }[o.status] || 0;
          list = TRACK.map((step, i) => ({ step, at: i === 0 ? o.createdAt : null }));
        }
        if (o.status === 'delivered') cur = 4;
        return list.map((s, i) => ({ ...s, done: i <= cur, current: i === cur }));
      }
      function timelineHtml(o) {
        const list = steps(o);
        const cur = list.find((s) => s.current);
        return `
          <section class="card track-card" aria-labelledby="track-h">
            <h2 id="track-h">${esc(t('track.title'))}</h2>
            <ol class="track">
              ${list.map((s, i) => `
              <li class="${s.done ? 'done' : ''}${s.current ? ' current' : ''}${list[i + 1] && list[i + 1].done ? ' lead' : ''}"${s.current ? ' aria-current="step"' : ''}>
                <span class="track-dot"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[s.step]}</svg></span>
                <span class="track-text">
                  <span class="track-lbl">${esc(t('track.' + s.step))}</span>
                  <span class="track-when">${s.at ? esc(POD.date(s.at)) : s.done ? '' : s.step === 'delivered' && o.delivery && o.delivery.by ? esc(t('track.expected', { date: POD.day(o.delivery.by) })) : esc(t('track.pending'))}</span>
                </span>
              </li>`).join('')}
            </ol>
            ${cur ? `<p class="track-hint"><strong>${esc(t('track.now'))}:</strong> ${esc(nowText(o, cur.step))}</p>` : ''}
            ${shipmentHtml(o)}
          </section>`;
      }
      /** The "Now:" line: what the order waits for while items are checked or wait for the customer's approval. */
      function nowText(o, step) {
        if (['placed', 'production'].includes(step) && o.status !== 'delivered') {
          const waiting = o.items.filter((i) => i.status === 'awaiting_approval').length;
          if (waiting) return waiting === 1 ? t('track.now.awaitingOne') : t('track.now.awaitingMany', { n: POD.num(waiting) });
          if (o.items.some((i) => i.status === 'changes_requested')) return t('track.now.changes');
          if (o.items.some((i) => i.status === 'review')) return t('track.now.review');
        }
        return t('track.' + step + '.hint');
      }
      function shipmentHtml(o) {
        const s = o.shipment;
        if (!s || !(s.courier || s.trackingNumber || s.trackingUrl || s.eta || s.deliveredAt)) return '';
        const url = s.trackingUrl && /^https?:\/\//i.test(s.trackingUrl) ? s.trackingUrl : null;
        const delivered = o.status === 'delivered' || s.deliveredAt;
        const rows = [
          s.courier && [t('track.courier'), `<bdi>${esc(s.courier)}</bdi>`],
          s.trackingNumber && [t('track.number'), `<span class="ship-num"><code dir="ltr">${esc(s.trackingNumber)}</code><button class="btn btn-sm" type="button" data-act="copy">${esc(t('track.copy'))}</button></span>`],
          delivered && s.deliveredAt ? [t('track.deliveredOn'), esc(POD.date(s.deliveredAt))] : null,
          !delivered && s.eta && day(s.eta) ? [t('track.eta'), `<strong>${esc(day(s.eta))}</strong>`] : null,
        ].filter(Boolean);
        return `
          <div class="ship-box">
            <h3>${esc(t('track.shipment'))}</h3>
            ${rows.length ? `<dl>${rows.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${v}</dd></div>`).join('')}</dl>` : ''}
            ${url ? `<a class="btn btn-sm btn-dark" href="${esc(url)}" target="_blank" rel="noopener">${esc(t('track.link'))} <span aria-hidden="true">↗</span></a>` : ''}
          </div>`;
      }
      function reorderNotice() {
        if (reo.error) return `<p class="notice reo-notice reo-bad" role="alert">${esc(reo.error)}</p>`;
        if (!reo.skipped) return '';
        return `
          <div class="notice reo-notice${reo.added ? '' : ' reo-bad'}" role="status">
            <p>${esc(reo.added ? t('track.reorderPartial', { n: POD.num(reo.added) }) : t('track.reorderNone'))}</p>
            <ul>${PODAftercare.skippedLines(reo.skipped).map((l) => `<li>${esc(l)}</li>`).join('')}</ul>
            ${reo.added ? `<a class="btn btn-sm btn-primary" href="/cart?added=1">${esc(t('track.goCart'))}</a>` : ''}
          </div>`;
      }

      // Items the shop checks first, or that wait for the customer's OK on a new proof.
      const REVIEW_STATES = ['review', 'awaiting_approval', 'changes_requested'];
      /** The newest note about changes: the shop's request or the customer's own. */
      function changesNote(item) {
        const hist = Array.isArray(item.approvals) ? item.approvals : [];
        for (let k = hist.length - 1; k >= 0; k--) {
          const h = hist[k];
          if (h && (h.action === 'changes' || h.action === 'rejected')) return h.note ? { note: h.note, mine: h.by === 'customer' } : null;
        }
        return item.review && item.review.note ? { note: item.review.note, mine: false } : null;
      }
      function proofStateHtml(item) {
        if (!REVIEW_STATES.includes(item.status)) return '';
        let body = '';
        if (item.status === 'review') {
          body = `<p>${esc(t('item.reviewHint'))}</p>`;
        } else if (item.status === 'awaiting_approval') {
          const url = item.proofUrl || item.proofLink;
          const link = typeof url === 'string' && /^\/proof\?t=[\w-]+$/.test(url) ? url : null;
          body = `<p>${esc(t('item.awaitingHint'))}</p>${link ? `<a class="btn btn-sm btn-primary" href="${esc(link)}">${esc(t('item.openProof'))}</a>` : `<p>${esc(t('item.awaitingLinkSent'))}</p>`}`;
        } else {
          const n = changesNote(item);
          // Editor-made items: the customer can make the change and send the new version themselves.
          const editable = item.kind === 'product' && /^[0-9a-f-]{36}$/i.test(item.designId || '');
          const edit = editable ? `<p>${esc(t('item.editHint'))}</p><a class="btn btn-sm btn-primary" href="/editor?design=${encodeURIComponent(item.designId)}&revise=${encodeURIComponent(order.id + '.' + item.id)}">${esc(t('item.editResend'))}</a>` : '';
          body = `${n ? `<p><strong>${esc(t(n.mine ? 'item.yourNote' : 'item.shopNote', { note: '\u2063' })).replace('\u2063', `<bdi>${esc(n.note)}</bdi>`)}</strong></p>` : ''}${edit}<p class="${editable ? 'muted small' : ''}">${esc(t(editable ? 'item.changesOrWait' : 'item.changesHint'))}</p>`;
        }
        return `<div class="item-proof-state ${item.status}">${body}</div>`;
      }
      /** The order's status as the customer reads it: "Waiting for you" while an item needs their answer
       *  (the shop still counts the order as being checked). */
      function shownStatus(o) {
        if (o.status === 'in_review' && o.items.some((i) => i.status === 'awaiting_approval' || i.status === 'changes_requested')) return 'waiting_you';
        return o.status;
      }
      function approvalHtml(item) {
        const a = item.approval;
        if (!a || !a.at) return '';
        // A new version waits for its own approval (or for changes): the old version's approval would mislead.
        if (item.status === 'awaiting_approval' || item.status === 'changes_requested') return '';
        if (item.status === 'review' && (item.approvals || []).some((h) => h && h.action === 'revised' && h.at > a.at)) return '';
        return `<div class="item-approved"><span>✓ ${esc(t('item.approvedOn', { date: POD.date(a.at), v: POD.num(a.version || 1) }))}</span>${a.sample ? `<span class="item-sample">${esc(t('item.sampleFirst'))}</span>` : ''}</div>`;
      }

      function render() {
        if (error) {
          // A missing order: the heading already says so; other errors (no connection…) show their message.
          content.innerHTML = `<div class="card empty" style="margin:40px auto;max-width:560px"><h2>${esc(t('order.notFound'))}</h2>${error.status === 404 ? '' : `<p class="muted">${esc(error.message)}</p>`}<a class="btn" href="/">${esc(t('order.back'))}</a></div>`;
          return;
        }
        const o = order;
        const place = [o.customer.city, tr(o.customer.governorate)].filter(Boolean).join(POD.lang === 'ar' ? '، ' : ', ');
        const delivered = o.status === 'delivered' || Boolean(o.shipment && o.shipment.deliveredAt);
        // The promised day (express or standard), shown at the top until the order is delivered.
        const arrives = o.delivery && o.delivery.by && !delivered
          ? `<p class="dlv-top">🚚 ${esc(t('delivery.line', { speed: t(o.delivery.speed === 'express' ? 'delivery.express' : 'delivery.standard'), date: POD.day(o.delivery.by) }))}</p>` : '';
        const isNew = Boolean(params.get('new'));
        content.innerHTML = `
          <div class="page-head">
            ${isNew ? `
            <section class="card placed" aria-labelledby="placed-h">
              <h2 id="placed-h">${esc(t('order.placedTitle'))}</h2>
              ${arrives}
              <p>${esc(t('order.keepLink'))}</p>
              <div class="placed-actions">
                <a class="btn btn-whatsapp" target="_blank" rel="noopener" href="${esc(selfWhatsapp(o))}">${esc(t('order.sendWa'))}</a>
                <button class="btn" type="button" data-act="copy-link">${esc(t('order.copyLink'))}</button>
              </div>
              <p class="muted small">${esc(t('order.emailWhy'))}</p>
            </section>` : ''}
            <h1>${esc(t('order.title', { n: o.number }))}</h1>
            <p class="muted">${esc(t('order.meta', { status: t('order.' + shownStatus(o)), date: POD.date(o.createdAt), n: POD.num(o.items.length) }))}</p>
            ${isNew ? '' : arrives}
            <div class="order-actions">
              <a class="btn" href="/invoice?id=${encodeURIComponent(o.id)}">${esc(t('track.invoice'))}</a>
              <button class="btn" type="button" data-act="reorder"${reo.busy ? ' disabled' : ''}>${esc(t(reo.busy ? 'track.reordering' : 'track.reorder'))}</button>
              <span class="muted small">${esc(t('track.reorderNote'))}</span>
            </div>
            ${reorderNotice()}
          </div>
          ${timelineHtml(o)}
          <div class="card order-items" style="margin-top:16px">
            ${o.items.map((item, i) => {
              const status = delivered ? 'delivered' : item.status;
              const reached = STEPS.indexOf(status);
              const pic = item.sides && item.sides[0] && item.sides[0].previewUrl;
              // One design in several sizes / colours / quantities, or a name list.
              const breakdown = PODAftercare.showBreakdown(item);
              const names = PODAftercare.isNameList(item);
              const pieces = PODAftercare.pieces(item);
              return `
              <div class="cart-item">
                ${pic ? `<img src="${esc(pic)}" alt="">` : '<span></span>'}
                <div>
                  <h3>${POD.num(i + 1)}. ${esc(tr(item.productName))}</h3>
                  <div class="meta">${breakdown ? '' : `${esc(tr(item.color.name))} · ${esc(tr(item.size.label))} · `}${esc((item.sides || []).map((s) => tr(s.name)).join(' + '))}${names ? ` · <span class="cart-copies">${esc(namesText(pieces))}</span>` : ''}</div>
                  ${breakdown ? PODAftercare.qtyHtml(item) : ''}
                  <div class="status-label st-${esc(status)}" style="margin-top:10px">${esc(t('item.' + status))}</div>
                  ${delivered ? '' : proofStateHtml(item)}
                  ${approvalHtml(item)}
                  <div class="status-steps">${STEPS.map((s, k) => `<div class="${k <= reached ? 'done' : ''}" title="${esc(t('item.' + s))}"></div>`).join('')}</div>
                </div>
                <div class="price">${esc(money(item.price))}${pieces > 1 && item.unitPrice ? `<div class="qty-each">${esc(t('qty.each', { price: money(item.unitPrice) }))}</div>` : ''}</div>
              </div>`;
            }).join('')}
          </div>
          <div class="card summary" style="margin-top:16px;position:static">
            <div class="line"><span>${esc(t('checkout.subtotal'))}</span><span>${esc(money(o.subtotal))}</span></div>
            ${o.discount || o.coupon ? `<div class="line discount-line"><span>${esc(t('coupon.discount'))} <bdi dir="ltr">${esc(o.coupon || '')}</bdi></span><span>${o.discount ? '-' + esc(money(o.discount)) : esc(t('coupon.freeShipping'))}</span></div>` : ''}
            ${shippingLines(o)}
            <div class="line total"><span>${esc(t('checkout.total'))}</span><span>${esc(money(o.total))}</span></div>
            ${o.delivery && !delivered ? `<p class="dlv-expected">🚚 ${esc(t('delivery.line', { speed: t(o.delivery.speed === 'express' ? 'delivery.express' : 'delivery.standard'), date: POD.day(o.delivery.by) }))}</p>` : ''}
            ${o.payment && o.payment.method === 'cod' && o.payment.status !== 'paid' && !delivered ? `<div class="pay-box"><strong>${esc(t('order.payCod', { amount: money(o.total) }))}</strong><span>${esc(t('checkout.codText'))}</span></div>` : ''}
            <p class="muted small" style="margin-bottom:0;overflow-wrap:anywhere">${esc(t('order.deliverTo', { name: o.customer.name, place }))}</p>
          </div>
          ${shopWa ? `<div class="order-wa"><p>${esc(t('order.waText'))}</p><a class="btn btn-whatsapp" id="order-wa" target="_blank" rel="noopener" href="${esc(whatsappLink(o))}">${esc(t('order.waButton'))}</a></div>` : ''}`;
      }

      /** Shipping, then the express fee on its own line. */
      function shippingLines(o) {
        const fee = o.delivery && o.delivery.speed === 'express' ? Number(o.delivery.fee) || 0 : 0;
        const base = Math.max(0, Math.round(((Number(o.shipping) || 0) - fee) * 100) / 100);
        return `<div class="line"><span>${esc(t('checkout.shipping'))}</span><span>${base ? esc(money(base)) : esc(t('free'))}</span></div>
          ${fee ? `<div class="line"><span>${esc(t('delivery.expressFee'))}</span><span>${esc(money(fee))}</span></div>` : ''}`;
      }
      const pageLink = (o) => `${location.origin}/order?id=${encodeURIComponent(o.id)}`;
      /** WhatsApp with the order link typed in: the customer picks their own chat ("Message yourself"). */
      const selfWhatsapp = (o) => `https://wa.me/?text=${encodeURIComponent(t('order.waSelf', { n: o.number, link: pageLink(o) }))}`;
      async function copyLink() {
        try {
          await navigator.clipboard.writeText(pageLink(order));
          POD.toast(t('order.linkCopied'));
        } catch (e) {
          POD.toast(t('order.linkCopyFailed'));
        }
      }
      async function reorder() {
        if (reo.busy || !order) return;
        Object.assign(reo, { busy: true, added: 0, skipped: null, error: null });
        render();
        try {
          const r = await PODAftercare.reorder(order.id);
          if (r.added && !r.skipped.length) {
            location.href = '/cart?added=1';
            return;
          }
          Object.assign(reo, { added: r.added, skipped: r.skipped });
        } catch (e) {
          reo.error = e.message;
        }
        reo.busy = false;
        render();
      }
      async function copyNumber(btn) {
        const n = order.shipment.trackingNumber;
        try {
          await navigator.clipboard.writeText(n);
          POD.toast(t('track.copied'));
        } catch (e) {
          // No clipboard access (http, old browser): select the number for a manual copy.
          const code = btn.parentElement.querySelector('code');
          const range = document.createRange();
          range.selectNodeContents(code);
          getSelection().removeAllRanges();
          getSelection().addRange(range);
          POD.toast(t('track.copyFailed'));
        }
      }
      // A preview whose file is gone: keep the grey box, not a broken-image icon.
      content.addEventListener('error', (e) => { if (e.target.tagName === 'IMG') e.target.src = 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 1 1%22/%3E'; }, true);
      content.addEventListener('click', (e) => {
        const b = e.target.closest('[data-act]');
        if (!b) return;
        if (b.dataset.act === 'reorder') reorder();
        if (b.dataset.act === 'copy') copyNumber(b);
        if (b.dataset.act === 'copy-link') copyLink();
      });

      async function load() {
        try {
          order = await POD.api('/api/orders/' + encodeURIComponent(params.get('id') || ''));
          error = null;
          // Just placed here: remembered on this device (the cart does it too; this covers every way in).
          if (params.get('new')) PODAftercare.rememberOrder(order);
          // Back from the editor with a new version of an item.
          if (params.get('revised')) {
            POD.toast(t('item.revisedSent'));
            const u = new URL(location.href);
            u.searchParams.delete('revised');
            history.replaceState(null, '', u.toString());
          }
        } catch (e) {
          // A failed refresh (weak signal) keeps showing the order already loaded.
          if (order && e.status !== 404) return;
          error = { status: e.status, message: e.message };
        }
        render();
      }
      await load();
      setInterval(load, 30000);
      document.addEventListener('pod:langchange', render);
    })();
  </script>
</body>
</html>
