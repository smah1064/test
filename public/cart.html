      }
      // The coupon code the customer typed (kept for this visit).
      let couponCode = '';
      try { couponCode = sessionStorage.getItem('pod-coupon') || ''; } catch (e) { couponCode = ''; }
      // A code the shop refused, shown at the coupon field: { code (as typed), msg (its reason), lang (of msg) }.
      let couponNote = null;
      // The shop gives its reasons in the page's language. After a language switch a refusal is asked for
      // again, once per wording (a refused code counts towards the shop's limit on coupon tries):
      // "CODE\ntext" -> { ar, en }.
      const couponWords = new Map();
      /** The refusal shown at the coupon field: the code in use refused by today's prices (applied), or a code the shop refused. */
      function couponRefusal() {
        if (couponCode && quote && quote.couponError) return { code: couponCode, msg: quote.couponError, lang: quote.lang, applied: true, beaten: Boolean(quote.couponBeaten) };
        return !couponCode && couponNote && couponNote.msg ? couponNote : null;
      }
      const wordsFor = (r) => couponWords.get(`${r.code}\n${r.msg}`) || {};
      /** A refusal in the page's language (in the shop's first words until it has been asked again; the page's own by its key). */
      const refusalText = (r) => (r.key ? t(r.key) : r.lang === POD.lang ? r.msg : wordsFor(r)[POD.lang] || r.msg);
      const needsWords = (r) => Boolean(r) && !r.key && r.lang !== POD.lang && !wordsFor(r)[POD.lang];
      /** The same refusal in two languages: each wording finds the other. */
      function learnWords(code, a, b) {
        if (!a || !b || !b.msg || a.lang === b.lang) return;
        const both = { ...wordsFor({ code, msg: a.msg }), [a.lang]: a.msg, [b.lang]: b.msg };
        couponWords.set(`${code}\n${a.msg}`, both);
        couponWords.set(`${code}\n${b.msg}`, both);
      }
      /** A refused code (not in use) in the page's language: the shop is asked about that code with the cart as it is. */
      async function rewordNote() {
        const note = couponNote;
        const lang = POD.lang;
        const cart = chosen();
        if (!note || !note.msg || !needsWords(note) || !cart.length) return;
        let q;
        try {
          q = await POD.api('/api/cart/quote', quoteRequest(cart, note.code));
        } catch (e) {
          return; // offline, or too many tries: the reason stays in the words it has
        }
        if (couponNote !== note) return; // another code typed meanwhile
        if (q && q.couponError) learnWords(note.code, note, { msg: q.couponError, lang });
        else couponNote = { ...note, msg: '' }; // the shop takes it now: no reason left to show (the code stays in the field)
        render();
      }
      /** The code in use, or the one the shop refused, in the field (left alone otherwise: what the customer is typing stays). */
      function showCode() {
        const el = document.getElementById('coupon');
        if (document.activeElement !== el) el.value = couponCode || (couponNote ? couponNote.code : '');
      }
      function markCoupon(bad) {
        const el = document.getElementById('coupon');
        if (bad) { el.setAttribute('aria-invalid', 'true'); el.setAttribute('aria-describedby', 'coupon-msg'); } else { el.removeAttribute('aria-invalid'); el.removeAttribute('aria-describedby'); }
      }
      const setCoupon = (code) => {
        couponCode = code;
        try { if (code) sessionStorage.setItem('pod-coupon', code); else sessionStorage.removeItem('pod-coupon'); } catch (e) { /* private mode */ }
      };
      /** The question for the shop's prices of these items, with this coupon code. */
      const quoteRequest = (cart, code) => ({ method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ designIds: cart.map((i) => i.designId), couponCode: code, delivery, sample: wantsSample(cart), phone: (document.getElementById('phone') || {}).value || undefined }) });
      let quoteFailed = null; // why the last price check got no answer (no connection, too many tries…)
      async function refreshPrices({ announce = false } = {}) {
        const cart = POD.getCart();
        forgetRemoved(cart);
        quoteFailed = null;
        if (!cart.length) { quote = null; return; }
        // The shop's sums (coupon, shipping, total) are for the ticked items only; the unticked ones are asked about on
        // their own (today's price, gone, can't be made now, their − / +), without a coupon.
        const picked = chosenIn(cart);
        const rest = cart.filter((it) => !isOn(it.designId));
        // The shop answers in the page's language: kept with its answer (see couponRefusal).
        const lang = POD.lang;
        let restQuote = null;
        try {
          const asks = [
            picked.length ? POD.api('/api/cart/quote', quoteRequest(picked, couponCode)) : Promise.resolve(null),
            rest.length ? POD.api('/api/cart/quote', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ designIds: rest.map((i) => i.designId), delivery }) }).catch(() => null) : Promise.resolve(null),
          ];
          [quote, restQuote] = await Promise.all(asks);
          if (quote) quote.lang = lang;
        } catch (e) {
          quote = null;
          quoteFailed = e || new Error('');
          // Too many coupon tries from here: the code comes off (its reason stays at the field) and the prices are
          // asked again without it, so the automatic offer and the shop's own total come back; kept, every price
          // check failed and the order was sent with the cart's own sum (tester 2, 26 Nov).
          if (couponCode && e && e.status === 429) {
            couponNote = { code: couponCode, msg: e.message || t('msg.network'), lang: e.lang || lang };
            setCoupon('');
            return refreshPrices({ announce });
          }
          return;
        }
        const gone = [];
        let ordered = false;
        let changed = false;
        let synced = false;
        // Each item's answer, from whichever question it was in.
        const answers = [...((quote && quote.items) || []), ...((restQuote && restQuote.items) || [])].filter(Boolean);
        const answerOf = (id) => answers.find((q) => q.designId === id) || null;
        const keep = cart.filter((item) => {
          const q = answerOf(item.designId);
          if (!q) return true;
          // Already ordered (the answer to that order got lost, or another tab ordered it): not in the cart any more.
          if (q.gone && (q.ordered || q.orderedIn)) { ordered = true; return false; }
          if (q.gone) { gone.push(tr(item.productName)); return false; }
          if (q.price !== item.price) { item.price = q.price; changed = true; }
          // Newer servers may also send the pieces; they are the ones that will be ordered.
          if (Array.isArray(q.quantities) && JSON.stringify(q.quantities) !== JSON.stringify(item.quantities || null)) { item.quantities = q.quantities; synced = true; }
          if (q.copies != null && (q.copies || 1) !== (item.copies || 1)) { item.copies = q.copies; synced = true; }
          if (q.count) counts.set(item.designId, q.count); else counts.delete(item.designId);
          return true;
        });
        // Hidden or sold out since it was added: the shop's message on the item (cleared when it is back).
        // (An unticked item the shop wasn't asked about just now keeps what it had.)
        const before = blocked;
        blocked = new Map(answers.filter((q) => q.unavailable && keep.some((it) => it.designId === q.designId))
          .map((q) => [q.designId, q.unavailableText || t('cart.blocked')]));
        for (const it of keep) if (!answerOf(it.designId) && before.has(it.designId)) blocked.set(it.designId, before.get(it.designId));
        // The product isn't in the shop: no longer sold, "See similar products" (the shop on that kind of
        // product); paused with a day to come back, that day.
        const nowOut = new Map();
        const out = keep.filter((it) => answers.some((q) => q.designId === it.designId && ['productRetired', 'productUnavailable'].includes(q.unavailable)));
        if (out.length) {
          const shop = await POD.loadCatalog().catch(() => null);
          await Promise.all(out.map(async (it) => {
            const info = await POD.productState(it.productId);
            if (info.state === 'retired') nowOut.set(it.designId, { similar: POD.similarHref(shop, info) });
            else if (info.backOn) nowOut.set(it.designId, { backOn: info.backOn });
          }));
        }
        outOfShop = nowOut;
        if (gone.length || changed || synced || ordered) POD.setCart(keep);
        if (ordered) {
          // Ordered from this tab (its answer got lost): that order, found by this tab's one-time key.
          if (await showPlacedOrder()) return;
          POD.toast(t('cart.alreadyOrdered'));
        }
        if (gone.length) POD.toast(t('cart.gone', { list: gone.join(POD.lang === 'ar' ? '، ' : ', ') }), 'error');
        else if (changed && announce) POD.toast(t('cart.pricesUpdated'));
        if (gone.length) return refreshPrices();
      }

      /** What the customer ticked for one design (its "ok" or its sample wish), against its current proof. */
      function setApproval(id, what, on) {
        const proof = proofOf(id);
        if (!proof) return;
        const a = approvals.get(id) && approvals.get(id).hash === proof.proofHash ? approvals.get(id) : { hash: proof.proofHash, ok: false, sample: false };
        a[what] = on;
        approvals.set(id, a);
      }
      // An item's tick: in this order or not (it stays in the cart either way).
      document.getElementById('items').addEventListener('change', (e) => {
        const id = e.target.dataset && e.target.dataset.sel;
        if (id) setOn([id], e.target.checked);
      });
      // "Deselect all items" / "Select all items".
      document.getElementById('items').addEventListener('click', (e) => {
        const all = e.target.closest('[data-sel-all]');
        if (all) setOn(POD.getCart().map((it) => it.designId), all.dataset.selAll === 'on');
      });
      // "Print one sample first", on its item.
      document.getElementById('items').addEventListener('change', (e) => {
        const id = e.target.dataset && e.target.dataset.sample;
        if (!id || !proofOf(id)) return;
        setApproval(id, 'sample', e.target.checked);
        saveApprovals();
        updateApproval();
        // A sample first moves the expected day: ask the shop again right away.
        refreshPrices().then(render);
      });
      // The one tick next to "Place order": every one of the customer's own designs, as its proof is now.
      document.getElementById('proof-ok-box').addEventListener('change', (e) => {
        const own = ownLoaded(POD.getCart());
        const seen = e.target.checked ? own.filter((it) => changed.delete(it.designId)) : [];
        for (const it of own) setApproval(it.designId, 'ok', e.target.checked);
        saveApprovals();
        updateApproval();
        // ("This design changed" goes from the items once the new proofs are approved.)
        for (const it of seen) paintProof(it.designId);
      });
      // "Details": the note about colours on screen and on paper.
      document.getElementById('proof-ok-more').addEventListener('click', (e) => {
        const note = document.getElementById('proof-ok-note');
        note.hidden = !note.hidden;
        e.currentTarget.setAttribute('aria-expanded', String(!note.hidden));
      });
      document.getElementById('checkout').addEventListener('click', (e) => {
        if (e.target.closest('[data-next-proof]')) goToNextProof();
        if (e.target.closest('[data-next-blocked]')) goToBlocked();
      });
      document.getElementById('items').addEventListener('click', (e) => {
        const more = e.target.closest('[data-more]');
        if (more) {
          setMenu(openMenu === more.dataset.more ? null : more.dataset.more, { focus: e.detail === 0 });
          return;
        }
        if (e.target.closest('.more-item')) openMenu = null;
        const tog = e.target.closest('[data-proof-toggle]');
        if (tog) {
          const id = tog.dataset.proofToggle;
          if (expanded.has(id)) expanded.delete(id); else expanded.add(id);
          const togId = tog.id;
          paintProof(id);
          const again = document.getElementById(togId);
          if (again) again.focus({ preventScroll: !expanded.has(id) });
          if (!expanded.has(id)) { const slot = slotOf(id); if (slot && slot.getBoundingClientRect().top < 70) slot.scrollIntoView({ block: 'start' }); }
          return;
        }
        const retry = e.target.closest('[data-proof-retry]');
        if (retry) { loadProof(retry.dataset.proofRetry, { force: true }); paintProof(retry.dataset.proofRetry); return; }
        // Save for later / back to the cart: what is ordered (and its price, coupon and shipping) changes.
        const later = e.target.closest('[data-later]');
        if (later) {
          POD.moveItem(later.dataset.later, true);
          POD.toast(t('cart.savedToast'));
          render();
          refreshPrices().then(render);
          return;
        }
        const btn = e.target.closest('[data-remove]');
        if (!btn) return;
        const cart = POD.getCart();
        const at = Number(btn.dataset.remove);
        const [gone] = cart.splice(at, 1);
        if (!gone) return;
        const approval = approvals.get(gone.designId);
        const wasOff = off.has(gone.designId);
        POD.setCart(cart);
        render();
        // The coupon and shipping depend on what is left: ask the shop again.
        refreshPrices().then(render);
        // (A key press on Remove: the keyboard goes on at "Undo".)
        undoRemove(gone, at, approval, e.detail === 0, wasOff);
      });

      // ---------- Removed by mistake: "Undo" puts it back where it was, for a few seconds ----------
      const UNDO_MS = 7000;
      function toastRoot() {
        // (The same box as POD.toast's messages: read out by screen readers.)
        let root = document.getElementById('toast-root');
        if (!root) {
          root = document.createElement('div');
          root.id = 'toast-root';
          root.setAttribute('role', 'status');
          root.setAttribute('aria-live', 'polite');
          document.body.appendChild(root);
        }
        return root;
      }
      function undoRemove(item, at, approval, focus, wasOff) {
        const el = document.createElement('div');
        el.className = 'toast toast-undo';
        const paint = () => { el.innerHTML = `<span>${esc(t('cart.removed'))}</span><button type="button">${esc(t('cart.undo'))}</button>`; };
        paint();
        document.addEventListener('pod:langchange', paint);
        toastRoot().appendChild(el);
        /** The toast goes; the keyboard (when it was on "Undo") goes on in the cart at that place. */
        const close = (to) => {
          clearTimeout(timer);
          document.removeEventListener('pod:langchange', paint);
          const had = el.contains(document.activeElement);
          el.remove();
          if (!had) return;
          const entries = [...document.querySelectorAll('[data-entry-for]')];
          const near = to || entries[Math.min(at, entries.length - 1)];
          const target = (near && near.querySelector('[data-remove]')) || document.querySelector('#empty a');
          if (target) target.focus();
        };
        const timer = setTimeout(() => close(), UNDO_MS);
        el.addEventListener('click', (e) => {
          if (!e.target.closest('button')) return;
          // Back in the cart (signed in: synced to the account like any change), at the place it had,
          // with its proof's tick. (Already back from another tab or device: left as it is.)
          if (![...POD.getCart(), ...POD.getSaved()].some((it) => it.designId === item.designId)) {
            const cart = POD.getCart();
            cart.splice(Math.min(at, cart.length), 0, item);
            POD.setCart(cart);
            if (approval) {
              approvals.set(item.designId, approval);
              saveApprovals();
            }
            // (Unticked before, unticked again.)
            if (wasOff) { off.add(item.designId); saveOff(); }
            render();
            refreshPrices().then(render);
          }
          close([...document.querySelectorAll('[data-entry-for]')].find((x) => x.dataset.entryFor === item.designId));
        });
        if (focus) el.querySelector('button').focus();
      }

      const form = document.getElementById('checkout');
      // ---------- Field errors: shown under the field, which is scrolled to and focused ----------
      const FIELDS = ['name', 'phone', 'email', 'governorate', 'city', 'address'].map((id) => document.getElementById(id));
      const SERVER_FIELD = { badPhone: 'phone', badEmail: 'email', badGovernorate: 'governorate' };
      // The same refusals in this page's words (to show them again in the other language).
      const SERVER_TEXT = { badPhone: 'checkout.badPhone', badEmail: 'checkout.badEmail', badGovernorate: 'checkout.needGov' };
      const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      /** The same check as the shop's: an Egyptian mobile, Arabic digits and +20 allowed. */
      function egyptMobile(input) {
        let v = String(input || '').replace(/[\u0660-\u0669]/g, (d) => String(d.charCodeAt(0) - 0x660)).replace(/[\u06f0-\u06f9]/g, (d) => String(d.charCodeAt(0) - 0x6f0));
        v = v.replace(/[\s\-().\u200b-\u200f\u202a-\u202e\u2060-\u2069\ufeff\u061c\u00a0\u2010-\u2015\u2212]/g, '');
        if (v.startsWith('+20')) v = '0' + v.slice(3);
        else if (v.startsWith('0020')) v = '0' + v.slice(4);
        if (/^001[0125]\d{8}$/.test(v)) v = v.slice(1);
        else if (/^20 ?1/.test(v) && v.length === 12) v = '0' + v.slice(2);
        return /^01[0125]\d{8}$/.test(v);
      }
      function fieldProblem(el) {
        const v = el.value.trim();
        if (el.required && !v) return el.id === 'governorate' ? t('checkout.needGov') : t('checkout.needField', { field: (el.labels[0] && el.labels[0].textContent) || '' });
        if (el.id === 'phone' && !egyptMobile(v)) return t('checkout.badPhone');
        if (el.id === 'email' && v && !EMAIL_RE.test(v)) return t('checkout.badEmail');
        return '';
      }
      function setFieldError(el, msg, code) {
        const errId = 'err-' + el.id;
        if (msg && code) el.dataset.errCode = code; else delete el.dataset.errCode;
        let p = document.getElementById(errId);
        if (el.dataset.desc == null) el.dataset.desc = el.getAttribute('aria-describedby') || '';
        if (!msg) {
          if (p) p.remove();
          el.removeAttribute('aria-invalid');
          if (el.dataset.desc) el.setAttribute('aria-describedby', el.dataset.desc); else el.removeAttribute('aria-describedby');
          return;
        }
        if (!p) {
          p = Object.assign(document.createElement('p'), { id: errId, className: 'field-err' });
          el.insertAdjacentElement('afterend', p);
        }
        p.textContent = msg;
        el.setAttribute('aria-invalid', 'true');
        el.setAttribute('aria-describedby', [errId, el.dataset.desc].filter(Boolean).join(' '));
      }
      /** Mark every field with a problem; the first one is returned. */
      function checkFields() {
        let first = null;
        for (const el of FIELDS) {
          const msg = fieldProblem(el);
          setFieldError(el, msg);
          if (msg && !first) first = el;
        }
        return first;
      }
      function goToField(el) {
        el.scrollIntoView({ block: 'center', behavior: 'smooth' });
        el.focus({ preventScroll: true });
      }
      // A corrected field loses its error as soon as it is right (it never gains one while typing).
      form.addEventListener('input', (e) => { const el = e.target; if (el.getAttribute && el.getAttribute('aria-invalid') && FIELDS.includes(el) && !fieldProblem(el)) setFieldError(el, ''); });
      form.addEventListener('change', (e) => { const el = e.target; if (el.getAttribute && el.getAttribute('aria-invalid') && FIELDS.includes(el)) setFieldError(el, fieldProblem(el)); });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        // The shop's refusals come in the language they were asked in.
        const askedIn = POD.lang;
        if (placing) return;
        // As the phones' bar: items that can't be ordered now, then proofs left to approve, then the form's fields.
        // (Nothing ticked: nothing to order. The button says so.)
        if (!chosen().length) return updateApproval();
        if (blockedIn(chosen()).length) {
          goToBlocked();
          return POD.toast(blocked.get(blockedIn(chosen())[0].designId), 'error');
        }
        if (!chosen().every((it) => isApproved(it.designId))) return nudgeProof();
        const bad = checkFields();
        if (bad) return goToField(bad);
        const btn = document.getElementById('place-order');
        placing = true;
        btn.disabled = true;
        btn.textContent = t('checkout.placing');
        try {
          // A number just changed in the cart: sent before anything else (the price then shown is the one to pay).
          const seenTotal = render.total;
          await flushQty();
          // (The customer's own new quantity changed the total: said as that, not as "prices updated". QA 26 Nov.)
          if (Math.abs(render.total - seenTotal) > 0.009) throw Object.assign(new Error(t('cart.qtyTotalChanged')), { code: 'priceChanged' });
          // An earlier try may have reached the shop although its answer got lost: show that order.
          if (await showPlacedOrder()) return;
          const customer = Object.fromEntries(new FormData(form));
          delete customer.delivery;
          const captchaToken = await orderCaptcha.token();
          // Check prices again right before ordering: the customer must see what they will pay.
          const before = render.total;
          const codeBefore = couponCode;
          await refreshPrices();
          // The coupon no longer works (e.g. this phone already used it): say why, with the price without it, and order nothing.
          // (A code that only saves less than the automatic offer doesn't stop the order: the offer is applied.)
          if (codeBefore && quote && quote.couponError && !quote.couponBeaten) throw Object.assign(new Error(quote.couponError), { code: 'couponRefused', lang: quote.lang });
          render();
          if (!POD.getCart().length) throw new Error(t('cart.emptyTitle'));
          if (!chosen().length) throw new Error(t('cartSel.nothing'));
          // Sold out or hidden while the customer was filling in the form.
          const stuckNow = blockedIn(chosen());
          if (stuckNow.length) throw Object.assign(new Error(blocked.get(stuckNow[0].designId)), { code: 'itemUnavailable' });
          if (Math.abs(render.total - before) > 0.009) throw Object.assign(new Error(t('cart.pricesUpdated')), { code: 'priceChanged' });
          // Only the ticked items are ordered; the others stay in the cart as they are.
          const cartNow = chosen();
          // Each item's approval, against the exact proof the customer saw (and whether they want a sample first).
          const approvalsBody = Object.fromEntries(cartNow.map((it) => {
            const a = approvals.get(it.designId);
            return [it.designId, { proofHash: proofOf(it.designId).proofHash, ...(a && a.sample && PODProof.pieces(proofOf(it.designId)) > 1 ? { sample: true } : {}) }];
          }));
          const order = await POD.api('/api/orders', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ customer, designIds: cartNow.map((i) => i.designId), expectedTotal: render.total, delivery, orderKey: orderKey(), approvals: approvalsBody, ...(captchaToken ? { captchaToken } : {}), ...(quote && quote.coupon && couponCode ? { couponCode } : {}) }),
          });
          goToOrder(order);
        } catch (err) {
          orderCaptcha.reset();
          // The shop answered (a wrong phone, a changed price…): that try placed nothing, so its key is done.
          if (!err.network) { try { sessionStorage.removeItem('pod-order-key'); } catch (e) { /* private mode */ } }
          // The coupon was refused (here or by the shop): its reason goes at the coupon field and the code comes off,
          // so the total shown is the one without it; the customer sees why before ordering again.
          const couponRefused = /^coupon/.test(err.code || '') && (couponCode || err.code === 'couponRefused');
          if (couponRefused) {
            couponNote = { code: couponCode || (couponNote && couponNote.code) || '', msg: err.message, lang: err.lang || askedIn };
            setCoupon('');
            showCode();
            rewordNote(); // the language was switched meanwhile
          }
          // A product, colour, size or side the shop stopped selling, or fewer pieces left than ordered (409):
          // the shop's message is shown and the cart asks for today's prices, which mark the items concerned.
          const unavailable = /Unavailable$/.test(err.code || '') || err.code === 'notEnoughStock';
          if (err.code === 'priceChanged' || err.code === 'designGone' || err.code === 'designOrdered' || unavailable || /^coupon/.test(err.code || '')) {
            await refreshPrices();
            render();
          }
          placing = false;
          btn.textContent = placeLabel();
          if (err.code === 'proofChanged' || err.code === 'approvalRequired') {
            // Fetch every proof again: the ones that changed lose their approval and are shown anew.
            await Promise.all(chosen().map((it) => loadProof(it.designId, { force: true })));
            render();
            goToNextProof();
            POD.toast(err.code === 'proofChanged' ? t('proof.changed') : err.message || t('checkout.approvalRequired'), 'error');
            return;
          }
          // A field the shop refused (the phone, the email…): the message goes under that field.
          const field = SERVER_FIELD[err.code] && document.getElementById(SERVER_FIELD[err.code]);
          if (field) {
            setFieldError(field, err.message, err.code);
            goToField(field);
          } else {
            POD.toast(err.message, 'error');
            if (couponRefused) document.querySelector('.coupon-box').scrollIntoView({ block: 'center', behavior: 'smooth' });
            else if (unavailable) goToBlocked();
          }
          // Also above the order button (a toast goes away): the shop's own words.
          if (unavailable && !blockedIn(chosen()).length) {
            const status = document.getElementById('approve-status');
            updateApproval();
            status.classList.add('blocked');
            status.textContent = err.message;
            return;
          }
          updateApproval();
        }
      });

      // ---------- What the customer typed in the order form, kept for this visit ----------
      // (Like the coupon, delivery and ticks: "Edit design" and Back, or a reload, keep it. Only in this tab, and only
      // for the same signed-in customer, or guest; it goes once the order is placed.)
      const DETAILS_KEY = 'pod-checkout';
      const DETAIL_FIELDS = ['name', 'phone', 'email', 'governorate', 'city', 'address', 'notes'];
      const whoIsIn = () => { try { const v = localStorage.getItem('pod-acct'); return v && v !== '1' ? v : ''; } catch (e) { return ''; } };
      function saveDetails() {
        const fields = Object.fromEntries(DETAIL_FIELDS.map((id) => [id, document.getElementById(id).value]));
        try {
          if (Object.values(fields).some((v) => v.trim())) sessionStorage.setItem(DETAILS_KEY, JSON.stringify({ acct: whoIsIn(), fields }));
          else sessionStorage.removeItem(DETAILS_KEY);
        } catch (e) { /* private mode */ }
      }
      function restoreDetails() {
        let kept = null;
        try { kept = JSON.parse(sessionStorage.getItem(DETAILS_KEY) || 'null'); } catch (e) { kept = null; }
        if (!kept || typeof kept.fields !== 'object' || !kept.fields) return;
        // Someone else signed in (or out) since: not theirs to see.
        if (kept.acct !== whoIsIn()) {
          try { sessionStorage.removeItem(DETAILS_KEY); } catch (e) { /* private mode */ }
          return;
        }
        for (const id of DETAIL_FIELDS) {
          const el = document.getElementById(id);
          const v = kept.fields[id];
          if (typeof v !== 'string' || !v || el.value) continue;
          if (el.tagName === 'SELECT' && ![...el.options].some((o) => o.value === v)) continue;
          el.value = v;
        }
      }
      form.addEventListener('input', (e) => { if (DETAIL_FIELDS.includes(e.target.id)) saveDetails(); });
      form.addEventListener('change', (e) => { if (DETAIL_FIELDS.includes(e.target.id)) saveDetails(); });

      // ---------- The order's one-time key (see /api/orders/by-key) ----------
      const KEY = 'pod-order-key';
      function orderKey() {
        let k = null;
        try { k = sessionStorage.getItem(KEY); } catch (e) { k = null; }
        if (!k) {
          k = (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}-${Math.random().toString(36).slice(2)}`);
          try { sessionStorage.setItem(KEY, k); } catch (e) { /* private mode: no retry check */ }
        }
        return k;
      }
      function goToOrder(order) {
        // Kept on this device: a guest's way back to the order (account page, empty cart).
        PODAftercare.rememberOrder(order);
        const ordered = new Set((order.items || []).map((i) => i.designId));
        // Only what was ordered leaves the cart: the unticked items stay, with their ticks and approvals.
        POD.setCart(POD.getCart().filter((it) => !ordered.has(it.designId)));
        try { sessionStorage.removeItem(KEY); sessionStorage.removeItem(DETAILS_KEY); } catch (e) { /* private mode */ }
        for (const id of ordered) approvals.delete(id);
        saveApprovals();
        location.href = POD.orderPath('order', order.id, order.key) + '&new=1';
      }
      async function showPlacedOrder() {
        let k = null;
        try { k = sessionStorage.getItem(KEY); } catch (e) { k = null; }
        if (!k) return false;
        try {
          const order = await POD.api('/api/orders/by-key/' + encodeURIComponent(k));
          if (!order) return false; // not placed: carry on
          goToOrder(order);
          return true;
        } catch (e) {
          return false; // still offline: carry on
        }
      }

      // CAPTCHA: checked silently while the customer fills in the form (a box only if Cloudflare asks).
      const orderCaptcha = POD.captcha(document.getElementById('cap-order'));
      form.addEventListener('focusin', () => orderCaptcha.prepare(), { once: true });
      document.querySelectorAll('input[name="delivery"]').forEach((r) => r.addEventListener('change', () => {
        if (!r.checked) return;
        delivery = r.value === 'express' ? 'express' : 'standard';
        try { sessionStorage.setItem('pod-delivery', delivery); } catch (e) { /* private mode */ }
        render();
        refreshPrices().then(render);
      }));

      // Coupon: apply / remove.
      // The code as the shop keeps it (as src/coupons.js normCode): Arabic (٠-٩, ۰-۹) and full-width digits and
      // letters typed on a phone are the English ones, so "EID٢٠" shows and is kept as "EID20".
      const couponOf = (s) => String(s || '')
        .replace(/[\u0660-\u0669]/g, (d) => String(d.charCodeAt(0) - 0x0660))
        .replace(/[\u06f0-\u06f9]/g, (d) => String(d.charCodeAt(0) - 0x06f0))
        .replace(/[\uff01-\uff5e]/g, (ch) => String.fromCharCode(ch.charCodeAt(0) - 0xfee0))
        .replace(/[\u061c\u200b-\u200f\u202a-\u202e\u2066-\u2069\ufeff]/g, '')
        .trim().toUpperCase().replace(/\s+/g, '');
      // The shop's codes are English letters and digits (src/coupons.js): a code with Arabic (or other) letters, such
      // as "عيد20", is told so here in the page's words, without asking the shop (it isn't counted as a wrong try).
      const notLatin = (code) => /\p{L}/u.test(code.replace(/[A-Z]/g, ''));
      const applyCoupon = async () => {
        if (document.getElementById('coupon-apply').disabled) return; // (Enter pressed while the shop answers)
        const code = couponOf(document.getElementById('coupon').value);
        couponNote = null;
        if (notLatin(code)) {
          const had = couponCode;
          setCoupon('');
          couponNote = { code, key: 'coupon.latinOnly', msg: t('coupon.latinOnly'), lang: POD.lang };
          document.getElementById('coupon').blur();
          if (had) await refreshPrices(); // the code in use before comes off, as with any refused code
          render();
          showCode();
          return;
        }
        setCoupon(code);
        document.getElementById('coupon').blur();
        // (Busy while the shop answers; no answer at all is said, as when placing the order. QA 25 Nov.)
        const btn = document.getElementById('coupon-apply');
        btn.disabled = true;
        btn.setAttribute('aria-busy', 'true');
        try {
          await refreshPrices();
        } finally {
          btn.disabled = false;
          btn.removeAttribute('aria-busy');
        }
        if (code && !quote && quoteFailed) {
          const e = quoteFailed;
          POD.toast(e.status && e.status < 500 && e.message ? e.message : t('msg.network'), 'error');
        }
        // (A code that only saves less than the automatic offer stays typed in: if that offer turns out not to be
        // for this phone, e.g. once per customer, the customer's own code is what the order gets. Tester 1, 26 Nov.)
        if (code && quote && quote.couponError && !quote.couponBeaten) {
          couponNote = { code, msg: quote.couponError, lang: quote.lang };
          setCoupon('');
        }
        render();
        showCode();
        rewordNote(); // the language was switched while the shop was answering
      };
      // "Have a discount code?" opens the field (and, once open, it stays open on this page: a code taken off leaves
      // the field there for another one).
      let couponOpen = false;
      function showCouponField(open) {
        if (open) couponOpen = true;
        const link = document.getElementById('coupon-open');
        document.getElementById('coupon-field').hidden = !open;
        link.hidden = open;
        link.setAttribute('aria-expanded', String(open));
      }
      document.getElementById('coupon-open').addEventListener('click', () => {
        couponOpen = true;
        showCouponField(true);
        document.getElementById('coupon').focus();
      });
      document.getElementById('coupon-apply').addEventListener('click', applyCoupon);
      document.getElementById('coupon').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); applyCoupon(); } });
      // Typing another code: the old refusal goes.
      document.getElementById('coupon').addEventListener('input', () => {
        if (!couponNote) return;
        couponNote = null;
        const msg = document.getElementById('coupon-msg');
        msg.textContent = '';
        msg.classList.remove('bad');
        markCoupon(false);
      });
      // The phone typed in: the shop's offers can depend on it (an offer once per customer), so the prices are asked
      // again for that phone when a coupon or an offer is in play (tester 1, 26 Nov).
      let quotedPhone = '';
      document.getElementById('phone').addEventListener('change', async (e) => {
        const phone = e.target.value.trim();
        if (!egyptMobile(phone) || phone === quotedPhone) return;
        if (!couponCode && !(quote && quote.coupon)) return;
        quotedPhone = phone;
        await refreshPrices();
        render();
      });
      document.getElementById('coupon-remove').addEventListener('click', async () => {
        couponNote = null;
        setCoupon('');
        document.getElementById('coupon').value = '';
        await refreshPrices();
        render();
      });

      // Signed-in customers: their details are filled in and the order is saved to their account.
      // undefined until the shop answers; then the signed-in customer, or null for a guest.
      let acctMe;
      function renderAcctNote() {
        if (acctMe === undefined) return;
        const note = document.getElementById('acct-note');
        if (!acctMe) note.innerHTML = `${esc(t('acct.checkoutGuest'))} <a href="/account?next=cart">${esc(t('acct.signIn'))}</a>`;
        else note.textContent = t('acct.checkoutAs', { name: acctMe.name });
      }
      async function prefillAccount() {
        let me = null;
        try { me = (await POD.api('/api/account')).customer; } catch (e) { me = null; }
        acctMe = me || null;
        renderAcctNote();
        if (!me) return;
        const fill = (id, v) => { const el = document.getElementById(id); if (el && !el.value && v) el.value = v; };
        fill('name', me.name);
        fill('phone', me.phone);
        fill('email', me.email);
        if (me.address) {
          fill('governorate', me.address.governorate);
          fill('city', me.address.city);
          fill('address', me.address.address);
          fill('notes', me.address.notes);
        }
      }

      // ---------- Phones: the slim bar at the bottom (total + the way to the order form) ----------
      const bar = document.getElementById('cart-bar');
      let formInView = false;
      function updateBar() {
        const show = POD.getCart().length > 0 && !formInView;
        bar.hidden = !show;
        document.body.classList.toggle('has-cart-bar', show && getComputedStyle(bar).display !== 'none');
      }
      if ('IntersectionObserver' in window) {
        new IntersectionObserver((entries) => {
          formInView = entries.some((en) => en.isIntersecting);
          updateBar();
        }).observe(form);
      }
      window.addEventListener('resize', updateBar);
      document.getElementById('bar-go').addEventListener('click', () => {
        // Items that can't be ordered now come first, then proofs that didn't load; then the first empty field, then the
        // tick next to the order button, else the button.
        // (Nothing ticked: the ticks, to choose what to order.)
        if (!chosen().length) {
          const all = document.getElementById('sel-all');
          if (all) { all.scrollIntoView({ behavior: 'smooth', block: 'center' }); all.focus({ preventScroll: true }); }
          return;
        }
        if (blockedIn(chosen()).length) return goToBlocked();
        if (!chosen().every((it) => isApproved(it.designId) || proofOf(it.designId))) return goToNextProof();
        const empty = FIELDS.find((el) => el.required && !el.value.trim());
        if (empty) return goToField(empty);
        if (!chosen().every((it) => isApproved(it.designId))) return goToTick();
        const btn = document.getElementById('place-order');
        btn.scrollIntoView({ block: 'center', behavior: 'smooth' });
        btn.focus({ preventScroll: true });
      });

      renderGovernorates();
      restoreDetails();
      showCode();
      render();
      prefillAccount();
      refreshSaved();
      // An order placed from this tab whose answer never arrived: go to it instead of showing its items as gone.
      if (!(await showPlacedOrder())) refreshPrices({ announce: true }).then(render);
      document.addEventListener('pod:langchange', () => {
        renderGovernorates();
        render();
        renderAcctNote();
        // The shop's messages in the new language: about items it can't make now, and a coupon code it refused
        // (the code in use is asked with today's prices; one refused before, on its own).
        const refusal = couponRefusal();
        const reword = refusal && refusal.applied && needsWords(refusal);
        if (blocked.size || reword) {
          refreshPrices().then(() => {
            const now = couponRefusal();
            if (reword && now && now.code === refusal.code) learnWords(refusal.code, refusal, now);
            render();
          });
        }
        rewordNote();
        if (savedBlocked.size) refreshSaved();
        // Errors under the fields, in the new language (the shop's own refusals by their code).
        for (const el of FIELDS) {
          if (el.getAttribute('aria-invalid') !== 'true') continue;
          const again = fieldProblem(el) || (SERVER_TEXT[el.dataset.errCode] ? t(SERVER_TEXT[el.dataset.errCode]) : '');
          if (again) setFieldError(el, again);
        }
      });
      // The cart changed in another tab (an order placed there, an item added).
      window.addEventListener('storage', (e) => {
        if (e.key === 'pod-cart-v2') refreshPrices().then(render);
        // (Ticked or unticked in another tab.)
        if (e.key === OFF_KEY) { readOff(); render(); refreshPrices().then(render); }
      });
      // The account's cart arrived (items added on another device, or removed there).
      document.addEventListener('pod:cartsynced', () => refreshPrices().then(render).then(refreshSaved));
    })();
  </script>
</body>
</html>
