<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OneOff Print</title>
  <script>(function(){var l;try{l=localStorage.getItem('pod-lang')}catch(e){}l=l==='en'?'en':'ar';var d=document.documentElement;d.lang=l;d.dir=l==='ar'?'rtl':'ltr'})()</script>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/quantities.css">
  <link rel="stylesheet" href="/css/proof.css">
</head>
<body data-title-key="cart.pageTitle">
  <header class="site-header">
    <div class="container inner">
      <a class="brand" href="/"><span class="brand-mark">1</span>OneOff Print</a>
      <nav>
        <a href="/#products" data-i18n="nav.products"></a>
        <a href="/designs"><span class="nav-long" data-i18n="nav.designs"></span><span class="nav-short" data-i18n="nav.designsShort"></span></a>
        <a href="/photos"><span class="nav-long" data-i18n="nav.photos"></span><span class="nav-short" data-i18n="nav.photosShort"></span></a>
        <a class="cart-link" href="/cart"><span data-i18n="nav.cart"></span> <span class="badge" data-cart-count hidden>0</span></a>
        <button class="btn btn-sm lang-toggle" data-lang-toggle data-i18n="lang.other"></button>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="page-head"><h1 data-i18n="cart.title"></h1></div>

    <div id="empty" class="card empty" hidden>
      <h2 data-i18n="cart.emptyTitle"></h2>
      <p class="muted" data-i18n="cart.emptyText"></p>
      <a class="btn btn-primary" href="/#products" data-i18n="home.start"></a>
    </div>

    <div class="cart-layout" id="cart-layout" hidden>
      <div>
        <div class="card" id="items"></div>
        <p class="muted small" style="margin-top:12px" data-i18n-html="cart.note"></p>
      </div>

      <form class="card summary" id="checkout" novalidate>
        <h2 style="font-size:18px" data-i18n="checkout.title"></h2>
        <p class="small acct-note" id="acct-note"></p>
        <div class="field"><label for="name" data-i18n="checkout.name"></label><input type="text" id="name" name="name" autocomplete="name" maxlength="120" required></div>
        <div class="field"><label for="phone" data-i18n="checkout.phone"></label><input type="tel" id="phone" name="phone" autocomplete="tel" maxlength="30" inputmode="tel" dir="ltr" placeholder="01xxxxxxxxx" required></div>
        <div class="field"><label for="email" data-i18n="checkout.email"></label><input type="email" id="email" name="email" autocomplete="email" maxlength="200" dir="ltr"></div>
        <div class="field grid-2">
          <div><label for="governorate" data-i18n="checkout.governorate"></label><select id="governorate" name="governorate" required></select></div>
          <div><label for="city" data-i18n="checkout.city"></label><input type="text" id="city" name="city" autocomplete="address-level2" maxlength="100" required></div>
        </div>
        <div class="field"><label for="address" data-i18n="checkout.address"></label><textarea id="address" name="address" rows="2" maxlength="300" autocomplete="street-address" data-i18n-placeholder="checkout.addressPh" required></textarea></div>
        <div class="field"><label for="notes" data-i18n="checkout.notes"></label><input type="text" id="notes" name="notes" maxlength="500"></div>

        <div class="coupon-box">
          <label for="coupon" class="small" style="font-weight:700" data-i18n="coupon.label"></label>
          <div class="coupon-row">
            <input type="text" id="coupon" maxlength="24" dir="ltr" autocomplete="off" autocapitalize="characters" data-i18n-placeholder="coupon.placeholder">
            <button class="btn btn-sm" type="button" id="coupon-apply" data-i18n="coupon.apply"></button>
          </div>
          <p class="small coupon-msg" id="coupon-msg"></p>
        </div>
        <fieldset class="delivery-pick">
          <legend data-i18n="delivery.title"></legend>
          <label class="dlv-opt"><input type="radio" name="delivery" value="standard" checked>
            <span class="dlv-main"><strong data-i18n="delivery.standard"></strong> · <span data-i18n="delivery.standardText"></span><span class="dlv-by small" id="dlv-by-standard"></span></span>
            <span class="dlv-fee small" data-i18n="delivery.noExtra"></span></label>
          <label class="dlv-opt"><input type="radio" name="delivery" value="express">
            <span class="dlv-main"><strong data-i18n="delivery.express"></strong> · <span data-i18n="delivery.expressText"></span><span class="dlv-by small" id="dlv-by-express"></span></span>
            <span class="dlv-fee small" id="dlv-fee-express"></span></label>
          <p class="muted small dlv-days" data-i18n="delivery.days"></p>
        </fieldset>
        <div class="line"><span data-i18n="checkout.subtotal"></span><span id="subtotal"></span></div>
        <div class="line discount-line" id="discount-line" hidden><span><span data-i18n="coupon.discount"></span> <bdi id="coupon-code" dir="ltr"></bdi> <button type="button" class="link-btn small" id="coupon-remove" data-i18n="coupon.remove"></button></span><span id="discount"></span></div>
        <div class="line"><span id="shipping-label" data-i18n="checkout.shipping"></span><span id="shipping"></span></div>
        <div class="line total"><span data-i18n="checkout.total"></span><span id="total"></span></div>
        <p class="muted small" id="free-note" style="margin:6px 0 0"></p>
        <div class="pay-box"><strong data-i18n="checkout.cod"></strong><span data-i18n="checkout.codText"></span></div>
        <div class="captcha-box" id="cap-order"></div>
        <p class="approve-status" id="approve-status" aria-live="polite"></p>
        <button class="btn btn-primary btn-lg btn-block" id="place-order" type="submit" data-i18n="checkout.place" disabled aria-describedby="approve-status"></button>
      </form>
    </div>
  </main>

  <footer class="site-footer"><div class="container" data-i18n="footer"></div></footer>

  <script src="/js/i18n.js"></script>
  <script src="/js/i18n-quantities.js"></script>
  <script src="/js/i18n-proof.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/proof-ui.js"></script>
  <script>
    (async () => {
      const { money, esc, t, tr } = POD;
      const { pricing, governorates, delivery: deliveryInfo } = await POD.loadCatalog();
      // Delivery speed (standard 5 business days, express 2 for a fee), kept for this visit.
      let delivery = 'standard';
      try { delivery = sessionStorage.getItem('pod-delivery') === 'express' ? 'express' : 'standard'; } catch (e) { /* private mode */ }
      const expressFee = () => (quote && quote.deliveryOptions ? quote.deliveryOptions.find((d) => d.speed === 'express').fee : (deliveryInfo ? deliveryInfo.expressFee : 0));
      if (new URLSearchParams(location.search).get('added')) {
        POD.toast(t('cart.added'));
        history.replaceState(null, '', '/cart');
      }

      function renderGovernorates() {
        const sel = document.getElementById('governorate');
        const current = sel.value;
        sel.innerHTML = `<option value="">${esc(t('checkout.choose'))}</option>` +
          governorates.map((g) => `<option value="${g.id}">${esc(tr(g.name))}</option>`).join('');
        sel.value = current;
      }

      // One artwork in several colours / sizes: quantities = [{ color, size, qty, unitPrice }].
      const qtyLines = (item) => (Array.isArray(item.quantities) ? item.quantities.filter((l) => l && Number(l.qty) > 0) : []);
      const piecesText = (n) => t('qty.pieces.' + (n === 1 ? 'one' : n === 2 ? 'two' : n % 100 >= 3 && n % 100 <= 10 ? 'few' : 'many'), { n: POD.num(n) });
      function qtyGroups(lines) {
        const groups = new Map();
        for (const l of lines) {
          const c = l.color || {};
          const key = c.id || tr(c.name) || '';
          if (!groups.has(key)) groups.set(key, { color: c, lines: [] });
          groups.get(key).lines.push(l);
        }
        return [...groups.values()];
      }
      /** Black: S×2 · M×5 / White: M×2 (one line per colour). */
      function qtyBreakdown(lines) {
        return `<div class="qty-break" aria-label="${esc(t('qty.breakdown'))}">${qtyGroups(lines).map((g) => `
          <div class="qty-line">${g.color.hex ? `<span class="qty-dot" style="background:${esc(g.color.hex)}"></span>` : ''}${tr(g.color.name) ? `<span class="qty-cname">${esc(tr(g.color.name))}:</span>` : ''}
            ${g.lines.map((l) => `<span class="qty-chip">${l.size && tr(l.size.label) ? `${esc(tr(l.size.label))}×` : '×'}<b>${esc(POD.num(Number(l.qty)))}</b></span>`).join('')}
          </div>`).join('')}</div>`;
      }
      function itemMeta(item) {
        // Photo prints: the paper, then "12 photos · 18 prints" (the photos are on the proof below).
        if (item.productId === 'photoprints') return `${esc(tr(item.colorName))} · ${esc(tr(item.sizeLabel))}`;
        const lines = qtyLines(item);
        const isNames = Boolean(item.merge) || (!lines.length && item.copies > 1);
        const names = isNames ? (item.merge && item.merge.count) || item.copies : 0;
        const pieces = Math.max(1, Number(item.copies) || lines.reduce((n, l) => n + Number(l.qty), 0) || 1);
        const one = lines.length === 1 ? lines[0] : null;
        const printed = esc(t('cart.printed', { sides: item.sides.map(tr).join(' + ') }));
        const badge = names > 1 ? `<span class="cart-copies">${esc(t('cart.copies', { n: POD.num(names) }))}</span>`
          : !isNames && pieces > 1 ? `<span class="qty-pieces">${esc(piecesText(pieces))}</span>` : '';
        if (lines.length > 1) return `${badge}${qtyBreakdown(lines)}${printed}`;
        const color = one && one.color ? one.color.name : item.colorName;
        const size = one && one.size ? one.size.label : item.sizeLabel;
        return `${esc(tr(color))} · ${esc(tr(size))}${badge ? ' · ' + badge : ''}<br>${printed}`;
      }
      /** The price for all pieces; with one price per piece, that price under it. */
      function itemPrice(item) {
        const lines = qtyLines(item);
        const pieces = Math.max(1, Number(item.copies) || lines.reduce((n, l) => n + Number(l.qty), 0) || 1);
        const units = new Set(lines.map((l) => l.unitPrice).filter((u) => u != null));
        const each = pieces > 1 && units.size <= 1 ? ` <span class="qty-each">${esc(t('qty.each', { price: money(Math.round(item.price / pieces * 100) / 100) }))}</span>` : '';
        return esc(money(item.price)) + each;
      }

      // ---------- Proofs: every item is checked and approved before the order can be placed ----------
      // designId -> { state: 'loading' | 'ok' | 'error', proof, error }
      const proofs = new Map();
      // designId -> { hash, ok, sample }: what the customer ticked, against which proof.
      const approvals = new Map();
      // Designs whose proof changed after the customer had approved it.
      const changed = new Set();
      const APPROVALS_KEY = 'pod-proof-ok';
      try {
        const saved = JSON.parse(sessionStorage.getItem(APPROVALS_KEY) || '{}');
        for (const [id, a] of Object.entries(saved)) if (a && a.hash) approvals.set(id, { hash: a.hash, ok: Boolean(a.ok), sample: Boolean(a.sample) });
      } catch (e) { /* nothing remembered */ }
      const saveApprovals = () => {
        try { sessionStorage.setItem(APPROVALS_KEY, JSON.stringify(Object.fromEntries(approvals))); } catch (e) { /* private mode */ }
      };
      let placing = false;

      const proofOf = (id) => { const p = proofs.get(id); return p && p.state === 'ok' ? p.proof : null; };
      function isApproved(id) {
        const proof = proofOf(id);
        const a = approvals.get(id);
        return Boolean(proof && a && a.ok && a.hash === proof.proofHash);
      }
      async function loadProof(id, { force = false } = {}) {
        const cur = proofs.get(id);
        if (cur && !force && cur.state !== 'error') return cur.promise;
        const entry = { state: 'loading' };
        entry.promise = POD.api('/api/designs/' + encodeURIComponent(id) + '/proof').then((proof) => {
          Object.assign(entry, { state: 'ok', proof });
          const a = approvals.get(id);
          // Approved an older version: ask again.
          if (a && a.ok && a.hash !== proof.proofHash) {
            approvals.delete(id);
            changed.add(id);
            saveApprovals();
          }
        }, (err) => Object.assign(entry, { state: 'error', error: err.message }));
        // Keep showing the proof already on screen while a newer one loads.
        if (!force || !cur || cur.state !== 'ok') proofs.set(id, entry);
        await entry.promise;
        proofs.set(id, entry);
        paintProof(id);
        updateApproval();
        return entry.promise;
      }
      function proofSlot(item, i) {
        const id = item.designId;
        const st = proofs.get(id);
        const ok = isApproved(id);
        const head = `<h3 class="cart-proof-title" id="proof-h-${i}"><span>${esc(t('proof.title'))} · ${esc(tr(item.productName))}</span><span class="cart-proof-ok">✓ ${esc(t('proof.approved'))}</span></h3>`;
        let body;
        if (!st || st.state === 'loading') {
          body = `<div class="cart-proof-state" role="status"><div class="spinner"></div>${esc(t('proof.loading'))}</div>`;
        } else if (st.state === 'error') {
          body = `<div class="cart-proof-state" role="alert"><p>${esc(t('proof.loadFailed'))} ${esc(st.error || '')}</p><button class="btn btn-sm" type="button" data-proof-retry="${esc(id)}">${esc(t('proof.retry'))}</button></div>`;
        } else {
          const proof = st.proof;
          const a = approvals.get(id);
          const sample = Boolean(a && a.sample);
          body = `
            ${changed.has(id) ? `<p class="approve-changed" role="alert">${esc(t('proof.changed'))}</p>` : ''}
            ${PODProof.html(proof)}
            <div class="approve-box">
              ${PODProof.screenNote()}
              <label class="approve-check" for="ok-${i}"><input type="checkbox" id="ok-${i}" data-approve="${esc(id)}"${ok ? ' checked' : ''}><span>${esc(t('proof.ok'))}</span></label>
              ${PODProof.pieces(proof) > 1 && !proof.photos ? `<label class="approve-check sample" for="sample-${i}"><input type="checkbox" id="sample-${i}" data-sample="${esc(id)}"${sample ? ' checked' : ''}><span>${esc(t('proof.sample'))}</span></label>` : ''}
            </div>`;
        }
        return `<section class="cart-proof${ok ? ' ok' : ''}" data-proof-for="${esc(id)}" data-index="${i}" aria-labelledby="proof-h-${i}"><div class="cart-proof-inner">${head}${body}</div></section>`;
      }
      /** Redraw one item's proof (after it loads) without touching the rest of the page. */
      function paintProof(id) {
        const cart = POD.getCart();
        const i = cart.findIndex((it) => it.designId === id);
        const slot = [...document.querySelectorAll('[data-proof-for]')].find((el) => el.dataset.proofFor === id);
        if (i < 0 || !slot) return;
        const focused = document.activeElement && slot.contains(document.activeElement) ? document.activeElement.id : null;
        slot.outerHTML = proofSlot(cart[i], i);
        if (focused && document.getElementById(focused)) document.getElementById(focused).focus();
      }
      /** "Place order" only once every item's current proof is approved. */
      function updateApproval() {
        const cart = POD.getCart();
        const done = cart.filter((it) => isApproved(it.designId)).length;
        const all = cart.length > 0 && done === cart.length;
        const btn = document.getElementById('place-order');
        if (!placing) btn.disabled = !all;
        const status = document.getElementById('approve-status');
        status.classList.toggle('done', all);
        status.innerHTML = all ? `✓ ${esc(t('proof.approved'))}`
          : `${esc(t('checkout.approveAll', { done: POD.num(done), total: POD.num(cart.length) }))} <button type="button" class="link-btn" data-next-proof>${esc(t('checkout.approveGo'))}</button>`;
        document.querySelectorAll('[data-proof-for]').forEach((el) => {
          const ok = isApproved(el.dataset.proofFor);
          el.classList.toggle('ok', ok);
          if (ok) el.classList.remove('needs');
        });
      }
      function goToNextProof() {
        const cart = POD.getCart();
        const next = cart.find((it) => !isApproved(it.designId));
        if (!next) return;
        const slot = [...document.querySelectorAll('[data-proof-for]')].find((el) => el.dataset.proofFor === next.designId);
        if (!slot) return;
        slot.classList.add('needs');
        slot.scrollIntoView({ behavior: 'smooth', block: 'start' });
        const box = slot.querySelector('[data-approve]') || slot.querySelector('[data-proof-retry]');
        if (box) box.focus({ preventScroll: true });
      }

      function render() {
        const cart = POD.getCart();
        const focused = document.activeElement && document.activeElement.closest && document.activeElement.closest('#items') ? document.activeElement.id : null;
        document.getElementById('empty').hidden = cart.length > 0;
        document.getElementById('cart-layout').hidden = cart.length === 0;
        document.getElementById('items').innerHTML = cart.map((item, i) => `
          <div class="cart-entry">
          <div class="cart-item">
            <img src="${esc(item.previewUrl)}" alt="${esc(t('cart.preview', { product: tr(item.productName) }))}">
            <div>
              <h3>${esc(tr(item.productName))}</h3>
              <div class="meta">${itemMeta(item)}</div>
              <div class="actions">
                ${item.productId === 'dtfsheet' || item.productId === 'photoprints' ? '' : item.bookId ? `<a class="btn btn-sm" href="/book?b=${encodeURIComponent(item.bookId)}&cart=${i}">${esc(t('cart.edit'))}</a>` : `<a class="btn btn-sm" href="/editor?design=${encodeURIComponent(item.designId)}&cart=${i}">${esc(t('cart.edit'))}</a>
                ${item.bookId ? '' : `<a class="btn btn-sm" href="/editor?design=${encodeURIComponent(item.designId)}">${esc(t('cart.duplicate'))}</a>`}`}
                <button class="btn btn-sm btn-danger" data-remove="${i}">${esc(t('cart.remove'))}</button>
              </div>
            </div>
            <div class="price">${itemPrice(item)}</div>
          </div>
          ${proofSlot(item, i)}
          </div>`).join('');
        if (focused && document.getElementById(focused)) document.getElementById(focused).focus();
        for (const item of cart) if (!proofs.has(item.designId)) loadProof(item.designId);
        updateApproval();
        const subtotal = Math.round(cart.reduce((s, i) => s + i.price, 0) * 100) / 100;
        const freeOver = quote ? quote.freeShippingOver : pricing.freeShippingOver;
        const applied = quote && quote.coupon && couponCode ? quote.coupon : null;
        const discount = applied ? applied.discount : 0;
        const baseShipping = (applied && applied.freeShipping) || subtotal - discount >= freeOver ? 0 : (quote ? quote.shippingFlat : pricing.shipping);
        const shipping = Math.round((baseShipping + (delivery === 'express' ? expressFee() : 0)) * 100) / 100;
        render.total = Math.round((subtotal - discount + shipping) * 100) / 100;
        document.querySelectorAll('input[name="delivery"]').forEach((r) => { r.checked = r.value === delivery; });
        document.getElementById('dlv-fee-express').textContent = '+' + money(expressFee());
        for (const opt of (quote && quote.deliveryOptions) || []) {
          const el = document.getElementById('dlv-by-' + opt.speed);
          if (el) el.textContent = t('delivery.by', { date: POD.day(opt.by) });
        }
        document.getElementById('shipping-label').textContent = t(delivery === 'express' ? 'delivery.shipExpress' : 'checkout.shipping');
        document.getElementById('discount-line').hidden = !applied;
        document.getElementById('coupon-code').textContent = applied ? applied.code : '';
        document.getElementById('discount').textContent = applied ? (applied.freeShipping && !discount ? t('coupon.freeShipping') : '-' + money(discount)) : '';
        const msg = document.getElementById('coupon-msg');
        msg.textContent = couponCode && quote && quote.couponError ? quote.couponError : applied ? t('coupon.applied') : '';
        msg.classList.toggle('bad', Boolean(couponCode && quote && quote.couponError));
        if (document.activeElement !== document.getElementById('coupon')) document.getElementById('coupon').value = couponCode;
        document.getElementById('subtotal').textContent = money(subtotal);
        document.getElementById('shipping').textContent = shipping ? money(shipping) : t('free');
        document.getElementById('total').textContent = money(render.total);
        document.getElementById('free-note').textContent = baseShipping ? t('checkout.freeOver', { price: money(freeOver) }) : '';
      }

      // Today's prices from the shop (the cart keeps the price from when an item was added).
      let quote = null;
      // The coupon code the customer typed (kept for this visit).
      let couponCode = '';
      try { couponCode = sessionStorage.getItem('pod-coupon') || ''; } catch (e) { couponCode = ''; }
      const setCoupon = (code) => {
        couponCode = code;
        try { if (code) sessionStorage.setItem('pod-coupon', code); else sessionStorage.removeItem('pod-coupon'); } catch (e) { /* private mode */ }
      };
      async function refreshPrices({ announce = false } = {}) {
        const cart = POD.getCart();
        if (!cart.length) { quote = null; return; }
        try {
          quote = await POD.api('/api/cart/quote', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ designIds: cart.map((i) => i.designId), couponCode, delivery }) });
        } catch (e) {
          quote = null;
          return;
        }
        const gone = [];
        let changed = false;
        let synced = false;
        const keep = cart.filter((item, i) => {
          const q = quote.items[i];
          if (!q || q.designId !== item.designId) return true;
          if (q.gone) { gone.push(tr(item.productName)); return false; }
          if (q.price !== item.price) { item.price = q.price; changed = true; }
          // Newer servers may also send the pieces; they are the ones that will be ordered.
          if (Array.isArray(q.quantities) && JSON.stringify(q.quantities) !== JSON.stringify(item.quantities || null)) { item.quantities = q.quantities; synced = true; }
          if (q.copies != null && (q.copies || 1) !== (item.copies || 1)) { item.copies = q.copies; synced = true; }
          return true;
        });
        if (gone.length || changed || synced) POD.setCart(keep);
        if (gone.length) POD.toast(t('cart.gone', { list: gone.join('، ') }), 'error');
        else if (changed && announce) POD.toast(t('cart.pricesUpdated'));
        if (gone.length) return refreshPrices();
      }

      document.getElementById('items').addEventListener('change', (e) => {
        const box = e.target;
        const id = box.dataset.approve || box.dataset.sample;
        if (!id) return;
        const proof = proofOf(id);
        if (!proof) return;
        const a = approvals.get(id) && approvals.get(id).hash === proof.proofHash ? approvals.get(id) : { hash: proof.proofHash, ok: false, sample: false };
        if (box.dataset.approve) a.ok = box.checked;
        else a.sample = box.checked;
        approvals.set(id, a);
        if (box.dataset.approve && box.checked) changed.delete(id);
        saveApprovals();
        updateApproval();
      });
      document.getElementById('checkout').addEventListener('click', (e) => {
        if (e.target.closest('[data-next-proof]')) goToNextProof();
      });
      document.getElementById('items').addEventListener('click', (e) => {
        const retry = e.target.closest('[data-proof-retry]');
        if (retry) { loadProof(retry.dataset.proofRetry, { force: true }); paintProof(retry.dataset.proofRetry); return; }
        const btn = e.target.closest('[data-remove]');
        if (!btn) return;
        const cart = POD.getCart();
        cart.splice(Number(btn.dataset.remove), 1);
        POD.setCart(cart);
        render();
      });

      const form = document.getElementById('checkout');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const missing = [...form.querySelectorAll('[required]')].find((el) => !el.value.trim());
        if (missing) {
          missing.focus();
          return POD.toast(t('checkout.fill', { field: missing.labels[0]?.textContent || '' }), 'error');
        }
        if (!POD.getCart().every((it) => isApproved(it.designId))) {
          goToNextProof();
          return POD.toast(t('checkout.approvalRequired'), 'error');
        }
        const btn = document.getElementById('place-order');
        placing = true;
        btn.disabled = true;
        btn.textContent = t('checkout.placing');
        try {
          const customer = Object.fromEntries(new FormData(form));
          delete customer.delivery;
          const captchaToken = await orderCaptcha.token();
          // Check prices again right before ordering: the customer must see what they will pay.
          const before = render.total;
          await refreshPrices();
          render();
          if (!POD.getCart().length) throw new Error(t('cart.emptyTitle'));
          if (Math.abs(render.total - before) > 0.009) throw Object.assign(new Error(t('cart.pricesUpdated')), { code: 'priceChanged' });
          const cartNow = POD.getCart();
          // Each item's approval, against the exact proof the customer saw (and whether they want a sample first).
          const approvalsBody = Object.fromEntries(cartNow.map((it) => {
            const a = approvals.get(it.designId);
            return [it.designId, { proofHash: proofOf(it.designId).proofHash, ...(a && a.sample && PODProof.pieces(proofOf(it.designId)) > 1 ? { sample: true } : {}) }];
          }));
          const order = await POD.api('/api/orders', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ customer, designIds: cartNow.map((i) => i.designId), expectedTotal: render.total, delivery, approvals: approvalsBody, ...(captchaToken ? { captchaToken } : {}), ...(quote && quote.coupon && couponCode ? { couponCode } : {}) }),
          });
          POD.setCart([]);
          approvals.clear();
          saveApprovals();
          location.href = '/order?id=' + encodeURIComponent(order.id) + '&new=1';
        } catch (err) {
          orderCaptcha.reset();
          if (err.code === 'priceChanged' || err.code === 'designGone' || err.code === 'designOrdered' || /^coupon/.test(err.code || '')) {
            await refreshPrices();
            render();
          }
          placing = false;
          btn.textContent = t('checkout.place');
          if (err.code === 'proofChanged' || err.code === 'approvalRequired') {
            // Fetch every proof again: the ones that changed lose their approval and are shown anew.
            await Promise.all(POD.getCart().map((it) => loadProof(it.designId, { force: true })));
            render();
            goToNextProof();
            POD.toast(err.code === 'proofChanged' ? t('proof.changed') : err.message || t('checkout.approvalRequired'), 'error');
            return;
          }
          POD.toast(err.message, 'error');
          updateApproval();
        }
      });

      // CAPTCHA: checked silently while the customer fills in the form (a box only if Cloudflare asks).
      const orderCaptcha = POD.captcha(document.getElementById('cap-order'));
      form.addEventListener('focusin', () => orderCaptcha.prepare(), { once: true });
      document.querySelectorAll('input[name="delivery"]').forEach((r) => r.addEventListener('change', () => {
        if (!r.checked) return;
        delivery = r.value === 'express' ? 'express' : 'standard';
        try { sessionStorage.setItem('pod-delivery', delivery); } catch (e) { /* private mode */ }
        render();
        refreshPrices().then(render);
      }));

      // Coupon: apply / remove.
      const applyCoupon = async () => {
        const code = document.getElementById('coupon').value.trim().toUpperCase().replace(/\s+/g, '');
        setCoupon(code);
        document.getElementById('coupon').blur();
        await refreshPrices();
        render();
        if (code && quote && quote.couponError) setCoupon('');
      };
      document.getElementById('coupon-apply').addEventListener('click', applyCoupon);
      document.getElementById('coupon').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); applyCoupon(); } });
      document.getElementById('coupon-remove').addEventListener('click', async () => {
        setCoupon('');
        document.getElementById('coupon').value = '';
        await refreshPrices();
        render();
      });

      // Signed-in customers: their details are filled in and the order is saved to their account.
      async function prefillAccount() {
        let me = null;
        try { me = (await POD.api('/api/account')).customer; } catch (e) { me = null; }
        const note = document.getElementById('acct-note');
        if (!me) {
          note.innerHTML = `${esc(t('acct.checkoutGuest'))} <a href="/account?next=cart">${esc(t('acct.signIn'))}</a>`;
          return;
        }
        note.textContent = t('acct.checkoutAs', { name: me.name });
        const fill = (id, v) => { const el = document.getElementById(id); if (el && !el.value && v) el.value = v; };
        fill('name', me.name);
        fill('phone', me.phone);
        fill('email', me.email);
        if (me.address) {
          fill('governorate', me.address.governorate);
          fill('city', me.address.city);
          fill('address', me.address.address);
          fill('notes', me.address.notes);
        }
      }

      renderGovernorates();
      render();
      prefillAccount();
      refreshPrices({ announce: true }).then(render);
      document.addEventListener('pod:langchange', () => { renderGovernorates(); render(); });
      // The cart changed in another tab (an order placed there, an item added).
      window.addEventListener('storage', (e) => { if (e.key === 'pod-cart-v2') refreshPrices().then(render); });
    })();
  </script>
</body>
</html>
