  <style>
    /* A long name list never widens the page: the proof keeps to its column, long cells wrap. */
    .cart-entry, .cart-proof, .cart-proof-inner > *, .proof > *, .proof-names { min-width: 0; }
    .cart-proof-inner, .proof { grid-template-columns: minmax(0, 1fr); }
    .proof-table td { white-space: normal; overflow-wrap: anywhere; min-width: 4.5em; }
    .proof-table td:first-child { white-space: nowrap; min-width: 0; }
    /* "e.g. EID20" as written (the code itself is typed in capitals). */
    #coupon::placeholder { text-transform: none; }
    /* Checkout: errors at the field */
    .field-err { color: var(--bad); font-size: 13px; font-weight: 600; margin: 5px 0 0; line-height: 1.45; }
    #checkout [aria-invalid="true"] { border-color: var(--bad); }
    .field-hint { margin: 4px 0 0; font-size: 12.5px; color: var(--ink-3); line-height: 1.45; }
    .sample-date { margin: 0; font-size: 13px; font-weight: 700; color: var(--ink-2); }
    /* Photo prints: prints per size, and the photos the check flagged */
    .proof-spec > .photo-sizes-row { grid-column: 1 / -1; }
    .photo-sizes { display: grid; gap: 2px; }
    .photo-size b { font-weight: 700; color: var(--ink-2); }
    .proof-spec .photo-sizes { font-weight: 600; }
    .proof-spec .photo-size b { color: var(--ink); }
    .photo-flags { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; margin: 8px 0 0; padding: 0; }
    .photo-flags li { display: grid; gap: 2px; justify-items: center; font-size: 12px; font-weight: 700; }
    .photo-flags img { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; border: 1px solid #f3d79b; background: #fff; }
    .photo-flags-hint { margin: 6px 0 0; font-size: 12.5px; }
    /* A checked proof folds to one line (it opens again on demand) */
    .proof-fold { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; }
    .proof-fold .approve-check { flex: 1 1 180px; }
    .approve-box .proof-toggle { justify-self: start; }
    .device-orders { margin-top: 16px; padding: 16px 18px; }
    .device-orders h2 { font-size: 17px; margin: 0 0 4px; }
    .device-orders ul { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 8px; }
    .device-orders li { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
    /* Phones: the total and the way to the order form stay at the bottom */
    .cart-bar, .cart-bar[hidden] { display: none; }
    @media (max-width: 960px) {
      .cart-bar:not([hidden]) { position: fixed; inset-inline: 0; bottom: 0; z-index: 60; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 16px calc(8px + env(safe-area-inset-bottom)); background: #fff; border-top: 1px solid var(--line); box-shadow: 0 -4px 14px rgba(20, 24, 33, .08); }
      .cart-bar-total { display: grid; line-height: 1.25; min-width: 0; }
      .cart-bar-total strong { font-size: 17px; }
      body.has-cart-bar { padding-bottom: 64px; }
      body.has-cart-bar #toast-root { bottom: calc(76px + env(safe-area-inset-bottom)); }
    }
  </style>

  <script>
    (async () => {
      const { money, esc, t, tr } = POD;
      const { pricing, governorates, delivery: deliveryInfo, products = [] } = await POD.loadCatalog();
      // Delivery speed (standard 5 business days, express 2 for a fee), kept for this visit.
      let delivery = 'standard';
      try { delivery = sessionStorage.getItem('pod-delivery') === 'express' ? 'express' : 'standard'; } catch (e) { /* private mode */ }
      const expressFee = () => (quote && quote.deliveryOptions ? quote.deliveryOptions.find((d) => d.speed === 'express').fee : (deliveryInfo ? deliveryInfo.expressFee : 0));
      if (new URLSearchParams(location.search).get('added')) {
        POD.toast(t('cart.added'));
        history.replaceState(null, '', '/cart');
      }

      function renderGovernorates() {
        const sel = document.getElementById('governorate');
        const current = sel.value;
        sel.innerHTML = `<option value="">${esc(t('checkout.choose'))}</option>` +
          governorates.map((g) => `<option value="${g.id}">${esc(tr(g.name))}</option>`).join('');
        sel.value = current;
      }

      // One artwork in several colours / sizes: quantities = [{ color, size, qty, unitPrice }].
      const qtyLines = (item) => (Array.isArray(item.quantities) ? item.quantities.filter((l) => l && Number(l.qty) > 0) : []);
      const piecesText = (n) => t('qty.pieces.' + (n === 1 ? 'one' : n === 2 ? 'two' : n % 100 >= 3 && n % 100 <= 10 ? 'few' : 'many'), { n: POD.num(n) });
      function qtyGroups(lines) {
        const groups = new Map();
        for (const l of lines) {
          const c = l.color || {};
          const key = c.id || tr(c.name) || '';
          if (!groups.has(key)) groups.set(key, { color: c, lines: [] });
          groups.get(key).lines.push(l);
        }
        return [...groups.values()];
      }
      /** Black: S×2 · M×5 / White: M×2 (one line per colour). */
      function qtyBreakdown(lines) {
        return `<div class="qty-break" aria-label="${esc(t('qty.breakdown'))}">${qtyGroups(lines).map((g) => `
          <div class="qty-line">${g.color.hex ? `<span class="qty-dot" style="background:${esc(g.color.hex)}"></span>` : ''}${tr(g.color.name) ? `<span class="qty-cname">${esc(tr(g.color.name))}:</span>` : ''}
            ${g.lines.map((l) => `<span class="qty-chip">${l.size && tr(l.size.label) ? `${esc(tr(l.size.label))}×` : '×'}<b>${esc(POD.num(Number(l.qty)))}</b></span>`).join('')}
          </div>`).join('')}</div>`;
      }
      // ---------- Photo prints: what is printed in each size ----------
      const countKey = (n) => (n === 1 ? 'one' : n === 2 ? 'two' : n % 100 >= 3 && n % 100 <= 10 ? 'few' : 'many');
      const counted = (base, n) => t(`${base}.${countKey(n)}`, { n: POD.num(n) });
      const photoProduct = () => products.find((p) => p.id === 'photoprints') || null;
      /** The border chosen for the set (the product's first choice when none was kept). */
      function photoBorder(proof) {
        const chosen = proof.options && proof.options.border;
        if (chosen && chosen.name) return tr(chosen.name);
        const p = photoProduct();
        const opt = p && (p.options || []).find((o) => o.id === 'border');
        return opt && opt.choices[0] ? tr(opt.choices[0].name) : '';
      }
      /** [{ size, photos, prints, sum }] in the shop's size order; sums only when they add up to the item's price. */
      function photoSizes(proof, item) {
        const p = photoProduct();
        const order = p ? p.sizes.map((z) => z.id) : [];
        const groups = new Map();
        for (const ph of proof.photos || []) {
          const id = ph.size && ph.size.id;
          if (!groups.has(id)) groups.set(id, { size: ph.size || {}, photos: 0, prints: 0 });
          const g = groups.get(id);
          g.photos += 1;
          g.prints += Number(ph.copies) || 1;
        }
        const list = [...groups.values()].sort((a, b) => order.indexOf(a.size.id) - order.indexOf(b.size.id));
        if (p && item) {
          const optPrice = (sizeId) => (p.options || []).reduce((sum, o) => {
            const chosen = proof.options && proof.options[o.id];
            const c = chosen && o.choices.find((x) => x.id === chosen.id);
            return sum + (!c ? 0 : typeof c.price === 'number' ? c.price : (c.price && c.price[sizeId]) || 0);
          }, 0);
          for (const g of list) {
            const z = p.sizes.find((x) => x.id === g.size.id);
            g.sum = z ? Math.round((Number(p.basePrice) + (Number(z.surcharge) || 0) + optPrice(z.id)) * g.prints * 100) / 100 : null;
          }
          const total = list.reduce((n, g) => n + (g.sum || 0), 0);
          if (list.some((g) => g.sum == null) || Math.abs(total - item.price) > 0.009) list.forEach((g) => { g.sum = null; });
        }
        return list;
      }
      /** "10 × 15 cm: 25 photos · 29 prints · EGP 435", one line per size. */
      const photoSizesHtml = (list) => `<span class="photo-sizes">${list.map((g) => `<span class="photo-size"><b><bdi>${esc(tr(g.size.label))}</bdi></b>: ${esc(counted('cart.photos', g.photos))} · ${esc(counted('cart.prints', g.prints))}${g.sum != null ? ` · ${esc(money(g.sum))}` : ''}</span>`).join('')}</span>`;
      /** The photo set's proof: sizes instead of one "size", plural warnings, the flagged photos shown by number. */
      function photoProofHtml(proof, item) {
        const checks = ((proof.preflight && proof.preflight.checks) || []).map((c) => (c && c.id === 'photoLowRes' ? { ...c, id: 'photoLowRes.' + countKey(Number(c.params && c.params.count) || 0) } : c));
        const tpl = document.createElement('template');
        tpl.innerHTML = PODProof.html({ ...proof, version: null, size: {}, quantities: null, copies: 1, preflight: { ...(proof.preflight || { status: 'pass' }), checks } });
        const dl = tpl.content.querySelector('.proof-spec');
        if (dl) {
          const row = (label, html, cls) => Object.assign(document.createElement('div'), { className: cls || '', innerHTML: `<dt>${esc(label)}</dt><dd>${html}</dd>` });
          const prints = (proof.photos || []).reduce((n, ph) => n + (Number(ph.copies) || 1), 0);
          const after = dl.children[1] || null;
          const border = photoBorder(proof);
          const rows = [
            border ? row(t('cart.photoBorder'), esc(border)) : null,
            row(t('cart.photoSizes'), `${photoSizesHtml(photoSizes(proof, item))}<span class="muted small">${esc(counted('cart.photos', (proof.photos || []).length))} · ${esc(counted('cart.prints', prints))}</span>`, 'photo-sizes-row'),
          ].filter(Boolean);
          for (const r of rows.reverse()) dl.insertBefore(r, after ? after.nextSibling : null);
        }
        // The low-resolution photos, small and numbered like on the photos page.
        const low = checks.find((c) => c && /^photoLowRes/.test(c.id));
        const warn = tpl.content.querySelector('.pf-warn > div, .pf-fail > div');
        if (low && warn) {
          const nums = String((low.params && low.params.photos) || '').split(/\s*,\s*/).map(Number).filter(Boolean);
          const shown = nums.map((n) => (proof.photos || []).find((ph) => ph.n === n)).filter((ph) => ph && ph.url).slice(0, 12);
          if (shown.length) {
            warn.insertAdjacentHTML('beforeend', `<ul class="photo-flags">${shown.map((ph) => `<li><img src="${esc(ph.url)}" alt="${esc(t('proof.photoNo', { n: POD.num(ph.n) }))}" loading="lazy"><span>${esc(POD.num(ph.n))}</span></li>`).join('')}</ul><p class="photo-flags-hint">${esc(t('proof.photoNoHint'))}</p>`);
          }
        }
        return tpl.innerHTML;
      }
      const photoNote = () => `<p class="proof-screen-note"><svg class="pf-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg><span>${esc(t('proof.photoNote'))}</span></p>`;

      function itemMeta(item) {
        // Photo prints: the paper and border, then the prints per size once the proof (with every photo) is here.
        if (item.productId === 'photoprints') {
          const proof = proofOf(item.designId);
          if (!proof || !Array.isArray(proof.photos)) return `${esc(tr(item.colorName))} · ${esc(tr(item.sizeLabel))}`;
          const border = photoBorder(proof);
          return `${esc(tr(item.colorName))}${border ? ` · ${esc(border)}` : ''}${photoSizesHtml(photoSizes(proof, item))}`;
        }
        const lines = qtyLines(item);
        const isNames = Boolean(item.merge) || (!lines.length && item.copies > 1);
        const names = isNames ? (item.merge && item.merge.count) || item.copies : 0;
        const pieces = Math.max(1, Number(item.copies) || lines.reduce((n, l) => n + Number(l.qty), 0) || 1);
        const one = lines.length === 1 ? lines[0] : null;
        const printed = esc(t('cart.printed', { sides: item.sides.map(tr).join(' + ') }));
        const badge = names > 1 ? `<span class="cart-copies">${esc(t(names % 100 >= 3 && names % 100 <= 10 ? 'cart.copies.few' : 'cart.copies', { n: POD.num(names) }))}</span>`
          : !isNames && pieces > 1 ? `<span class="qty-pieces">${esc(piecesText(pieces))}</span>` : '';
        if (lines.length > 1) return `${badge}${qtyBreakdown(lines)}${printed}`;
        const color = one && one.color ? one.color.name : item.colorName;
        const size = one && one.size ? one.size.label : item.sizeLabel;
        return `${esc(tr(color))} · ${esc(tr(size))}${badge ? ' · ' + badge : ''}<br>${printed}`;
      }
      /** The price for all pieces; with one price per piece, that price under it. */
      function itemPrice(item) {
        const lines = qtyLines(item);
        const pieces = Math.max(1, Number(item.copies) || lines.reduce((n, l) => n + Number(l.qty), 0) || 1);
        const units = new Set(lines.map((l) => l.unitPrice).filter((u) => u != null));
        const each = pieces > 1 && units.size <= 1 ? ` <span class="qty-each">${esc(t('qty.each', { price: money(Math.round(item.price / pieces * 100) / 100) }))}</span>` : '';
        return esc(money(item.price)) + each;
      }

      // ---------- Proofs: every item is checked and approved before the order can be placed ----------
      // designId -> { state: 'loading' | 'ok' | 'error', proof, error }
      const proofs = new Map();
      // designId -> { hash, ok, sample }: what the customer ticked, against which proof.
      const approvals = new Map();
      // Designs whose proof changed after the customer had approved it.
      const changed = new Set();
      // Approved proofs fold to one line; the ones the customer opened again stay open.
      const expanded = new Set();
      const APPROVALS_KEY = 'pod-proof-ok';
      try {
        const saved = JSON.parse(sessionStorage.getItem(APPROVALS_KEY) || '{}');
        for (const [id, a] of Object.entries(saved)) if (a && a.hash) approvals.set(id, { hash: a.hash, ok: Boolean(a.ok), sample: Boolean(a.sample) });
      } catch (e) { /* nothing remembered */ }
      const saveApprovals = () => {
        try { sessionStorage.setItem(APPROVALS_KEY, JSON.stringify(Object.fromEntries(approvals))); } catch (e) { /* private mode */ }
      };
      let placing = false;

      const proofOf = (id) => { const p = proofs.get(id); return p && p.state === 'ok' ? p.proof : null; };
      function isApproved(id) {
        const proof = proofOf(id);
        const a = approvals.get(id);
        return Boolean(proof && a && a.ok && a.hash === proof.proofHash);
      }
      async function loadProof(id, { force = false } = {}) {
        const cur = proofs.get(id);
        if (cur && !force && cur.state !== 'error') return cur.promise;
        const entry = { state: 'loading' };
        entry.promise = POD.api('/api/designs/' + encodeURIComponent(id) + '/proof').then((proof) => {
          Object.assign(entry, { state: 'ok', proof });
          const a = approvals.get(id);
          // Approved an older version: ask again.
          if (a && a.ok && a.hash !== proof.proofHash) {
            approvals.delete(id);
            changed.add(id);
            saveApprovals();
          }
        }, (err) => Object.assign(entry, { state: 'error', error: err.message }));
        // Keep showing the proof already on screen while a newer one loads.
        if (!force || !cur || cur.state !== 'ok') proofs.set(id, entry);
        await entry.promise;
        proofs.set(id, entry);
        paintProof(id);
        updateApproval();
        return entry.promise;
      }
      function proofSlot(item, i) {
        const id = item.designId;
        const st = proofs.get(id);
        const ok = isApproved(id);
        const head = `<h3 class="cart-proof-title" id="proof-h-${i}"><span>${esc(t('proof.title'))} · ${esc(tr(item.productName))}</span><span class="cart-proof-ok">✓ ${esc(t('proof.approved'))}</span></h3>`;
        let body;
        if (!st || st.state === 'loading') {
          body = `<div class="cart-proof-state" role="status"><div class="spinner"></div>${esc(t('proof.loading'))}</div>`;
        } else if (st.state === 'error') {
          body = `<div class="cart-proof-state" role="alert"><p>${esc(t('proof.loadFailed'))} ${esc(st.error || '')}</p><button class="btn btn-sm" type="button" data-proof-retry="${esc(id)}">${esc(t('proof.retry'))}</button></div>`;
        } else {
          const proof = st.proof;
          const a = approvals.get(id);
          const sample = Boolean(a && a.sample);
          const photos = Array.isArray(proof.photos);
          const sampleBy = sample && quote && quote.delivery && quote.delivery.sampleDays ? quote.delivery.by : null;
          if (ok && !expanded.has(id)) {
            // Checked: one line (the box stays here to untick; the proof opens on demand).
            body = `
              <div class="proof-fold">
                <label class="approve-check" for="ok-${i}"><input type="checkbox" id="ok-${i}" data-approve="${esc(id)}" checked><span>${esc(t('proof.checkedShort'))}</span></label>
                ${sample ? `<span class="item-sample">${esc(t('item.sampleFirst'))}</span>` : ''}
                <button class="btn btn-sm proof-toggle" type="button" id="tog-${i}" data-proof-toggle="${esc(id)}" aria-expanded="false">${esc(t('proof.show'))}</button>
              </div>`;
          } else {
            body = `
              ${changed.has(id) ? `<p class="approve-changed" role="alert">${esc(t('proof.changed'))}</p>` : ''}
              ${photos ? photoProofHtml(proof, cartItemOf(id)) : PODProof.html(proof)}
              <div class="approve-box">
                ${photos ? photoNote() : PODProof.screenNote()}
                <label class="approve-check" for="ok-${i}"><input type="checkbox" id="ok-${i}" data-approve="${esc(id)}"${ok ? ' checked' : ''}><span>${esc(t(photos ? 'proof.okPhotos' : 'proof.ok'))}</span></label>
                ${PODProof.pieces(proof) > 1 && !photos ? `<label class="approve-check sample" for="sample-${i}"><input type="checkbox" id="sample-${i}" data-sample="${esc(id)}"${sample ? ' checked' : ''}><span>${esc(t('proof.sample'))}</span></label>` : ''}
                ${sampleBy ? `<p class="sample-date" role="status">${esc(t('cart.sampleDate', { date: POD.day(sampleBy) }))}</p>` : ''}
                ${ok ? `<button class="btn btn-sm proof-toggle" type="button" id="tog-${i}" data-proof-toggle="${esc(id)}" aria-expanded="true">${esc(t('proof.hide'))}</button>` : ''}
              </div>`;
          }
        }
        const folded = ok && st && st.state === 'ok' && !expanded.has(id);
        return `<section class="cart-proof${ok ? ' ok' : ''}${folded ? ' folded' : ''}" data-proof-for="${esc(id)}" data-index="${i}" aria-labelledby="proof-h-${i}"><div class="cart-proof-inner">${head}${body}</div></section>`;
      }
      const cartItemOf = (id) => POD.getCart().find((it) => it.designId === id) || null;
      const slotOf = (id) => [...document.querySelectorAll('[data-proof-for]')].find((el) => el.dataset.proofFor === id) || null;
      /** Redraw one item's proof (after it loads) without touching the rest of the page. */
      function paintProof(id) {
        const cart = POD.getCart();
        const i = cart.findIndex((it) => it.designId === id);
        const slot = slotOf(id);
        if (i < 0 || !slot) return;
        const focused = document.activeElement && slot.contains(document.activeElement) ? document.activeElement.id : null;
        slot.outerHTML = proofSlot(cart[i], i);
        // A photo set's line shows its sizes once the proof (with every photo) is here.
        const meta = [...document.querySelectorAll('[data-meta-for]')].find((el) => el.dataset.metaFor === id);
        if (meta) meta.innerHTML = itemMeta(cart[i]);
        if (focused && document.getElementById(focused)) document.getElementById(focused).focus({ preventScroll: true });
      }
      /** "Place order" only once every item's current proof is approved. */
      function updateApproval() {
        const cart = POD.getCart();
        const done = cart.filter((it) => isApproved(it.designId)).length;
        const all = cart.length > 0 && done === cart.length;
        const btn = document.getElementById('place-order');
        if (!placing) btn.disabled = !all;
        const status = document.getElementById('approve-status');
        status.classList.toggle('done', all);
        status.innerHTML = all ? `✓ ${esc(t('proof.approved'))}`
          : `${esc(t('checkout.approveAll', { done: POD.num(done), total: POD.num(cart.length) }))} <button type="button" class="link-btn" data-next-proof>${esc(t('checkout.approveGo'))}</button>`;
        document.querySelectorAll('[data-proof-for]').forEach((el) => {
          const ok = isApproved(el.dataset.proofFor);
          el.classList.toggle('ok', ok);
          if (ok) el.classList.remove('needs');
        });
      }
      function goToNextProof() {
        const cart = POD.getCart();
        const next = cart.find((it) => !isApproved(it.designId));
        if (!next) return;
        const slot = [...document.querySelectorAll('[data-proof-for]')].find((el) => el.dataset.proofFor === next.designId);
        if (!slot) return;
        slot.classList.add('needs');
        slot.scrollIntoView({ behavior: 'smooth', block: 'start' });
        const box = slot.querySelector('[data-approve]') || slot.querySelector('[data-proof-retry]');
        if (box) box.focus({ preventScroll: true });
      }

      /** "Saved for later": shown under the cart (also when the cart itself is empty). */
      function renderSaved() {
        const saved = POD.getSaved();
        const box = document.getElementById('saved');
        box.hidden = !saved.length;
        if (!saved.length) return;
        document.getElementById('saved-title').textContent = t('cart.savedTitle', { n: POD.num(saved.length) });
        document.getElementById('saved-items').innerHTML = saved.map((item) => `
          <div class="cart-item saved-item">
            <img src="${esc(item.previewUrl)}" alt="${esc(t('cart.preview', { product: tr(item.productName) }))}">
            <div>
              <h3>${esc(tr(item.productName))}</h3>
              <div class="meta">${itemMeta(item)}</div>
              <div class="actions">
                <button class="btn btn-sm btn-primary" data-to-cart="${esc(item.designId)}">${esc(t('cart.moveToCart'))}</button>
                <button class="btn btn-sm btn-danger" data-saved-remove="${esc(item.designId)}">${esc(t('cart.remove'))}</button>
              </div>
            </div>
            <div class="price">${itemPrice(item)}</div>
          </div>`).join('');
      }
      /** Saved items: today's prices, and ones that were ordered or are gone dropped. */
      async function refreshSaved() {
        const saved = POD.getSaved();
        if (!saved.length) return;
        let q;
        try {
          q = await POD.api('/api/cart/quote', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ designIds: saved.map((i) => i.designId) }) });
        } catch (e) {
          return;
        }
        let changed = false;
        const keep = saved.filter((item, i) => {
          const r = q.items[i];
          if (!r || r.designId !== item.designId) return true;
          if (r.gone) { changed = true; return false; }
          if (r.price !== item.price) { item.price = r.price; changed = true; }
          return true;
        });
        if (changed) {
          POD.setSaved(keep);
          renderSaved();
        }
      }

      function render() {
        renderSaved();
        const cart = POD.getCart();
        const focused = document.activeElement && document.activeElement.closest && document.activeElement.closest('#items') ? document.activeElement.id : null;
        document.getElementById('empty').hidden = cart.length > 0;
        // The note about editing quantities and duplicating designs doesn't apply to photo sets.
        document.getElementById('cart-note').hidden = cart.length > 0 && cart.every((it) => it.productId === 'photoprints');
        document.getElementById('cart-layout').hidden = cart.length === 0;
        // An empty cart: the orders placed from this device, to find them again.
        document.getElementById('device-orders').innerHTML = cart.length ? '' : PODAftercare.deviceOrdersHtml();
        document.getElementById('items').innerHTML = cart.map((item, i) => `
          <div class="cart-entry">
          <div class="cart-item">
            <img src="${esc(item.previewUrl)}" alt="${esc(t('cart.preview', { product: tr(item.productName) }))}">
            <div>
              <h3>${esc(tr(item.productName))}</h3>
              <div class="meta" data-meta-for="${esc(item.designId)}">${itemMeta(item)}</div>
              <div class="actions">
                ${item.productId === 'dtfsheet' || item.productId === 'photoprints' ? '' : item.bookId ? `<a class="btn btn-sm" href="/book?b=${encodeURIComponent(item.bookId)}&cart=${i}">${esc(t('cart.edit'))}</a>` : `<a class="btn btn-sm" href="/editor?design=${encodeURIComponent(item.designId)}&cart=${i}">${esc(t('cart.edit'))}</a>
                ${item.bookId ? '' : `<a class="btn btn-sm" href="/editor?design=${encodeURIComponent(item.designId)}">${esc(t('cart.duplicate'))}</a>`}`}
                <button class="btn btn-sm" data-later="${esc(item.designId)}">${esc(t('cart.saveLater'))}</button>
                <button class="btn btn-sm btn-danger" data-remove="${i}">${esc(t('cart.remove'))}</button>
              </div>
            </div>
            <div class="price">${itemPrice(item)}</div>
          </div>
          ${proofSlot(item, i)}
          </div>`).join('');
        if (focused && document.getElementById(focused)) document.getElementById(focused).focus();
        for (const item of cart) if (!proofs.has(item.designId)) loadProof(item.designId);
        updateApproval();
        const subtotal = Math.round(cart.reduce((s, i) => s + i.price, 0) * 100) / 100;
        const freeOver = quote ? quote.freeShippingOver : pricing.freeShippingOver;
        const applied = quote && quote.coupon && couponCode ? quote.coupon : null;
        const discount = applied ? applied.discount : 0;
        // The shop's own numbers when its answer is for exactly this cart (same items, same coupon);
        // until then the same rule as the shop's: free shipping goes by the subtotal before any discount.
        const fresh = quoteFits(cart) && Boolean(quote.coupon) === Boolean(applied);
        const baseShipping = fresh && typeof quote.baseShipping === 'number' ? quote.baseShipping
          : (applied && applied.freeShipping) || subtotal >= freeOver ? 0 : (quote ? quote.shippingFlat : pricing.shipping);
        const expressNow = delivery === 'express' ? expressFee() : 0;
        const shipping = Math.round((baseShipping + expressNow) * 100) / 100;
        render.total = fresh && typeof quote.total === 'number' && quote.delivery && quote.delivery.speed === delivery
          ? quote.total : Math.round((subtotal - discount + shipping) * 100) / 100;
        document.querySelectorAll('input[name="delivery"]').forEach((r) => { r.checked = r.value === delivery; });
        // Standard costs the normal shipping fee; express adds its fee on top.
        document.getElementById('dlv-fee-standard').textContent = baseShipping ? t('delivery.feeStandard', { price: money(baseShipping) }) : t('delivery.feeFree');
        document.getElementById('dlv-fee-express').textContent = baseShipping ? t('delivery.feeExpress', { fee: money(expressFee()) }) : '+' + money(expressFee());
        for (const opt of (quote && quote.deliveryOptions) || []) {
          const el = document.getElementById('dlv-by-' + opt.speed);
          if (el) el.textContent = t('delivery.by', { date: POD.day(opt.by) });
        }
        document.getElementById('discount-line').hidden = !applied;
        document.getElementById('coupon-code').textContent = applied ? applied.code : '';
        document.getElementById('discount').textContent = applied ? (applied.freeShipping && !discount ? t('coupon.freeShipping') : '-' + money(discount)) : '';
        const msg = document.getElementById('coupon-msg');
        // A code the shop refused: its reason stays under the field (with the code) until the customer changes it.
        const refused = couponCode && quote && quote.couponError ? quote.couponError : !couponCode && couponNote ? couponNote.msg : '';
        msg.textContent = refused || (applied ? t('coupon.applied') : '');
        msg.classList.toggle('bad', Boolean(refused));
        markCoupon(Boolean(refused));
        if (document.activeElement !== document.getElementById('coupon')) document.getElementById('coupon').value = couponCode || (couponNote ? couponNote.code : '');
        document.getElementById('subtotal').textContent = money(subtotal);
        document.getElementById('shipping').textContent = baseShipping ? money(baseShipping) : t('free');
        document.getElementById('express-line').hidden = !expressNow;
        document.getElementById('express-fee').textContent = expressNow ? money(expressNow) : '';
        document.getElementById('bar-total').textContent = money(render.total);
        updateBar();
        document.getElementById('total').textContent = money(render.total);
        document.getElementById('free-note').textContent = baseShipping ? t('checkout.freeOver', { price: money(freeOver) }) : '';
      }

      // Today's prices from the shop (the cart keeps the price from when an item was added).
      let quote = null;
      /** Is the shop's last answer about exactly these items (at the prices the cart shows)? */
      const quoteFits = (cart) => Boolean(quote && Array.isArray(quote.items) && quote.items.length === cart.length
        && quote.items.every((q, i) => q && q.designId === cart[i].designId && q.price === cart[i].price));
      /** Pieces of a cart item, like the shop counts them (copies, or the colour/size lines). */
      const piecesOf = (item) => {
        const proof = proofOf(item.designId);
        return proof ? PODProof.pieces(proof) : Math.max(1, Number(item.copies) || qtyLines(item).reduce((n, l) => n + Number(l.qty), 0) || 1);
      };
      /** "Print one sample first" counts only for items still in the cart with more than one piece. */
      const wantsSample = (cart) => cart.some((it) => { const a = approvals.get(it.designId); return Boolean(a && a.sample) && piecesOf(it) > 1; });
      /** Ticks kept for items no longer in the cart are forgotten. */
      function forgetRemoved(cart) {
        const ids = new Set(cart.map((it) => it.designId));
        let dropped = false;
        for (const id of [...approvals.keys()]) if (!ids.has(id)) { approvals.delete(id); dropped = true; }
        if (dropped) saveApprovals();
      }
      // The coupon code the customer typed (kept for this visit).
      let couponCode = '';
      try { couponCode = sessionStorage.getItem('pod-coupon') || ''; } catch (e) { couponCode = ''; }
      // A code the shop refused (its reason, and the code as typed), shown at the coupon field.
      let couponNote = null;
      function markCoupon(bad) {
        const el = document.getElementById('coupon');
        if (bad) { el.setAttribute('aria-invalid', 'true'); el.setAttribute('aria-describedby', 'coupon-msg'); } else { el.removeAttribute('aria-invalid'); el.removeAttribute('aria-describedby'); }
      }
      const setCoupon = (code) => {
        couponCode = code;
        try { if (code) sessionStorage.setItem('pod-coupon', code); else sessionStorage.removeItem('pod-coupon'); } catch (e) { /* private mode */ }
      };
      async function refreshPrices({ announce = false } = {}) {
        const cart = POD.getCart();
        forgetRemoved(cart);
        if (!cart.length) { quote = null; return; }
        try {
          quote = await POD.api('/api/cart/quote', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ designIds: cart.map((i) => i.designId), couponCode, delivery, sample: wantsSample(cart), phone: (document.getElementById('phone') || {}).value || undefined }) });
        } catch (e) {
          quote = null;
          return;
        }
        const gone = [];
        let ordered = false;
        let changed = false;
        let synced = false;
        const keep = cart.filter((item, i) => {
          const q = quote.items[i];
          if (!q || q.designId !== item.designId) return true;
          // Already ordered (the answer to that order got lost, or another tab ordered it): not in the cart any more.
          if (q.gone && (q.ordered || q.orderedIn)) { ordered = true; return false; }
          if (q.gone) { gone.push(tr(item.productName)); return false; }
          if (q.price !== item.price) { item.price = q.price; changed = true; }
          // Newer servers may also send the pieces; they are the ones that will be ordered.
          if (Array.isArray(q.quantities) && JSON.stringify(q.quantities) !== JSON.stringify(item.quantities || null)) { item.quantities = q.quantities; synced = true; }
          if (q.copies != null && (q.copies || 1) !== (item.copies || 1)) { item.copies = q.copies; synced = true; }
          return true;
        });
        if (gone.length || changed || synced || ordered) POD.setCart(keep);
        if (ordered) {
          // Ordered from this tab (its answer got lost): that order, found by this tab's one-time key.
          if (await showPlacedOrder()) return;
          POD.toast(t('cart.alreadyOrdered'));
        }
        if (gone.length) POD.toast(t('cart.gone', { list: gone.join(POD.lang === 'ar' ? '، ' : ', ') }), 'error');
        else if (changed && announce) POD.toast(t('cart.pricesUpdated'));
        if (gone.length) return refreshPrices();
      }

      document.getElementById('items').addEventListener('change', (e) => {
        const box = e.target;
        const id = box.dataset.approve || box.dataset.sample;
        if (!id) return;
        const proof = proofOf(id);
        if (!proof) return;
        const a = approvals.get(id) && approvals.get(id).hash === proof.proofHash ? approvals.get(id) : { hash: proof.proofHash, ok: false, sample: false };
        if (box.dataset.approve) a.ok = box.checked;
        else a.sample = box.checked;
        approvals.set(id, a);
        if (box.dataset.approve && box.checked) changed.delete(id);
        saveApprovals();
        updateApproval();
        if (box.dataset.approve) {
          // Checked: the proof folds to one line (keeping its place on the page); unchecked: it opens again.
          expanded.delete(id);
          const slot = slotOf(id);
          const top = slot ? slot.getBoundingClientRect().top : 0;
          paintProof(id);
          const now = slotOf(id);
          if (now && box.checked && top < 70) now.scrollIntoView({ block: 'start' });
        } else {
          // A sample first moves the expected day: ask the shop again right away.
          refreshPrices().then(render);
        }
      });
      document.getElementById('checkout').addEventListener('click', (e) => {
        if (e.target.closest('[data-next-proof]')) goToNextProof();
      });
      document.getElementById('items').addEventListener('click', (e) => {
        const tog = e.target.closest('[data-proof-toggle]');
        if (tog) {
          const id = tog.dataset.proofToggle;
          if (expanded.has(id)) expanded.delete(id); else expanded.add(id);
          const togId = tog.id;
          paintProof(id);
          const again = document.getElementById(togId);
          if (again) again.focus({ preventScroll: !expanded.has(id) });
          if (!expanded.has(id)) { const slot = slotOf(id); if (slot && slot.getBoundingClientRect().top < 70) slot.scrollIntoView({ block: 'start' }); }
          return;
        }
        const retry = e.target.closest('[data-proof-retry]');
        if (retry) { loadProof(retry.dataset.proofRetry, { force: true }); paintProof(retry.dataset.proofRetry); return; }
        // Save for later / back to the cart: what is ordered (and its price, coupon and shipping) changes.
        const later = e.target.closest('[data-later]');
        if (later) {
          POD.moveItem(later.dataset.later, true);
          POD.toast(t('cart.savedToast'));
          render();
          refreshPrices().then(render);
          return;
        }
        const btn = e.target.closest('[data-remove]');
        if (!btn) return;
        const cart = POD.getCart();
        cart.splice(Number(btn.dataset.remove), 1);
        POD.setCart(cart);
        render();
        // The coupon and shipping depend on what is left: ask the shop again.
        refreshPrices().then(render);
      });

      const form = document.getElementById('checkout');
      // ---------- Field errors: shown under the field, which is scrolled to and focused ----------
      const FIELDS = ['name', 'phone', 'email', 'governorate', 'city', 'address'].map((id) => document.getElementById(id));
      const SERVER_FIELD = { badPhone: 'phone', badEmail: 'email', badGovernorate: 'governorate' };
      // The same refusals in this page's words (to show them again in the other language).
      const SERVER_TEXT = { badPhone: 'checkout.badPhone', badEmail: 'checkout.badEmail', badGovernorate: 'checkout.needGov' };
      const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      /** The same check as the shop's: an Egyptian mobile, Arabic digits and +20 allowed. */
      function egyptMobile(input) {
        let v = String(input || '').replace(/[\u0660-\u0669]/g, (d) => String(d.charCodeAt(0) - 0x660)).replace(/[\u06f0-\u06f9]/g, (d) => String(d.charCodeAt(0) - 0x6f0));
        v = v.replace(/[\s\-().\u200b-\u200f\u202a-\u202e\u2060-\u2069\ufeff\u061c\u00a0\u2010-\u2015\u2212]/g, '');
        if (v.startsWith('+20')) v = '0' + v.slice(3);
        else if (v.startsWith('0020')) v = '0' + v.slice(4);
        if (/^001[0125]\d{8}$/.test(v)) v = v.slice(1);
        else if (/^20 ?1/.test(v) && v.length === 12) v = '0' + v.slice(2);
        return /^01[0125]\d{8}$/.test(v);
      }
      function fieldProblem(el) {
        const v = el.value.trim();
        if (el.required && !v) return el.id === 'governorate' ? t('checkout.needGov') : t('checkout.needField', { field: (el.labels[0] && el.labels[0].textContent) || '' });
        if (el.id === 'phone' && !egyptMobile(v)) return t('checkout.badPhone');
        if (el.id === 'email' && v && !EMAIL_RE.test(v)) return t('checkout.badEmail');
        return '';
      }
      function setFieldError(el, msg, code) {
        const errId = 'err-' + el.id;
        if (msg && code) el.dataset.errCode = code; else delete el.dataset.errCode;
        let p = document.getElementById(errId);
        if (el.dataset.desc == null) el.dataset.desc = el.getAttribute('aria-describedby') || '';
        if (!msg) {
          if (p) p.remove();
          el.removeAttribute('aria-invalid');
          if (el.dataset.desc) el.setAttribute('aria-describedby', el.dataset.desc); else el.removeAttribute('aria-describedby');
          return;
        }
        if (!p) {
          p = Object.assign(document.createElement('p'), { id: errId, className: 'field-err' });
          el.insertAdjacentElement('afterend', p);
        }
        p.textContent = msg;
        el.setAttribute('aria-invalid', 'true');
        el.setAttribute('aria-describedby', [errId, el.dataset.desc].filter(Boolean).join(' '));
      }
      /** Mark every field with a problem; the first one is returned. */
      function checkFields() {
        let first = null;
        for (const el of FIELDS) {
          const msg = fieldProblem(el);
          setFieldError(el, msg);
          if (msg && !first) first = el;
        }
        return first;
      }
      function goToField(el) {
        el.scrollIntoView({ block: 'center', behavior: 'smooth' });
        el.focus({ preventScroll: true });
      }
      // A corrected field loses its error as soon as it is right (it never gains one while typing).
      form.addEventListener('input', (e) => { const el = e.target; if (el.getAttribute && el.getAttribute('aria-invalid') && FIELDS.includes(el) && !fieldProblem(el)) setFieldError(el, ''); });
      form.addEventListener('change', (e) => { const el = e.target; if (el.getAttribute && el.getAttribute('aria-invalid') && FIELDS.includes(el)) setFieldError(el, fieldProblem(el)); });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const bad = checkFields();
        if (bad) return goToField(bad);
        if (!POD.getCart().every((it) => isApproved(it.designId))) {
          goToNextProof();
          return POD.toast(t('checkout.approvalRequired'), 'error');
        }
        const btn = document.getElementById('place-order');
        placing = true;
        btn.disabled = true;
        btn.textContent = t('checkout.placing');
        try {
          // An earlier try may have reached the shop although its answer got lost: show that order.
          if (await showPlacedOrder()) return;
          const customer = Object.fromEntries(new FormData(form));
          delete customer.delivery;
          const captchaToken = await orderCaptcha.token();
          // Check prices again right before ordering: the customer must see what they will pay.
          const before = render.total;
          const codeBefore = couponCode;
          await refreshPrices();
          // The coupon no longer works (e.g. this phone already used it): say why, with the price without it, and order nothing.
          if (codeBefore && quote && quote.couponError) throw Object.assign(new Error(quote.couponError), { code: 'couponRefused' });
          render();
          if (!POD.getCart().length) throw new Error(t('cart.emptyTitle'));
          if (Math.abs(render.total - before) > 0.009) throw Object.assign(new Error(t('cart.pricesUpdated')), { code: 'priceChanged' });
          const cartNow = POD.getCart();
          // Each item's approval, against the exact proof the customer saw (and whether they want a sample first).
          const approvalsBody = Object.fromEntries(cartNow.map((it) => {
            const a = approvals.get(it.designId);
            return [it.designId, { proofHash: proofOf(it.designId).proofHash, ...(a && a.sample && PODProof.pieces(proofOf(it.designId)) > 1 ? { sample: true } : {}) }];
          }));
          const order = await POD.api('/api/orders', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ customer, designIds: cartNow.map((i) => i.designId), expectedTotal: render.total, delivery, orderKey: orderKey(), approvals: approvalsBody, ...(captchaToken ? { captchaToken } : {}), ...(quote && quote.coupon && couponCode ? { couponCode } : {}) }),
          });
          goToOrder(order);
        } catch (err) {
          orderCaptcha.reset();
          // The shop answered (a wrong phone, a changed price…): that try placed nothing, so its key is done.
          if (!err.network) { try { sessionStorage.removeItem('pod-order-key'); } catch (e) { /* private mode */ } }
          // The coupon was refused (here or by the shop): its reason goes at the coupon field and the code comes off,
          // so the total shown is the one without it; the customer sees why before ordering again.
          const couponRefused = /^coupon/.test(err.code || '') && (couponCode || err.code === 'couponRefused');
          if (couponRefused) {
            couponNote = { code: couponCode || (couponNote && couponNote.code) || '', msg: err.message };
            setCoupon('');
          }
          if (err.code === 'priceChanged' || err.code === 'designGone' || err.code === 'designOrdered' || /^coupon/.test(err.code || '')) {
            await refreshPrices();
            render();
          }
          placing = false;
          btn.textContent = t('checkout.place');
          if (err.code === 'proofChanged' || err.code === 'approvalRequired') {
            // Fetch every proof again: the ones that changed lose their approval and are shown anew.
            await Promise.all(POD.getCart().map((it) => loadProof(it.designId, { force: true })));
            render();
            goToNextProof();
            POD.toast(err.code === 'proofChanged' ? t('proof.changed') : err.message || t('checkout.approvalRequired'), 'error');
            return;
          }
          // A field the shop refused (the phone, the email…): the message goes under that field.
          const field = SERVER_FIELD[err.code] && document.getElementById(SERVER_FIELD[err.code]);
          if (field) {
            setFieldError(field, err.message, err.code);
            goToField(field);
          } else {
            POD.toast(err.message, 'error');
            if (couponRefused) document.querySelector('.coupon-box').scrollIntoView({ block: 'center', behavior: 'smooth' });
          }
          updateApproval();
        }
      });

      // ---------- The order's one-time key (see /api/orders/by-key) ----------
      const KEY = 'pod-order-key';
      function orderKey() {
        let k = null;
        try { k = sessionStorage.getItem(KEY); } catch (e) { k = null; }
        if (!k) {
          k = (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}-${Math.random().toString(36).slice(2)}`);
          try { sessionStorage.setItem(KEY, k); } catch (e) { /* private mode: no retry check */ }
        }
        return k;
      }
      function goToOrder(order) {
        // Kept on this device: a guest's way back to the order (account page, empty cart).
        PODAftercare.rememberOrder(order);
        const ordered = new Set((order.items || []).map((i) => i.designId));
        POD.setCart(POD.getCart().filter((it) => !ordered.has(it.designId)));
        try { sessionStorage.removeItem(KEY); } catch (e) { /* private mode */ }
        approvals.clear();
        saveApprovals();
        location.href = '/order?id=' + encodeURIComponent(order.id) + '&new=1';
      }
      async function showPlacedOrder() {
        let k = null;
        try { k = sessionStorage.getItem(KEY); } catch (e) { k = null; }
        if (!k) return false;
        try {
          const order = await POD.api('/api/orders/by-key/' + encodeURIComponent(k));
          if (!order) return false; // not placed: carry on
          goToOrder(order);
          return true;
        } catch (e) {
          return false; // still offline: carry on
        }
      }

      // CAPTCHA: checked silently while the customer fills in the form (a box only if Cloudflare asks).
      const orderCaptcha = POD.captcha(document.getElementById('cap-order'));
      form.addEventListener('focusin', () => orderCaptcha.prepare(), { once: true });
      document.querySelectorAll('input[name="delivery"]').forEach((r) => r.addEventListener('change', () => {
        if (!r.checked) return;
        delivery = r.value === 'express' ? 'express' : 'standard';
        try { sessionStorage.setItem('pod-delivery', delivery); } catch (e) { /* private mode */ }
        render();
        refreshPrices().then(render);
      }));

      // Coupon: apply / remove.
      const applyCoupon = async () => {
        const code = document.getElementById('coupon').value.trim().toUpperCase().replace(/\s+/g, '');
        couponNote = null;
        setCoupon(code);
        document.getElementById('coupon').blur();
        await refreshPrices();
        if (code && quote && quote.couponError) {
          couponNote = { code, msg: quote.couponError };
          setCoupon('');
        }
        render();
      };
      document.getElementById('coupon-apply').addEventListener('click', applyCoupon);
      document.getElementById('coupon').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); applyCoupon(); } });
      // Typing another code: the old refusal goes.
      document.getElementById('coupon').addEventListener('input', () => {
        if (!couponNote) return;
        couponNote = null;
        const msg = document.getElementById('coupon-msg');
        msg.textContent = '';
        msg.classList.remove('bad');
        markCoupon(false);
      });
      document.getElementById('coupon-remove').addEventListener('click', async () => {
        couponNote = null;
        setCoupon('');
        document.getElementById('coupon').value = '';
        await refreshPrices();
        render();
      });

      // Signed-in customers: their details are filled in and the order is saved to their account.
      // undefined until the shop answers; then the signed-in customer, or null for a guest.
      let acctMe;
      function renderAcctNote() {
        if (acctMe === undefined) return;
        const note = document.getElementById('acct-note');
        if (!acctMe) note.innerHTML = `${esc(t('acct.checkoutGuest'))} <a href="/account?next=cart">${esc(t('acct.signIn'))}</a>`;
        else note.textContent = t('acct.checkoutAs', { name: acctMe.name });
      }
      async function prefillAccount() {
        let me = null;
        try { me = (await POD.api('/api/account')).customer; } catch (e) { me = null; }
        acctMe = me || null;
        renderAcctNote();
        if (!me) return;
        const fill = (id, v) => { const el = document.getElementById(id); if (el && !el.value && v) el.value = v; };
        fill('name', me.name);
        fill('phone', me.phone);
        fill('email', me.email);
        if (me.address) {
          fill('governorate', me.address.governorate);
          fill('city', me.address.city);
          fill('address', me.address.address);
          fill('notes', me.address.notes);
        }
      }

      // ---------- Phones: the slim bar at the bottom (total + the way to the order form) ----------
      const bar = document.getElementById('cart-bar');
      let formInView = false;
      function updateBar() {
        const show = POD.getCart().length > 0 && !formInView;
        bar.hidden = !show;
        document.body.classList.toggle('has-cart-bar', show && getComputedStyle(bar).display !== 'none');
      }
      if ('IntersectionObserver' in window) {
        new IntersectionObserver((entries) => {
          formInView = entries.some((en) => en.isIntersecting);
          updateBar();
        }).observe(form);
      }
      window.addEventListener('resize', updateBar);
      document.getElementById('bar-go').addEventListener('click', () => {
        // Proofs left to check come first; then the first empty field, else the order button.
        if (!POD.getCart().every((it) => isApproved(it.designId))) return goToNextProof();
        const empty = FIELDS.find((el) => el.required && !el.value.trim());
        if (empty) return goToField(empty);
        const btn = document.getElementById('place-order');
        btn.scrollIntoView({ block: 'center', behavior: 'smooth' });
        btn.focus({ preventScroll: true });
      });

      // The saved list sits outside the cart's own box (it stays when the cart is empty).
      document.getElementById('saved').addEventListener('click', (e) => {
        const back = e.target.closest('[data-to-cart]');
        const del = e.target.closest('[data-saved-remove]');
        if (back) {
          POD.moveItem(back.dataset.toCart, false);
          render();
          refreshPrices().then(render);
          document.getElementById('items').scrollIntoView({ behavior: 'smooth', block: 'start' });
        } else if (del) {
          POD.setSaved(POD.getSaved().filter((it) => it.designId !== del.dataset.savedRemove));
          render();
        }
      });
      renderGovernorates();
      render();
      prefillAccount();
      refreshSaved();
      // An order placed from this tab whose answer never arrived: go to it instead of showing its items as gone.
      if (!(await showPlacedOrder())) refreshPrices({ announce: true }).then(render);
      document.addEventListener('pod:langchange', () => {
        renderGovernorates();
        render();
        renderAcctNote();
        // Errors under the fields, in the new language (the shop's own refusals by their code).
        for (const el of FIELDS) {
          if (el.getAttribute('aria-invalid') !== 'true') continue;
          const again = fieldProblem(el) || (SERVER_TEXT[el.dataset.errCode] ? t(SERVER_TEXT[el.dataset.errCode]) : '');
          if (again) setFieldError(el, again);
        }
      });
      // The cart changed in another tab (an order placed there, an item added).
      window.addEventListener('storage', (e) => { if (e.key === 'pod-cart-v2') refreshPrices().then(render); });
      // The account's cart arrived (items added on another device, or removed there).
      document.addEventListener('pod:cartsynced', () => refreshPrices().then(render).then(refreshSaved));
    })();
  </script>
</body>
</html>
