  <script src="/js/i18n-quantities.js"></script>
  <script src="/js/i18n-proof.js"></script>
  <script src="/js/i18n-cart.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/site-search.js"></script>
  <script src="/js/proof-ui.js"></script>
  <script src="/js/saved-designs.js"></script>
  <script>
    (async () => {
      const { money, esc, t, tr } = POD;
      // ---------- No connection ----------
      // What the page needs didn't come (no signal, or the site busy): "No connection" and "Try again" in `box`, in the
      // page's language, until it does. A "not found" from the site is not a connection problem: thrown as it is.
      const noConnection = (e) => !(e && e.status) || e.status >= 500;
      async function loadOrRetry(box, load) {
        let last = null;
        for (;;) {
          try {
            const out = await load();
            box.hidden = true;
            box.innerHTML = '';
            return out;
          } catch (e) {
            if (!noConnection(e)) throw e;
            // The same failure again although the site answers now (a product list kept from before): the page again.
            if (e === last) {
              location.reload();
              return new Promise(() => {});
            }
            await tryAgain(box, Boolean(last));
            last = e;
          }
        }
      }
      /** "No connection" with "Try again" in `box`; resolves once it is tapped and the site answers. */
      function tryAgain(box, focus) {
        return new Promise((resolve) => {
          const paint = () => {
            box.innerHTML = `<h2>${esc(t('net.title'))}</h2><p class="muted">${esc(t('net.text'))}</p><button type="button" class="btn btn-primary" data-net-retry>${esc(t('net.retry'))}</button>`;
          };
          let busy = false;
          const click = async (e) => {
            if (busy || !e.target.closest('[data-net-retry]')) return;
            busy = true;
            const back = await fetch('/api/products', { method: 'HEAD', cache: 'no-store' }).then((r) => r.ok, () => false);
            busy = false;
            if (!back) {
              POD.toast(t('net.still'), 'error');
              return;
            }
            box.removeEventListener('click', click);
            document.removeEventListener('pod:langchange', paint);
            box.innerHTML = '<div class="spinner"></div>';
            resolve();
          };
          paint();
          box.setAttribute('role', 'alert');
          box.hidden = false;
          box.addEventListener('click', click);
          document.addEventListener('pod:langchange', paint);
          if (focus) box.querySelector('[data-net-retry]').focus();
        });
      }

      let shop;
      try {
        shop = await loadOrRetry(document.getElementById('net-box'), () => POD.loadCatalog());
      } catch (e) {
        POD.toast(e.message, 'error');
        return;
      }
      const { pricing, governorates, delivery: deliveryInfo, products = [] } = shop;
      // Delivery speed (standard 5 business days, express 2 for a fee), kept for this visit.
      let delivery = 'standard';
      try { delivery = sessionStorage.getItem('pod-delivery') === 'express' ? 'express' : 'standard'; } catch (e) { /* private mode */ }
      const expressFee = () => (quote && quote.deliveryOptions ? quote.deliveryOptions.find((d) => d.speed === 'express').fee : (deliveryInfo ? deliveryInfo.expressFee : 0));
      const came = new URLSearchParams(location.search);
      if (came.get('added') || came.get('updated')) {
        POD.toast(t(came.get('updated') ? 'cart.updated' : 'cart.added'));
        history.replaceState(null, '', '/cart');
      }

      function renderGovernorates() {
        const sel = document.getElementById('governorate');
        const current = sel.value;
        sel.innerHTML = `<option value="">${esc(t('checkout.choose'))}</option>` +
          governorates.map((g) => `<option value="${g.id}">${esc(tr(g.name))}</option>`).join('');
        sel.value = current;
      }

      // One artwork in several colours / sizes: quantities = [{ color, size, qty, unitPrice }].
      const qtyLines = (item) => (Array.isArray(item.quantities) ? item.quantities.filter((l) => l && Number(l.qty) > 0) : []);
      const piecesText = (n) => t('qty.pieces.' + (n === 1 ? 'one' : n === 2 ? 'two' : n % 100 >= 3 && n % 100 <= 10 ? 'few' : 'many'), { n: POD.num(n) });
      function qtyGroups(lines) {
        const groups = new Map();
        for (const l of lines) {
          const c = l.color || {};
          const key = c.id || tr(c.name) || '';
          if (!groups.has(key)) groups.set(key, { color: c, lines: [] });
          groups.get(key).lines.push(l);
        }
        return [...groups.values()];
      }
      /** Black: S×2 · M×5 / White: M×2 (one line per colour). */
      function qtyBreakdown(lines) {
        return `<div class="qty-break" aria-label="${esc(t('qty.breakdown'))}">${qtyGroups(lines).map((g) => `
          <div class="qty-line">${g.color.hex ? `<span class="qty-dot" style="background:${esc(g.color.hex)}"></span>` : ''}${tr(g.color.name) ? `<span class="qty-cname">${esc(tr(g.color.name))}:</span>` : ''}
            ${g.lines.map((l) => `<span class="qty-chip">${l.size && tr(l.size.label) ? `${esc(tr(l.size.label))}×` : '×'}<b>${esc(POD.num(Number(l.qty)))}</b></span>`).join('')}
          </div>`).join('')}</div>`;
      }
      // Arabic: "·" next to Arabic-Indic digits reads as the zero "٠" («أبيض · ٣٢٥ مل»), so the parts of a line
      // are separated with the Arabic comma there, as on the order page. English keeps the dot.
      const SEP = () => (POD.lang === 'ar' ? '، ' : ' · ');
      // ---------- Photo prints: what is printed in each size ----------
      const countKey = (n) => (n === 1 ? 'one' : n === 2 ? 'two' : n % 100 >= 3 && n % 100 <= 10 ? 'few' : 'many');
      const counted = (base, n) => t(`${base}.${countKey(n)}`, { n: POD.num(n) });
      const photoProduct = () => products.find((p) => p.id === 'photoprints') || null;
      /** The border chosen for the set (the product's first choice when none was kept). */
      function photoBorder(proof) {
        const chosen = proof.options && proof.options.border;
        if (chosen && chosen.name) return tr(chosen.name);
        const p = photoProduct();
        const opt = p && (p.options || []).find((o) => o.id === 'border');
        return opt && opt.choices[0] ? tr(opt.choices[0].name) : '';
      }
      /** [{ size, photos, prints, sum }] in the shop's size order; sums only when they add up to the item's price. */
      function photoSizes(proof, item) {
        const p = photoProduct();
        const order = p ? p.sizes.map((z) => z.id) : [];
        const groups = new Map();
        for (const ph of proof.photos || []) {
          const id = ph.size && ph.size.id;
          if (!groups.has(id)) groups.set(id, { size: ph.size || {}, photos: 0, prints: 0 });
          const g = groups.get(id);
          g.photos += 1;
          g.prints += Number(ph.copies) || 1;
        }
        const list = [...groups.values()].sort((a, b) => order.indexOf(a.size.id) - order.indexOf(b.size.id));
        if (p && item) {
          const optPrice = (sizeId) => (p.options || []).reduce((sum, o) => {
            const chosen = proof.options && proof.options[o.id];
            const c = chosen && o.choices.find((x) => x.id === chosen.id);
            return sum + (!c ? 0 : typeof c.price === 'number' ? c.price : (c.price && c.price[sizeId]) || 0);
          }, 0);
          for (const g of list) {
            const z = p.sizes.find((x) => x.id === g.size.id);
            g.sum = z ? Math.round((Number(p.basePrice) + (Number(z.surcharge) || 0) + optPrice(z.id)) * g.prints * 100) / 100 : null;
          }
          const total = list.reduce((n, g) => n + (g.sum || 0), 0);
          if (list.some((g) => g.sum == null) || Math.abs(total - item.price) > 0.009) list.forEach((g) => { g.sum = null; });
        }
        return list;
      }
      /** "10 × 15 cm: 25 photos · 29 prints · EGP 435", one line per size. */
      const photoSizesHtml = (list) => `<span class="photo-sizes">${list.map((g) => `<span class="photo-size"><b><bdi>${esc(tr(g.size.label))}</bdi></b>: ${esc(counted('cart.photos', g.photos))}${SEP()}${esc(counted('cart.prints', g.prints))}${g.sum != null ? `${SEP()}${esc(money(g.sum))}` : ''}</span>`).join('')}</span>`;
      /** The photo set's proof: sizes instead of one "size", plural warnings, the flagged photos shown by number. */
      function photoProofHtml(proof, item) {
        const checks = ((proof.preflight && proof.preflight.checks) || []).map((c) => (c && c.id === 'photoLowRes' ? { ...c, id: 'photoLowRes.' + countKey(Number(c.params && c.params.count) || 0) } : c));
        const tpl = document.createElement('template');
        tpl.innerHTML = PODProof.html({ ...proof, version: null, size: {}, quantities: null, copies: 1, preflight: { ...(proof.preflight || { status: 'pass' }), checks } });
        const dl = tpl.content.querySelector('.proof-spec');
        if (dl) {
          const row = (label, html, cls) => Object.assign(document.createElement('div'), { className: cls || '', innerHTML: `<dt>${esc(label)}</dt><dd>${html}</dd>` });
          const prints = (proof.photos || []).reduce((n, ph) => n + (Number(ph.copies) || 1), 0);
          const after = dl.children[1] || null;
          const border = photoBorder(proof);
          const rows = [
            border ? row(t('cart.photoBorder'), esc(border)) : null,
            row(t('cart.photoSizes'), `${photoSizesHtml(photoSizes(proof, item))}<span class="muted small">${esc(counted('cart.photos', (proof.photos || []).length))}${SEP()}${esc(counted('cart.prints', prints))}</span>`, 'photo-sizes-row'),
          ].filter(Boolean);
          for (const r of rows.reverse()) dl.insertBefore(r, after ? after.nextSibling : null);
        }
        // The low-resolution photos, small and numbered like on the photos page.
        const low = checks.find((c) => c && /^photoLowRes/.test(c.id));
        const warn = tpl.content.querySelector('.pf-warn > div, .pf-fail > div');
        if (low && warn) {
          const nums = String((low.params && low.params.photos) || '').split(/\s*,\s*/).map(Number).filter(Boolean);
          const shown = nums.map((n) => (proof.photos || []).find((ph) => ph.n === n)).filter((ph) => ph && ph.url).slice(0, 12);
          if (shown.length) {
            warn.insertAdjacentHTML('beforeend', `<ul class="photo-flags">${shown.map((ph) => `<li><img src="${esc(ph.url)}" alt="${esc(t('proof.photoNo', { n: POD.num(ph.n) }))}" loading="lazy"><span>${esc(POD.num(ph.n))}</span></li>`).join('')}</ul><p class="photo-flags-hint">${esc(t('proof.photoNoHint'))}</p>`);
          }
        }
        return tpl.innerHTML;
      }
      const photoNote = () => `<p class="proof-screen-note"><svg class="pf-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg><span>${esc(t('proof.photoNote'))}</span></p>`;

      function itemMeta(item) {
        // Photo prints: the paper and border, then the prints per size once the proof (with every photo) is here.
        if (item.productId === 'photoprints') {
          const proof = proofOf(item.designId);
          if (!proof || !Array.isArray(proof.photos)) return `${esc(tr(item.colorName))}${SEP()}${esc(tr(item.sizeLabel))}`;
          const border = photoBorder(proof);
          return `${esc(tr(item.colorName))}${border ? `${SEP()}${esc(border)}` : ''}${photoSizesHtml(photoSizes(proof, item))}`;
        }
        // A plain item (kind 'blank', sold without printing): colour, size, how many, and "no printing".
        if (item.kind === 'blank') {
          const n = Math.max(1, Number(item.qty || item.copies) || 1);
          return `${esc(tr(item.colorName))}${SEP()}${esc(tr(item.sizeLabel))}${n > 1 ? `${SEP()}<span class="qty-pieces">${esc(piecesText(n))}</span>` : ''}<br>${esc(t('cartSel.plain'))}`;
        }
        const lines = qtyLines(item);
        const isNames = Boolean(item.merge) || (!lines.length && item.copies > 1);
        const names = isNames ? (item.merge && item.merge.count) || item.copies : 0;
        const pieces = Math.max(1, Number(item.copies) || lines.reduce((n, l) => n + Number(l.qty), 0) || 1);
        const one = lines.length === 1 ? lines[0] : null;
        const printed = esc(t('cart.printed', { sides: item.sides.map(tr).join(' + ') }));
        // Packs (100 cards × 2 + 1000 cards): the copies, never "3 pieces" (QA 25 Nov).
        const copies = !isNames && pieces > 1 ? POD.packCopies(lines) : null;
        const badge = names > 1 ? `<span class="cart-copies">${esc(t(names % 100 >= 3 && names % 100 <= 10 ? 'cart.copies.few' : 'cart.copies', { n: POD.num(names) }))}</span>`
          : copies != null ? `<span class="qty-pieces">${esc(POD.plural(POD.packWord(lines), copies))}</span>`
            : !isNames && pieces > 1 ? `<span class="qty-pieces">${esc(piecesText(pieces))}</span>` : '';
        if (lines.length > 1) return `${badge}${qtyBreakdown(lines)}${printed}`;
        const color = one && one.color ? one.color.name : item.colorName;
        const size = one && one.size ? one.size.label : item.sizeLabel;
        return `${esc(tr(color))}${SEP()}${esc(tr(size))}${badge ? SEP() + badge : ''}<br>${printed}`;
      }
      /** The price for all pieces; with one price per piece, that price under it. */
      function itemPrice(item) {
        const lines = qtyLines(item);
        const pieces = Math.max(1, Number(item.copies) || lines.reduce((n, l) => n + Number(l.qty), 0) || 1);
        const units = new Set(lines.map((l) => l.unitPrice).filter((u) => u != null));
        // (Packs: no price "each": a pack holds many copies.)
        const each = pieces > 1 && units.size <= 1 && POD.packCopies(lines) == null ? ` <span class="qty-each">${esc(t('qty.each', { price: money(Math.round(item.price / pieces * 100) / 100) }))}</span>` : '';
        return esc(money(item.price)) + each;
      }

      // ---------- Proofs: every item is checked and approved before the order can be placed ----------
      // designId -> { state: 'loading' | 'ok' | 'error', proof, error }
      const proofs = new Map();
      // designId -> { hash, ok, sample }: what the customer ticked, against which proof.
      const approvals = new Map();
      // Designs whose proof changed after the customer had approved it.
      const changed = new Set();
      // Approved proofs fold to one line; the ones the customer opened again stay open.
      const expanded = new Set();
      const APPROVALS_KEY = 'pod-proof-ok';
      try {
        const saved = JSON.parse(sessionStorage.getItem(APPROVALS_KEY) || '{}');
        for (const [id, a] of Object.entries(saved)) if (a && a.hash) approvals.set(id, { hash: a.hash, ok: Boolean(a.ok), sample: Boolean(a.sample) });
      } catch (e) { /* nothing remembered */ }
      const saveApprovals = () => {
        try { sessionStorage.setItem(APPROVALS_KEY, JSON.stringify(Object.fromEntries(approvals))); } catch (e) { /* private mode */ }
      };
      let placing = false;
      // Items the shop can't make right now (hidden or sold-out product, colour or size: admin → Products),
      // from its last prices: designId -> the shop's message. They block the order until removed or saved for later.
      let blocked = new Map();
      let savedBlocked = new Map();
      // Of those, ones whose product isn't in the shop: designId -> { similar } a link to similar products for one
      // the shop stopped selling, or { backOn } the day a paused one comes back.
      let outOfShop = new Map();
      const blockedIn = (cart) => cart.filter((it) => blocked.has(it.designId));

      // ---------- Which items go in this order (owner, 28 Nov: "like Amazon") ----------
      // Every item is ticked, new ones too; an item the customer unticks stays in the cart exactly as it is (its
      // number, keys, proof) and is left out of the sums and of the order. Only the unticked ones are remembered, by
      // designId, on this device (the cart follows the customer's account; the ticks stay with the device).
      const OFF_KEY = 'pod-cart-off';
      let off = new Set();
      function readOff() {
        try {
          const v = JSON.parse(localStorage.getItem(OFF_KEY) || '[]');
          off = new Set(Array.isArray(v) ? v.filter((x) => typeof x === 'string') : []);
        } catch (e) {
          off = new Set();
        }
      }
      readOff();
      const saveOff = () => {
        try { if (off.size) localStorage.setItem(OFF_KEY, JSON.stringify([...off])); else localStorage.removeItem(OFF_KEY); } catch (e) { /* private mode: for this visit */ }
      };
      const isOn = (id) => !off.has(id);
      /** The items ticked for this order, in cart order. */
      const chosenIn = (cart) => cart.filter((it) => isOn(it.designId));
      const chosen = () => chosenIn(POD.getCart());
      /** Unticks kept for items no longer in the cart are forgotten (one saved for later comes back ticked). */
      function pruneOff(cart) {
        const ids = new Set(cart.map((it) => it.designId));
        let dropped = false;
        for (const id of [...off]) if (!ids.has(id)) { off.delete(id); dropped = true; }
        if (dropped) saveOff();
      }
      /** Tick or untick items (one, or all): the sums and the shop's prices follow. */
      function setOn(ids, on) {
        for (const id of ids) if (on) off.delete(id); else off.add(id);
        saveOff();
        render();
        refreshPrices().then(render);
      }
      const itemsWord = (n) => counted('cartSel.items', n);
      /** "Place order (2 items)": what will be ordered. */
      const placeLabel = () => { const n = chosen().length; return n ? t('cartSel.place', { items: itemsWord(n) }) : t('checkout.place'); };

      const proofOf = (id) => { const p = proofs.get(id); return p && p.state === 'ok' ? p.proof : null; };
      /** A ready design added as it is (the shop's own, unchanged): nothing to tick (owner, 26 Nov). */
      const isReady = (id) => Boolean(proofOf(id) && proofOf(id).ready);
      function isApproved(id) {
        if (POD.getCart().some((it) => it.designId === id && it.kind === 'blank')) return true;
        const proof = proofOf(id);
        if (proof && proof.ready) return true;
        const a = approvals.get(id);
        return Boolean(proof && a && a.ok && a.hash === proof.proofHash);
      }
      async function loadProof(id, { force = false } = {}) {
        const cur = proofs.get(id);
        if (cur && !force && cur.state !== 'error') return cur.promise;
        const entry = { state: 'loading' };
        // (A name list's first names only with its key, kept with the cart item.)
        const item = [...POD.getCart(), ...(POD.getSaved ? POD.getSaved() : [])].find((it) => it && it.designId === id);
        const listKey = item && typeof item.listKey === 'string' ? { 'x-list-key': item.listKey } : {};
        entry.promise = POD.api('/api/designs/' + encodeURIComponent(id) + '/proof', { headers: listKey }).then((proof) => {
          Object.assign(entry, { state: 'ok', proof });
          const a = approvals.get(id);
          // Approved an older version: ask again.
          if (a && a.ok && a.hash !== proof.proofHash) {
            approvals.delete(id);
            changed.add(id);
            saveApprovals();
          }
        }, (err) => Object.assign(entry, { state: 'error', error: err.message }));
        // Keep showing the proof already on screen while a newer one loads.
        if (!force || !cur || cur.state !== 'ok') proofs.set(id, entry);
        await entry.promise;
        proofs.set(id, entry);
        paintProof(id);
        updateApproval();
        return entry.promise;
      }
      // "Place order" was pressed before the tick next to it (it is outlined, with "Tick this first", until ticked).
      let nudged = false;
      /** "White، 325 ml، Sublimation": the proof's colour and size (or its pieces), and how it is printed. */
      function proofSpecLine(proof) {
        const lines = Array.isArray(proof.quantities) ? proof.quantities.filter((l) => l && Number(l.qty) > 0) : [];
        const parts = [];
        if (lines.length > 1) {
          const copies = POD.packCopies(lines);
          parts.push(copies != null ? POD.plural(POD.packWord(lines), copies) : piecesText(PODProof.pieces(proof)));
        } else {
          const one = lines[0];
          const color = (one && one.color) || proof.color || {};
          const size = (one && one.size) || proof.size || {};
          if (tr(color.name)) parts.push(tr(color.name));
          if (tr(size.label)) parts.push(tr(size.label));
        }
        // (The same ways of printing as the full proof lists.)
        const procs = [...new Set([proof.method === 'embroidery' ? 'embroidery' : proof.process, ...(proof.sides || []).map((s) => s.process)].filter(Boolean))]
          .map((p) => 'proof.process.' + p).filter((k) => t(k) !== k);
        if (procs.length) parts.push(procs.map((k) => t(k)).join(' + '));
        return parts.map(esc).join(SEP());
      }
      /** An unapproved proof, short: picture, the checks' verdict (a warning or problem in full), spec line, "See proof details". */
      function shortProofHtml(proof, item, i) {
        const pf = proof.preflight || {};
        const status = ['warn', 'fail'].includes(pf.status) ? pf.status : 'pass';
        const plain = status === 'pass' && !(proof.review && proof.review.needed);
        const spec = proofSpecLine(proof);
        return `
              <div class="proof-short">
                <img class="proof-short-pic" src="${esc(item.previewUrl)}" alt="" loading="lazy">
                <div class="proof-short-text">
                  ${plain ? `<p class="proof-short-st">✓ ${esc(t('proof.st.pass'))}</p>` : ''}
                  ${spec ? `<p class="proof-short-spec">${spec}</p>` : ''}
                  <button class="link-btn proof-toggle proof-more" type="button" id="tog-${i}" data-proof-toggle="${esc(item.designId)}" aria-expanded="false">${esc(t('cart.proofDetails'))}</button>
                </div>
              </div>
              ${plain ? '' : PODProof.checksHtml(proof)}`;
      }
      function proofSlot(item, i) {
        // A plain item (kind 'blank'): nothing printed, so no proof to look at (QA 28 Nov).
        if (item.kind === 'blank') return '';
        const id = item.designId;
        const st = proofs.get(id);
        const ok = isApproved(id);
        // (A ready design is "Ready design", not "Approved": the customer ticked nothing.)
        const head = `<h3 class="cart-proof-title" id="proof-h-${i}"><span>${esc(t('proof.title'))} · ${esc(tr(item.productName))}</span><span class="cart-proof-ok">✓ ${esc(t(isReady(id) ? 'proof.readyDesign' : 'proof.approved'))}</span></h3>`;
        let body;
        if (!st || st.state === 'loading') {
          body = `<div class="cart-proof-state" role="status"><div class="spinner"></div>${esc(t('proof.loading'))}</div>`;
        } else if (st.state === 'error') {
          body = `<div class="cart-proof-state" role="alert"><p>${esc(t('proof.loadFailed'))} ${esc(st.error || '')}</p><button class="btn btn-sm" type="button" data-proof-retry="${esc(id)}">${esc(t('proof.retry'))}</button></div>`;
        } else {
          const proof = st.proof;
          const a = approvals.get(id);
          const sample = Boolean(a && a.sample);
          const photos = Array.isArray(proof.photos);
          const sampleBy = sample && quote && quote.delivery && quote.delivery.sampleDays ? quote.delivery.by : null;
          // "Print one sample first" (more than one piece) stays with its item: a wish, not the approval. The approval
          // itself is one short line next to "Place order" (owner, 26 Nov), with the colours note behind "Details".
          const sampleBox = PODProof.pieces(proof) > 1 && !photos ? `
              <div class="approve-box sample-box">
                <label class="approve-check sample" for="sample-${i}"><input type="checkbox" id="sample-${i}" data-sample="${esc(id)}"${sample ? ' checked' : ''}><span>${esc(t('proof.sample'))}</span></label>
                ${sampleBy ? `<p class="sample-date" role="status">${esc(t('cart.sampleDate', { date: POD.day(sampleBy) }))}</p>` : ''}
              </div>` : '';

      const slotOf = (id) => [...document.querySelectorAll('[data-proof-for]')].find((el) => el.dataset.proofFor === id) || null;
      /** Redraw one item's proof (after it loads) without touching the rest of the page. */
      function paintProof(id) {

      // (Plain items, kind 'blank', have nothing printed to approve.)

      function updateApproval() {
        const cart = chosen();

        const btn = document.getElementById('place-order');

        nothing.textContent = none ? t('cartSel.nothing') : '';

        const status = document.getElementById('approve-status');
        status.classList.toggle('blocked', stuck.length > 0);
        status.innerHTML = stuck.length
          ? `${esc(stuck.length === 1 ? t('checkout.blockedOne') : t('checkout.blockedMany', { n: POD.num(stuck.length) }))} <button type="button" class="link-btn" data-next-blocked>${esc(t('checkout.blockedGo'))}</button>`

      /** The tick next to "Place order", shown and focused. */
      function goToTick() {

      /** The first item that can't be ordered now: shown, with its buttons at hand. */
      function goToBlocked() {

        if (!el) return false;

      function nudgeProof() {

      function goToNextProof() {

        if (!next) return;

      /** "My saved designs" under the cart (also when the cart itself is empty): kept out of this order, or not finished yet. */

      /** Saved items: today's prices, and ones that were ordered or are gone dropped. */
      async function refreshSaved() {

      // ---------- How many, changed here (owner, 26 Nov): − / + on one artwork in one colour and size ----------
      // designId -> { n, step, max, unit } from the shop's prices (none: several sizes / colours, name lists, books and
      // photo sets, changed in the editor). Packs count copies, in steps of the smallest pack.
      const counts = new Map();
      // designId -> the number on screen while it is being typed or sent.
      const qtyDraft = new Map();
      // designId -> { text, take? } a word under the counter (a pack chosen for less, a cheaper pack, a refusal).
      const qtyNotes = new Map();
      const QTY_MINUS = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg>';
      const QTY_PLUS = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
      const qtyMin = (c) => (c.unit === 'piece' ? 1 : c.step);
      /** Digits as typed (Arabic ones too) to a number of the counter's steps, kept between its least and most. */
      function qtyClamp(c, v) {
        const n = qtyNumber(v);
        if (n == null) return qtyMin(c);
        return Math.min(Math.floor(c.max / c.step) * c.step, Math.max(qtyMin(c), Math.ceil(n / c.step) * c.step));
      }
      /** The number typed (Arabic and Persian digits; a decimal mark is one: "2.5" is 2, not 25. QA 26 Nov), or null for none. */
      function qtyNumber(v) {
        // (A comma groups thousands, as the box itself writes "1,000" (and "١٬٠٠٠"): read as a decimal mark, "2,000"
        // became 2. Only "." and "٫" end the whole number. Tester 2, 26 Nov.)
        const text = String(v).replace(/[٠-٩]/g, (d) => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, (d) => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
          .replace(/[,٬،\s]/g, '').replace(/٫/g, '.').replace(/[^\d.]/g, '').replace(/(\..*)\./g, '$1');
        const n = Math.floor(Number(text));
        return text && Number.isFinite(n) && n >= 1 ? n : null;
      }
      /** A typed number, or the one before the customer started typing when the box was emptied, or says 0 or "abc"
       *  (10,000 cards became the least, 100: tester 1, 26 Nov). */
      const qtyTyped = (id, v) => (qtyNumber(v) == null ? qtyBefore.get(id) : qtyClamp(counts.get(id), v));
      // designId -> the number in the box when the customer started typing in it.
      const qtyBefore = new Map();
      function qtyBox(item, i) {
        const c = counts.get(item.designId);
        // (A plain item's number is fixed: the shop refuses − / + for it.)
        if (!c || blocked.has(item.designId) || item.kind === 'blank') return '';
        const n = qtyDraft.has(item.designId) ? qtyDraft.get(item.designId) : c.n;
        // A word from the last change, else the shop's lasting tip: a few more copies that cost less (owner, 26 Nov:
        // "900 for this price while 1000 is cheaper?!").
        const word = (x) => POD.plural(c.unit === 'packPiece' ? 'qty.unitPieces' : 'qty.copies', x);
        // (Both when both: packs just taken for less AND more copies costing less still. QA 26 Nov: the tip was hidden.)
        const tip = c.cheaper && !qtyDraft.has(item.designId)
          ? { text: t('cart.qtyCheaper', { copies: word(c.cheaper.copies), price: money(c.cheaper.price) }), take: c.cheaper.copies } : null;
        // (A note is written in the page's language when drawn; the shop's refusal only in the language it came in.
        // Tester 1, 26 Nov: "Cheaper as 2 × 10 cards…" stayed English after switching to Arabic.)
        const notes = [qtyNotes.get(item.designId), tip].filter((x) => x && (!x.lang || x.lang === POD.lang));
        const label = t(c.unit === 'copy' ? 'cart.qtyCopies' : c.unit === 'packPiece' ? 'cart.qtyPieces' : 'cart.qty');
        return `
              <div class="cart-qty" data-qty-for="${esc(item.designId)}">
                <span class="cart-qty-label" id="qty-l-${i}">${esc(label)}</span>
                <div class="qty-step" dir="ltr" role="group" aria-labelledby="qty-l-${i}">
                  <button type="button" class="btn btn-sm" id="qty-less-${i}" data-qstep="-1" data-qid="${esc(item.designId)}" aria-label="${esc(t('props.less'))}"${n <= qtyMin(c) ? ' disabled' : ''}>${QTY_MINUS}</button>
                  <input class="qty-n" id="qty-n-${i}" data-qin="${esc(item.designId)}" type="text" inputmode="numeric" autocomplete="off" value="${esc(POD.num(n))}" aria-labelledby="qty-l-${i}">
                  <button type="button" class="btn btn-sm" id="qty-more-${i}" data-qstep="1" data-qid="${esc(item.designId)}" aria-label="${esc(t('props.more'))}"${n + c.step > c.max ? ' disabled' : ''}>${QTY_PLUS}</button>
                </div>
                ${notes.map((note) => `<p class="cart-qty-note${note.error ? ' bad' : ''}" role="${note.error ? 'alert' : 'status'}">${esc(note.say ? note.say() : note.text)}${note.take ? ` <button type="button" class="link-btn" data-qtake="${esc(item.designId)}" data-qn="${note.take}">${esc(t('cart.qtyTake', { copies: POD.plural(c.unit === 'packPiece' ? 'qty.unitPieces' : 'qty.copies', note.take) }))}</button>` : ''}</p>`).join('')}
              </div>`;
      }
      /** The counter's number on screen and its − / + (without drawing the whole cart again, so typing goes on). */
      function paintQty(id) {
        const c = counts.get(id);
        const box = document.querySelector(`[data-qty-for="${CSS.escape(id)}"]`);
        if (!c || !box) return;
        const n = qtyDraft.has(id) ? qtyDraft.get(id) : c.n;
        const field = box.querySelector('[data-qin]');
        if (field && document.activeElement !== field) field.value = POD.num(n);
        box.querySelector('[data-qstep="-1"]').disabled = n <= qtyMin(c);
        box.querySelector('[data-qstep="1"]').disabled = n + c.step > c.max;
      }
      // One change at a time (a change can make a new design: the next one goes to it); the last number wins.
      let qtyChain = Promise.resolve();
      const qtyTimers = new Map();
      // designId -> the design that took its place (a copy made at the new number).
      const qtyMoved = new Map();
      const qtyNow = (id) => { while (qtyMoved.has(id)) id = qtyMoved.get(id); return id; };

      }

      async function sendQty(firstId) {
        const id = qtyNow(firstId);
        const c = counts.get(id);

        const item = POD.getCart().find((it) => it.designId === id);
        if (!c || n == null || !item) { qtyDraft.delete(id); return; }
        if (n === c.n) { qtyDraft.delete(id); paintQty(id); return; }
        const box = document.querySelector(`[data-qty-for="${CSS.escape(id)}"]`);
        if (box) box.setAttribute('aria-busy', 'true');

        try {
          res = await POD.api(`/api/designs/${encodeURIComponent(id)}/quantity`, {
            method: 'POST',

          return;
        }
        const cart = POD.getCart();
        const at = cart.findIndex((it) => it.designId === id);

        const old = cart[at];
        const entry = { ...res.entry, addedAt: old.addedAt || res.entry.addedAt, ...(old.view ? { view: old.view } : {}), ...(!res.entry.designKey && old.designKey ? { designKey: old.designKey } : {}) };
        const nid = entry.designId;

        if (nid !== id) {
          // A copy at the new number: it takes the item's place, with its tick (the same artwork and proof).
          qtyMoved.set(id, nid);
          if (approvals.has(id)) { approvals.set(nid, approvals.get(id)); approvals.delete(id); saveApprovals(); }
          // (Unticked, it stays unticked.)
          if (off.delete(id)) { off.add(nid); saveOff(); }
          if (expanded.delete(id)) expanded.add(nid);
          if (openMenu === id) openMenu = null;
          counts.delete(id);
          qtyNotes.delete(id);
          // (Typed again meanwhile: that number goes to the new design.)
          if (qtyDraft.has(id) && qtyDraft.get(id) !== n) qtyDraft.set(nid, qtyDraft.get(id));
          qtyDraft.delete(id);
          if (qtyTimers.has(id)) { clearTimeout(qtyTimers.get(id)); qtyTimers.delete(id); queueQty(nid, 0); }
        } else if (qtyDraft.get(id) === n) qtyDraft.delete(id);
        if (res.count) counts.set(nid, res.count);
        // Packs taken for less: said (the lasting tip about more copies comes with the counter itself).
        const packs = Array.isArray(res.switched) ? res.switched : res.switched ? [res.switched] : [];
        if (packs.length) qtyNotes.set(nid, { say: () => t('cart.qtyPack', { pack: packs.map((x) => `${POD.num(x.qty)} × ${tr(x.label)}`).join(' + ') }) });
        else qtyNotes.delete(nid);
        POD.setCart(cart);
        // The proof shows the pieces: asked again (a copy's proof loads as the cart is drawn).
        if (nid === id) loadProof(id, { force: true });
        render();
        await refreshPrices();
        render();
      }
      document.getElementById('items').addEventListener('click', (e) => {
        const b = e.target.closest('[data-qstep]');
        const take = e.target.closest('[data-qtake]');
        if (!b && !take) return;
        const id = (b || take).dataset.qid || take.dataset.qtake;
        const c = counts.get(id);
        if (!c) return;
        const cur = qtyDraft.has(id) ? qtyDraft.get(id) : c.n;
        const n = take ? qtyClamp(c, take.dataset.qn) : qtyClamp(c, cur + Number(b.dataset.qstep) * c.step);
        if (take) qtyNotes.delete(id);
        qtyDraft.set(id, n);
        const field = document.querySelector(`[data-qin="${CSS.escape(id)}"]`);
        if (field) field.value = POD.num(n);

      // Typed: sent when the customer leaves the box or presses Enter.

        const n = typed == null ? counts.get(id).n : typed;

      /**
       * "Edit design" and "Remove" on the item; "Another copy" and "Save for later" in its "⋯" menu (only what applies;

          ? `<a class="btn btn-sm" href="/book?b=${encodeURIComponent(item.bookId)}&cart=${i}">${esc(t('cart.edit'))}</a>`

          editable && !item.bookId ? `<a class="more-item" href="/editor?design=${encodeURIComponent(item.designId)}">${esc(t('cart.duplicate'))}</a>` : '',
          stuck ? '' : `<button class="more-item" type="button" data-later="${esc(item.designId)}">${esc(t('cart.saveLater'))}</button>`,

                ${share}

                  <div class="more-menu" id="more-menu-${i}"${open ? '' : ' hidden'}>${menu.join('')}</div>

      // ---------- Share an item's picture (owner, 28 Nov: "share button to share preview to someone") ----------

      const VIEW_KEY_RE = /^[A-Za-z0-9_-]{32}$/;

      let shownLink = null;
      const shareCap = POD.captcha(document.getElementById('cap-share'));
      /** The pictures to share: every printed side's preview (up to 4), else the item's own picture. */
      function sharePicUrls(item) {
        const proof = proofOf(item.designId);
        const sides = proof && Array.isArray(proof.sides) ? proof.sides.map((sd) => sd.previewUrl || sd.artworkUrl).filter(Boolean) : [];
        return sides.length > 1 ? sides.slice(0, 4) : item.previewUrl ? [item.previewUrl] : [];
      }
      /** The pictures as files (fetched once, ahead of the tap where possible: a phone shares only right after it). */
      function shareFilesOf(item) {
        const urls = sharePicUrls(item);
        const key = urls.join('\n');
        let c = shareCache.get(item.designId);
        if (c && c.key === key) return c;
        const base = `ebda3-${String(item.productId || 'design').replace(/[^a-z0-9-]/gi, '').slice(0, 30) || 'design'}`;
        c = { key, files: null };
        c.promise = Promise.all(urls.map(async (url, n) => {
          const r = await fetch(url);
          if (!r.ok) throw new Error(String(r.status));
          const blob = await r.blob();
          const type = /^image\/(png|jpeg|webp)$/.test(blob.type) ? blob.type : 'image/png';
          return new File([blob], `${base}${urls.length > 1 ? `-${n + 1}` : ''}.${type === 'image/jpeg' ? 'jpg' : type.split('/')[1]}`, { type });
        })).then((files) => { c.files = files; return files; });
        c.promise.catch(() => { if (shareCache.get(item.designId) === c) shareCache.delete(item.designId); });
        shareCache.set(item.designId, c);

      }
      /** Can the view page show this item? (As the shop's own rule: two sides or more, or a booklet; not a book.) */
      function viewableItem(item) {
        if (item.kind || item.bookId || item.productId === 'photoprints' || item.productId === 'dtfsheet') return false;
        const p = products.find((x) => x.id === item.productId);
        return Boolean(p) && p.kind !== 'book' && (Boolean(p.paged) || (p.sides || []).length >= 2);
      }
      /** A picture as the data URL the view link takes (PNG or JPEG under its size limit). */
      async function dataUrlOf(blob) {
        if (/^image\/(png|jpeg)$/.test(blob.type) && blob.size < 2.3e6) {
          return new Promise((resolve, reject) => {
            const fr = new FileReader();
            fr.onload = () => resolve(fr.result);
            fr.onerror = () => reject(fr.error);
            fr.readAsDataURL(blob);
          });
        }
        const bmp = await createImageBitmap(blob);
        const k = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));

        ctx.fillStyle = '#fff';

      /** The item's view-only link id: the one it has (made in the editor, still there), else a new one kept with it. */
      async function viewLinkOf(item) {
        const v = item.view;
        if (v && VIEW_ID_RE.test(v.id || '') && VIEW_KEY_RE.test(v.key || '')) {
          try {
            await POD.api('/api/views/' + encodeURIComponent(v.id));
            return v.id;
          } catch (e) {
            if (![404, 410].includes(e.status)) throw e; // (gone or expired: a new one below)
          }
        }
        if (!proofOf(item.designId)) await loadProof(item.designId);
        const proof = proofOf(item.designId);
        const p = products.find((x) => x.id === item.productId);
        const ids = new Set(p.sides.map((sd) => sd.id));
        const sides = (proof ? proof.sides || [] : []).filter((sd) => ids.has(sd.id) && (sd.previewUrl || sd.artworkUrl));
        if (!sides.length) return null;
        const pages = await Promise.all(sides.map(async (sd) => {
          const r = await fetch(sd.previewUrl || sd.artworkUrl);
          if (!r.ok) throw new Error(String(r.status));

        }));

        let tok = null;
        try { tok = await shareCap.token(); } catch (e) { if (e && e.code === 'captchaLoad') throw e; }
        const made = await POD.api('/api/views', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ productId: p.id, options: {}, pages, ...(tok ? { captchaToken: tok } : {}) }),
        }).finally(() => shareCap.reset());

        const cart = POD.getCart();
        const at = cart.findIndex((it) => it.designId === item.designId);
        if (at >= 0 && VIEW_ID_RE.test(made.id || '')) {

      /** Copy text; false when the browser won't. */
