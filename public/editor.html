<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>OneOff Print</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script>(function(){var l;try{l=localStorage.getItem('pod-lang')}catch(e){}l=l==='en'?'en':'ar';var d=document.documentElement;d.lang=l;d.dir=l==='ar'?'rtl':'ltr'})()</script>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/css/styles.css">
  <script>
    // Height of the screen area the page can really use. Phones report the
    // address bar differently while loading, so take the smallest reading and
    // measure again after load and on every resize (not while typing: the
    // on-screen keyboard must not shrink the editor).
    (function () {
      var d = document.documentElement;
      function h() {
        var a = document.activeElement;
        if (a && (a.tagName === 'TEXTAREA' || a.tagName === 'INPUT')) return;
        var v = window.visualViewport ? window.visualViewport.height * window.visualViewport.scale : window.innerHeight;
        var px = Math.floor(Math.min(window.innerHeight, v || window.innerHeight));
        d.style.setProperty('--app-h', px + 'px');
      }
      h();
      window.addEventListener('resize', h);
      window.addEventListener('pageshow', h);
      window.addEventListener('load', function () { h(); setTimeout(h, 300); setTimeout(h, 1200); });
      window.addEventListener('orientationchange', function () { setTimeout(h, 300); });
      if (window.visualViewport) window.visualViewport.addEventListener('resize', h);
    })();
  </script>
  <script type="importmap">{ "imports": { "three": "/vendor/three/three.module.min.js" } }</script>
</head>
<body class="editor-page" data-title-key="editor.pageTitle">
  <header class="site-header">
    <div class="container inner" style="max-width: none;">
      <a class="brand" href="/"><span class="brand-mark">1</span>OneOff Print</a>
      <nav>
        <a href="/#products" data-i18n="nav.products"></a>
        <a class="cart-link" href="/cart"><span data-i18n="nav.cart"></span> <span class="badge" data-cart-count hidden>0</span></a>
        <button class="btn btn-sm lang-toggle" data-lang-toggle data-i18n="lang.other"></button>
      </nav>
    </div>
  </header>

  <main>
    <div class="editor">
      <!-- Tools -->
      <aside class="tools">
        <button class="tool" data-flyout="templates" data-i18n-title="tool.templates.title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg><span data-i18n="tool.templates"></span>
        </button>
        <button class="tool" data-flyout="text" data-i18n-title="tool.text.title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6V4h16v2M12 4v16M9 20h6"/></svg><span data-i18n="tool.text"></span>
        </button>
        <button class="tool" data-flyout="upload" data-i18n-title="tool.image.title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg><span data-i18n="tool.image"></span>
        </button>
        <button class="tool" data-flyout="shapes" data-i18n-title="tool.shapes.title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><circle cx="8" cy="8" r="5"/><path d="M13 13h8v8h-8z"/></svg><span data-i18n="tool.shapes"></span>
        </button>
        <button class="tool tool-names" id="tool-names" data-i18n-title="merge.toolTitle" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h6M7 13h10M7 17h8"/><path d="M17 8.5h.01"/></svg><span data-i18n="merge.tool"></span>
        </button>
        <button class="tool tool-lib" data-flyout="library" data-i18n-title="lib.toolTitle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/><path d="M8 10.5h5M10.5 8v5"/></svg><span data-i18n="lib.tool"></span>
        </button>
        <button class="tool" data-flyout="stickers" data-i18n-title="tool.stickers.title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 3H6a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3h7l8-8V6.5"/><path d="M21 13h-5a3 3 0 0 0-3 3v5"/><path d="M8 10h.01M14 10h.01M8.5 14.5s1.2 1.5 3.5 1.5"/></svg><span data-i18n="tool.stickers"></span>
        </button>
        <button class="tool tool-ai" data-flyout="ai" data-i18n-title="ai.toolTitle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8zM5 15l.6 1.4L7 17l-1.4.6L5 19l-.6-1.4L3 17l1.4-.6z"/></svg><span data-i18n="ai.tool"></span>
        </button>
        <button class="tool mobile-only" data-sheet="product" data-i18n-title="tool.product">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M8 3 4 6l2 4 2-1v12h8V9l2 1 2-4-4-3c-.5 1.5-2 2.5-4 2.5S8.5 4.5 8 3z"/></svg><span data-i18n="tool.product"></span>
        </button>
      </aside>

      <!-- Canvas -->
      <section class="stage-wrap">
        <div class="stage-bar">
          <div class="side-tabs" id="side-tabs" role="tablist"></div>
          <button class="check-chip ok" id="check-chip"></button>
          <div class="spacer"></div>
          <div class="zoom-group">
            <button id="zoom-out" data-i18n-title="bar.zoomOut" data-i18n-aria="bar.zoomOut">−</button>
            <span id="zoom-label">100%</span>
            <button id="zoom-in" data-i18n-title="bar.zoomIn" data-i18n-aria="bar.zoomIn">+</button>
            <button id="zoom-fit" data-i18n-title="bar.zoomFit" data-i18n-aria="bar.zoomFit">⤢</button>
          </div>
          <button class="btn btn-sm btn-icon" id="undo" data-i18n-title="bar.undo" data-i18n-aria="bar.undo">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>
          </button>
          <button class="btn btn-sm btn-icon" id="redo" data-i18n-title="bar.redo" data-i18n-aria="bar.redo">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg>
          </button>
          <button class="btn btn-sm btn-dark" id="preview-open" data-i18n-title="pv.open">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="M3 7l9 5 9-5M12 12v10"/></svg><span class="btn-label" data-i18n="pv.open"></span>
          </button>
          <button class="btn btn-sm" id="share-open" data-i18n-title="share.buttonTitle">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg><span class="btn-label" data-i18n="share.button"></span>
          </button>
          <button class="btn btn-sm" id="preview-toggle" data-i18n-title="bar.preview.title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span class="btn-label" data-i18n="bar.preview"></span>
          </button>
          <button class="btn btn-sm btn-danger" id="clear-side" data-i18n-title="bar.clear.title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg><span class="btn-label" data-i18n="bar.clear"></span>
          </button>
        </div>
        <div class="stage" id="stage">
          <canvas id="design-canvas"></canvas>
        </div>
        <div class="stage-hint" id="stage-hint" data-i18n="editor.hint" hidden></div>
        <div class="float-bar" id="float-bar" role="toolbar" hidden></div>

        <div class="flyout" id="flyout-templates" hidden>
          <div class="fly-head"><h4 data-i18n="fly.templates"></h4><button class="fly-close" data-i18n-aria="bar.close">✕</button></div>
          <p class="muted small" style="margin-top:0" data-i18n="fly.templates.hint"></p>
          <input type="search" id="tpl-q" class="tpl-q" autocomplete="off" data-i18n-placeholder="tpl.search">
          <div class="tpl-cats" id="tpl-cats" role="tablist"></div>
          <p class="muted small" id="tpl-status" hidden></p>
          <div class="template-grid" id="template-grid"></div>
        </div>
        <div class="flyout" id="flyout-text" hidden>
          <div class="fly-head"><h4 data-i18n="fly.text"></h4><button class="fly-close" data-i18n-aria="bar.close">✕</button></div>
          <div id="text-presets"></div>
        </div>
        <div class="flyout" id="flyout-upload" hidden>
          <div class="fly-head"><h4 data-i18n="fly.upload"></h4><button class="fly-close" data-i18n-aria="bar.close">✕</button></div>
          <label class="dropzone" id="dropzone" for="file-input">
            <span data-i18n-html="fly.upload.drop"></span><br>
            <span class="muted small" data-i18n="fly.upload.types"></span>
          </label>
          <input type="file" id="file-input" accept="image/png,image/jpeg,image/webp,image/gif,image/svg+xml,.png,.jpg,.jpeg,.webp,.gif,.svg,.pdf,.ai,.eps,application/pdf,application/postscript,application/illustrator" hidden>
          <label class="check auto-bg"><input type="checkbox" id="auto-bg"> <span><strong data-i18n="fly.upload.autoBg"></strong><br><span class="muted small" data-i18n="fly.upload.autoBgHint"></span></span></label>
          <p class="muted small" style="line-height:1.5;margin-bottom:0;" data-i18n="fly.upload.tip"></p>
          <div class="imp">
            <h5 data-i18n="imp.title"></h5>
            <form class="imp-row" id="imp-form" novalidate>
              <input type="url" id="imp-url" dir="ltr" maxlength="2000" autocomplete="off" data-i18n-placeholder="imp.placeholder">
              <button class="btn btn-sm btn-primary" type="submit" data-i18n="imp.go"></button>
            </form>
            <p class="muted small imp-hint" data-i18n="imp.hint"></p>
            <div class="imp-results" id="imp-results"></div>
          </div>
        </div>
        <div class="flyout flyout-lib" id="flyout-library" hidden>
          <div class="fly-head"><h4 data-i18n="lib.title"></h4><button class="fly-close" data-i18n-aria="bar.close">✕</button></div>
          <input type="search" id="lib-q" class="lib-q" autocomplete="off" maxlength="80" data-i18n-placeholder="lib.placeholder">
          <div class="chips lib-types" id="lib-types">
            <button class="chip active" data-ltype="all" data-i18n="lib.all"></button>
            <button class="chip" data-ltype="sticker" data-i18n="lib.stickers"></button>
            <button class="chip" data-ltype="icon" data-i18n="lib.icons"></button>
            <button class="chip" data-ltype="template" data-i18n="lib.templates"></button>
          </div>
          <div id="lib-recent-box" hidden><div class="small muted lib-sub" data-i18n="lib.recent"></div><div class="lib-grid" id="lib-recent"></div></div>
          <div class="small muted lib-sub" id="lib-status"></div>
          <div class="lib-grid" id="lib-grid"></div>
          <button class="btn btn-sm btn-block" type="button" id="lib-more" hidden data-i18n="lib.more"></button>
          <p class="muted small lib-credits" data-i18n="lib.credits"></p>
        </div>
        <div class="flyout" id="flyout-stickers" hidden>
          <div class="fly-head"><h4 data-i18n="fly.stickers"></h4><button class="fly-close" data-i18n-aria="bar.close">✕</button></div>
          <div class="cat-chips small-chips" id="sticker-cats"></div>
          <div class="sticker-grid" id="sticker-grid"></div>
        </div>
        <div class="flyout" id="flyout-ai" hidden>
          <div class="fly-head"><h4 data-i18n="ai.title"></h4><button class="fly-close" data-i18n-aria="bar.close">✕</button></div>
          <p class="notice" id="ai-off" hidden data-i18n="ai.off"></p>
          <div id="ai-on">
            <div class="ai-tabs" role="tablist">
              <button type="button" class="active" data-ai-tab="slogan" data-i18n="ai.tabSlogan"></button>
              <button type="button" data-ai-tab="logo" data-i18n="ai.tabLogo"></button>
            </div>
            <form id="ai-slogan-form">
              <div class="field"><label for="ai-about" data-i18n="ai.about"></label><textarea id="ai-about" rows="2" maxlength="300" data-i18n-placeholder="ai.aboutPh" dir="auto"></textarea></div>
              <div class="field"><label data-i18n="ai.tone"></label><div class="ai-chips" data-ai-pick="tone">
                <button type="button" class="chip active" data-v="funny" data-i18n="ai.tone.funny"></button>
                <button type="button" class="chip" data-v="sweet" data-i18n="ai.tone.sweet"></button>
                <button type="button" class="chip" data-v="proud" data-i18n="ai.tone.proud"></button>
                <button type="button" class="chip" data-v="romantic" data-i18n="ai.tone.romantic"></button>
                <button type="button" class="chip" data-v="motivational" data-i18n="ai.tone.motivational"></button>
              </div></div>
              <div class="field"><label data-i18n="ai.lang"></label><div class="ai-chips" data-ai-pick="lang">
                <button type="button" class="chip active" data-v="ar" data-i18n="ai.lang.ar"></button>
                <button type="button" class="chip" data-v="en" data-i18n="ai.lang.en"></button>
                <button type="button" class="chip" data-v="both" data-i18n="ai.lang.both"></button>
              </div></div>
              <button class="btn btn-primary btn-block" type="submit" id="ai-slogan-go" data-i18n="ai.write"></button>
            </form>
            <form id="ai-logo-form" hidden>
              <div class="field"><label for="ai-name" data-i18n="ai.name"></label><input type="text" id="ai-name" maxlength="40" data-i18n-placeholder="ai.namePh" dir="auto"></div>
              <div class="field"><label for="ai-tagline" data-i18n="ai.tagline"></label><input type="text" id="ai-tagline" maxlength="60" dir="auto"></div>
              <div class="field"><label data-i18n="ai.style"></label><div class="ai-chips" data-ai-pick="style">
                <button type="button" class="chip active" data-v="modern" data-i18n="ai.style.modern"></button>
                <button type="button" class="chip" data-v="classic" data-i18n="ai.style.classic"></button>
                <button type="button" class="chip" data-v="playful" data-i18n="ai.style.playful"></button>
                <button type="button" class="chip" data-v="sporty" data-i18n="ai.style.sporty"></button>
                <button type="button" class="chip" data-v="elegant" data-i18n="ai.style.elegant"></button>
                <button type="button" class="chip" data-v="calligraphy" data-i18n="ai.style.calligraphy"></button>
              </div></div>
              <button class="btn btn-primary btn-block" type="submit" id="ai-logo-go" data-i18n="ai.design"></button>
            </form>
            <div id="ai-results"></div>
            <p class="ai-note" id="ai-left"></p>
          </div>
        </div>
        <div class="flyout" id="flyout-shapes" hidden>
          <div class="fly-head"><h4 data-i18n="fly.shapes"></h4><button class="fly-close" data-i18n-aria="bar.close">✕</button></div>
          <div class="shape-grid" id="shape-grid"></div>
          <button class="btn btn-block btn-sm" id="fill-area" style="margin-top:12px;" data-i18n="fly.fillArea"></button>
        </div>
      </section>

      <!-- Product + properties -->
      <aside class="panel">
        <div class="sheet-head"><strong id="sheet-title"></strong><button id="sheet-close" class="fly-close" data-i18n-aria="bar.close">✕</button></div>
        <div class="panel-scroll">
          <section class="panel-section" id="sec-product">
            <div class="field">
              <label for="product-select" data-i18n="panel.product"></label>
              <select id="product-select"></select>
            </div>
            <div class="field">
              <label><span id="color-label" data-i18n="panel.colour"></span> <span id="color-name" class="muted"></span></label>
              <div class="swatches" id="swatches"></div>
            </div>
            <div class="field" style="margin-bottom:0">
              <label data-i18n="panel.size"></label>
              <div class="chips" id="sizes"></div>
            </div>
            <div id="prod-options"></div>
            <div class="field qty-field" id="qty-field"></div>
            <div class="field method-field" id="method-field" hidden>
              <label data-i18n="emb.title"></label>
              <div class="chips" id="method-chips"></div>
              <p class="muted small" id="method-note" style="margin:6px 0 0;line-height:1.5"></p>
            </div>
            <div class="field pattern-field" id="pattern-field" hidden>
              <label data-i18n="pat.title"></label>
              <div class="small muted pat-label" data-i18n="pat.repeat"></div>
              <div class="chips" id="pat-repeats"></div>
              <div class="small muted pat-label" data-i18n="pat.tile"></div>
              <div class="chips" id="pat-tiles"></div>
              <canvas class="pat-preview" id="pat-preview" width="600" height="720" data-i18n-aria="pat.previewAlt"></canvas>
              <p class="muted small" style="margin:6px 0 0;line-height:1.5" data-i18n="pat.help"></p>
            </div>
            <div class="field place-field" id="place-field" hidden>
              <label data-i18n="area.title"></label>
              <div class="place-row">
                <span class="small" id="place-info"></span>
                <div class="place-btns">
                  <button class="btn btn-sm" type="button" data-nudge="0,-1" data-i18n-aria="area.up">↑</button>
                  <button class="btn btn-sm" type="button" data-nudge="0,1" data-i18n-aria="area.down">↓</button>
                  <button class="btn btn-sm" type="button" data-nudge="-1,0" data-i18n-aria="area.toLeft">←</button>
                  <button class="btn btn-sm" type="button" data-nudge="1,0" data-i18n-aria="area.toRight">→</button>
                  <button class="btn btn-sm" type="button" id="place-reset" data-i18n="area.reset"></button>
                </div>
              </div>
              <p class="muted small" style="margin:6px 0 0;line-height:1.5" data-i18n="area.help"></p>
            </div>
          </section>

          <section class="panel-section merge-section" id="sec-merge" hidden>
            <h3 data-i18n="merge.title"></h3>
            <p class="muted small" style="margin:0 0 10px;line-height:1.5" data-i18n="merge.help"></p>
            <div id="merge-body"></div>
            <input type="file" id="merge-file" accept=".xlsx,.csv,.tsv,.txt,text/csv,text/plain,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
          </section>

          <section class="panel-section" id="sec-check">
            <h3 data-i18n="check.title"></h3>
            <ul class="check-legend" id="check-legend"></ul>
            <ul class="check-list" id="check-list"></ul>
          </section>

          <section class="panel-section" id="sec-props">
            <h3 id="props-title"></h3>
            <div id="props"></div>
          </section>

          <section class="panel-section" id="sec-layers">
            <h3 data-i18n="panel.layers"></h3>
            <ul class="layers" id="layers"></ul>
          </section>
        </div>
        <div class="panel-foot">
          <div class="price-line">
            <div>
              <div class="amount" id="price"></div>
              <div class="price-note" id="price-note"></div>
              <button type="button" class="qty-chip" id="qty-chip" hidden></button>
            </div>
            <div class="price-note text-end" data-i18n-html="panel.oneOff"></div>
          </div>
          <div class="foot-actions">
            <button class="btn btn-lg mobile-only" id="preview-open-m" data-i18n-title="pv.open">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="M3 7l9 5 9-5M12 12v10"/></svg><span data-i18n="draft.preview"></span>
            </button>
            <button class="btn btn-lg" id="save-draft" data-i18n="draft.save" data-i18n-title="draft.saveTitle"></button>
            <button class="btn btn-primary btn-lg" id="add-to-cart"></button>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <div class="share-dialog" id="share-dialog" hidden>
    <div class="box" role="dialog" aria-modal="true" aria-labelledby="share-dialog-title">
      <div class="head"><h3 id="share-dialog-title" data-i18n="share.dialogTitle"></h3><button class="fly-close" id="share-close" data-i18n-aria="bar.close">✕</button></div>
      <p class="muted small" style="margin:0" data-i18n="share.dialogText"></p>
      <div class="share-link-row"><input type="text" id="share-url" readonly><button class="btn btn-sm" id="share-copy" data-i18n="share.copy"></button></div>
      <div class="share-actions">
