<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OneOff Print</title>
  <script>(function(){var l;try{l=localStorage.getItem('pod-lang')}catch(e){}l=l==='en'?'en':'ar';var d=document.documentElement;d.lang=l;d.dir=l==='ar'?'rtl':'ltr'})()</script>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/css/styles.css">
  <script type="importmap">{ "imports": { "three": "/vendor/three/three.module.min.js" } }</script>
</head>
<body class="editor-page" data-title-key="editor.pageTitle">
  <header class="site-header">
    <div class="container inner" style="max-width: none;">
      <a class="brand" href="/"><span class="brand-mark">1</span>OneOff Print</a>
      <nav>
        <a href="/#products" data-i18n="nav.products"></a>
        <a class="cart-link" href="/cart"><span data-i18n="nav.cart"></span> <span class="badge" data-cart-count hidden>0</span></a>
        <button class="btn btn-sm lang-toggle" data-lang-toggle data-i18n="lang.other"></button>
      </nav>
    </div>
  </header>

  <main>
    <div class="editor">
      <!-- Tools -->
      <aside class="tools">
        <button class="tool" data-flyout="templates" data-i18n-title="tool.templates.title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg><span data-i18n="tool.templates"></span>
        </button>
        <button class="tool" data-flyout="text" data-i18n-title="tool.text.title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6V4h16v2M12 4v16M9 20h6"/></svg><span data-i18n="tool.text"></span>
        </button>
        <button class="tool" data-flyout="upload" data-i18n-title="tool.image.title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg><span data-i18n="tool.image"></span>
        </button>
        <button class="tool" data-flyout="shapes" data-i18n-title="tool.shapes.title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><circle cx="8" cy="8" r="5"/><path d="M13 13h8v8h-8z"/></svg><span data-i18n="tool.shapes"></span>
        </button>
        <button class="tool" data-flyout="stickers" data-i18n-title="tool.stickers.title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 3H6a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3h7l8-8V6.5"/><path d="M21 13h-5a3 3 0 0 0-3 3v5"/><path d="M8 10h.01M14 10h.01M8.5 14.5s1.2 1.5 3.5 1.5"/></svg><span data-i18n="tool.stickers"></span>
        </button>
        <button class="tool mobile-only" data-sheet="product" data-i18n-title="tool.product">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M8 3 4 6l2 4 2-1v12h8V9l2 1 2-4-4-3c-.5 1.5-2 2.5-4 2.5S8.5 4.5 8 3z"/></svg><span data-i18n="tool.product"></span>
        </button>
      </aside>

      <!-- Canvas -->
      <section class="stage-wrap">
        <div class="stage-bar">
          <div class="side-tabs" id="side-tabs" role="tablist"></div>
          <button class="check-chip ok" id="check-chip"></button>
          <div class="spacer"></div>
          <div class="zoom-group">
            <button id="zoom-out" data-i18n-title="bar.zoomOut" data-i18n-aria="bar.zoomOut">−</button>
            <span id="zoom-label">100%</span>
            <button id="zoom-in" data-i18n-title="bar.zoomIn" data-i18n-aria="bar.zoomIn">+</button>
            <button id="zoom-fit" data-i18n-title="bar.zoomFit" data-i18n-aria="bar.zoomFit">⤢</button>
          </div>
          <button class="btn btn-sm btn-icon" id="undo" data-i18n-title="bar.undo" data-i18n-aria="bar.undo">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>
          </button>
          <button class="btn btn-sm btn-icon" id="redo" data-i18n-title="bar.redo" data-i18n-aria="bar.redo">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg>
          </button>
          <button class="btn btn-sm btn-dark" id="preview-open" data-i18n-title="pv.open">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="M3 7l9 5 9-5M12 12v10"/></svg><span class="btn-label" data-i18n="pv.open"></span>
          </button>
          <button class="btn btn-sm" id="preview-toggle" data-i18n-title="bar.preview.title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span class="btn-label" data-i18n="bar.preview"></span>
          </button>
          <button class="btn btn-sm btn-danger" id="clear-side" data-i18n-title="bar.clear.title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg><span class="btn-label" data-i18n="bar.clear"></span>
          </button>
        </div>
        <div class="stage" id="stage">
          <canvas id="design-canvas"></canvas>
        </div>

        <div class="flyout" id="flyout-templates" hidden>
          <div class="fly-head"><h4 data-i18n="fly.templates"></h4><button class="fly-close" data-i18n-aria="bar.close">✕</button></div>
          <p class="muted small" style="margin-top:0" data-i18n="fly.templates.hint"></p>
          <div class="template-grid" id="template-grid"></div>
        </div>
        <div class="flyout" id="flyout-text" hidden>
          <div class="fly-head"><h4 data-i18n="fly.text"></h4><button class="fly-close" data-i18n-aria="bar.close">✕</button></div>
          <div id="text-presets"></div>
        </div>
        <div class="flyout" id="flyout-upload" hidden>
          <div class="fly-head"><h4 data-i18n="fly.upload"></h4><button class="fly-close" data-i18n-aria="bar.close">✕</button></div>
          <label class="dropzone" id="dropzone" for="file-input">
            <span data-i18n-html="fly.upload.drop"></span><br>
            <span class="muted small" data-i18n="fly.upload.types"></span>
          </label>
          <input type="file" id="file-input" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
          <p class="muted small" style="line-height:1.5;margin-bottom:0;" data-i18n="fly.upload.tip"></p>
        </div>
        <div class="flyout" id="flyout-stickers" hidden>
          <div class="fly-head"><h4 data-i18n="fly.stickers"></h4><button class="fly-close" data-i18n-aria="bar.close">✕</button></div>
          <div class="cat-chips small-chips" id="sticker-cats"></div>
          <div class="sticker-grid" id="sticker-grid"></div>
        </div>
        <div class="flyout" id="flyout-shapes" hidden>
          <div class="fly-head"><h4 data-i18n="fly.shapes"></h4><button class="fly-close" data-i18n-aria="bar.close">✕</button></div>
          <div class="shape-grid" id="shape-grid"></div>
          <button class="btn btn-block btn-sm" id="fill-area" style="margin-top:12px;" data-i18n="fly.fillArea"></button>
        </div>
      </section>

      <!-- Product + properties -->
      <aside class="panel">
        <div class="sheet-head"><strong id="sheet-title"></strong><button id="sheet-close" class="fly-close" data-i18n-aria="bar.close">✕</button></div>
        <div class="panel-scroll">
          <section class="panel-section" id="sec-product">
            <div class="field">
              <label for="product-select" data-i18n="panel.product"></label>
              <select id="product-select"></select>
            </div>
            <div class="field">
              <label><span data-i18n="panel.colour"></span> <span id="color-name" class="muted"></span></label>
              <div class="swatches" id="swatches"></div>
            </div>
            <div class="field" style="margin-bottom:0">
              <label data-i18n="panel.size"></label>
              <div class="chips" id="sizes"></div>
            </div>
          </section>

          <section class="panel-section" id="sec-check">
            <h3 data-i18n="check.title"></h3>
            <ul class="check-legend" id="check-legend"></ul>
            <ul class="check-list" id="check-list"></ul>
          </section>

          <section class="panel-section" id="sec-props">
            <h3 id="props-title"></h3>
            <div id="props"></div>
          </section>

          <section class="panel-section" id="sec-layers">
            <h3 data-i18n="panel.layers"></h3>
            <ul class="layers" id="layers"></ul>
          </section>
        </div>
        <div class="panel-foot">
          <div class="price-line">
            <div>
              <div class="amount" id="price"></div>
              <div class="price-note" id="price-note"></div>
            </div>
            <div class="price-note text-end" data-i18n-html="panel.oneOff"></div>
          </div>
          <button class="btn btn-primary btn-lg btn-block" id="add-to-cart"></button>
        </div>
      </aside>
    </div>
  </main>

  <div class="pv-modal" id="pv" hidden>
    <div class="pv-box" role="dialog" aria-modal="true" aria-labelledby="pv-title">
      <div class="pv-head">
        <h3 id="pv-title" data-i18n="pv.title"></h3>
        <div class="side-tabs pv-tabs">
          <button class="side-tab" data-pv-tab="real" data-i18n="pv.realistic"></button>
          <button class="side-tab" data-pv-tab="3d" data-i18n="pv.3d"></button>
          <button class="side-tab" data-pv-tab="proof" data-i18n="pv.proof"></button>
        </div>
        <button class="fly-close" id="pv-close" data-i18n-aria="bar.close">✕</button>
      </div>
      <div class="side-tabs pv-sides" id="pv-sides" hidden></div>
      <div class="pv-body" id="pv-body"></div>
      <div class="pv-foot">
        <span class="muted small" id="pv-hint"></span>
        <label class="check" id="pv-spin-wrap"><input type="checkbox" id="pv-spin" checked> <span data-i18n="pv.spin"></span></label>
        <button class="btn btn-sm" id="pv-download" data-i18n="pv.download"></button>
      </div>
    </div>
  </div>

  <div class="overlay-busy" id="busy" hidden><div><div class="spinner"></div><span id="busy-text"></span></div></div>

  <script src="/vendor/fabric-5.3.0.min.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/fabric-ext.js"></script>
  <script src="/js/templates.js"></script>
  <script src="/js/stickers.js"></script>
  <script src="/js/photo-mockups.js"></script>
  <script src="/js/preview.js"></script>
  <script src="/js/editor.js"></script>
</body>
</html>
