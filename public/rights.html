<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OneOff Print</title>
  <script>(function(){var l;try{l=localStorage.getItem('pod-lang')}catch(e){}l=l==='en'?'en':'ar';var d=document.documentElement;d.lang=l;d.dir=l==='ar'?'rtl':'ltr'})()</script>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body data-title-key="rights.pageTitle">
  <header class="site-header">
    <div class="container inner">
      <a class="brand" href="/"><span class="brand-mark">1</span>OneOff Print</a>
      <nav>
        <a href="/#products" data-i18n="nav.products"></a>
        <a href="/designs"><span class="nav-long" data-i18n="nav.designs"></span><span class="nav-short" data-i18n="nav.designsShort"></span></a>
        <a href="/photos"><span class="nav-long" data-i18n="nav.photos"></span><span class="nav-short" data-i18n="nav.photosShort"></span></a>
        <a class="cart-link" href="/cart"><span data-i18n="nav.cart"></span> <span class="badge" data-cart-count hidden>0</span></a>
        <button class="btn btn-sm lang-toggle" data-lang-toggle data-i18n="lang.other"></button>
      </nav>
    </div>
  </header>

  <main class="container acct">
    <div class="card acct-card" style="max-width:620px">
      <h1 style="font-size:22px;margin:0 0 10px" data-i18n="rights.pageTitle"></h1>
      <p style="line-height:1.8" data-i18n="rights.pageIntro"></p>
      <form id="tk-form" novalidate>
        <div class="field"><label for="tk-name" data-i18n="rights.name"></label><input type="text" id="tk-name" maxlength="120" autocomplete="name" required></div>
        <div class="field"><label for="tk-contact" data-i18n="rights.contact"></label><input type="text" id="tk-contact" maxlength="200" dir="ltr" autocomplete="email" required></div>
        <div class="field"><label for="tk-owner" data-i18n="rights.owner"></label><input type="text" id="tk-owner" maxlength="200"></div>
        <div class="field"><label for="tk-link" data-i18n="rights.link"></label><input type="text" id="tk-link" maxlength="500" dir="ltr"></div>
        <div class="field"><label for="tk-details" data-i18n="rights.details"></label><textarea id="tk-details" rows="5" maxlength="3000" required></textarea></div>
        <button class="btn btn-primary" type="submit" data-i18n="rights.send"></button>
      </form>
      <p class="small" id="tk-done" hidden data-i18n="rights.sent" style="line-height:1.7;margin:12px 0 0"></p>
    </div>
  </main>

  <footer class="site-footer"><div class="container" data-i18n="footer"></div></footer>
  <script src="/js/i18n.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/rights.js"></script>
</body>
</html>
