<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>إبداع · قريبًا · ebda3</title>
  <link rel="icon" href="/favicon.svg?v=ebda3" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico?v=ebda3" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=ebda3">
  <meta name="theme-color" content="#FAFAF7">
  <meta property="og:site_name" content="إبداع · ebda3">
  <meta property="og:title" content="إبداع · ebda3">
  <meta property="og:description" content="قريبًا · Coming soon">
  <meta property="og:image" content="https://ebda3.me/img/og-ebda3.png">
  <meta name="twitter:card" content="summary_large_image">
  <!-- The page anyone sees while the site is private (src/preview.js): the brand, "soon", and the code box. -->
  <link rel="stylesheet" href="/fonts/fonts.css">
  <style>
    :root { --ink: #16181d; --ink-2: #5b606b; --accent: #d9461f; --bg: #FAFAF7; --line: #e4e2dc; --bad: #b42318; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); }
    body {
      min-height: 100vh; min-height: 100svh; display: flex; align-items: center; justify-content: center; padding: 32px 16px;
      color: var(--ink); font-family: "Cairo", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    }
    main { width: 100%; max-width: 420px; text-align: center; }
    .logos { display: flex; justify-content: center; align-items: center; gap: 22px; margin-bottom: 40px; }
    .logos img { height: 92px; width: auto; display: block; }
    .soon { margin: 0; font-size: 56px; line-height: 1.2; font-weight: 800; letter-spacing: -.01em; }
    .soon-en { margin: 6px 0 44px; font-size: 15px; font-weight: 600; color: var(--ink-2); letter-spacing: .32em; text-transform: uppercase; direction: ltr; }
    form { display: flex; gap: 8px; }
    input {
      flex: 1; min-width: 0; height: 50px; padding: 0 14px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink);
      font: inherit; font-size: 17px; letter-spacing: .14em; text-transform: uppercase; direction: ltr; text-align: center;
    }
    input::placeholder { letter-spacing: 0; text-transform: none; color: #9aa0a8; font-size: 15px; }
    input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(217, 70, 31, .14); }
    button { height: 50px; padding: 0 22px; border: 0; border-radius: 12px; background: var(--ink); color: #fff; font: inherit; font-weight: 700; font-size: 16px; cursor: pointer; white-space: nowrap; }
    button:focus-visible { outline: 3px solid rgba(22, 24, 29, .3); outline-offset: 2px; }
    .msg { margin: 12px 0 0; font-size: 14px; line-height: 1.7; color: var(--bad); }
    .msg span { display: block; direction: ltr; font-size: 13px; }
    .msg[hidden] { display: none; }
    @media (max-width: 400px) { .logos img { height: 72px; } .logos { gap: 16px; } .soon { font-size: 46px; } }
  </style>
</head>
<body>
  <main>
    <div class="logos">
      <img src="/img/logo-ar.svg" alt="إبداع" width="141" height="92">
      <img src="/img/logo-en.svg" alt="ebda3" width="225" height="92">
    </div>
    <h1 class="soon">قريبًا</h1>
    <p class="soon-en" lang="en">Coming soon</p>
    <form method="post" action="/api/preview/enter">
      <input id="code" name="code" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" maxlength="24" required placeholder="كود الدعوة · Invitation code" aria-label="كود الدعوة · Invitation code" aria-describedby="msg">
      <button type="submit">ادخل · Enter</button>
    </form>
    <p class="msg" id="msg" role="alert" hidden></p>
  </main>
  <script>
    (function () {
      // ?code=wrong (no such code, or turned off) / ?code=wait (too many tries): say so under the box.
      var why = new URLSearchParams(location.search).get('code');
      var text = why === 'wrong'
        ? ['الكود ده مش صحيح أو مبقاش شغال.', 'That code is wrong or no longer works.']
        : why === 'wait'
          ? ['جربت كتير. استنى شوية وجرب تاني.', 'Too many tries. Please wait a little.']
          : null;
      if (!text) return;
      var box = document.getElementById('msg');
      box.textContent = text[0];
      var en = document.createElement('span');
      en.lang = 'en';
      en.textContent = text[1];
      box.appendChild(en);
      box.hidden = false;
      history.replaceState(null, '', location.pathname);
    })();
  </script>
</body>
</html>
