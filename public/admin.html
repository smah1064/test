<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>OneOff Print</title>
  <script>(function(){var l;try{l=localStorage.getItem('pod-lang')}catch(e){}l=l==='en'?'en':'ar';var d=document.documentElement;d.lang=l;d.dir=l==='ar'?'rtl':'ltr'})()</script>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/review.css">
  <style>
    /* Orders: shipping, delivery and payment */
    .pill.delivered { background: #138a4a; color: #fff; }
    .pill.pay-paid { background: #e3f5ea; color: var(--ok); }
    .pill.pay-pending { background: #eef1f6; color: var(--ink-2); }
    .order-state { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
    .order-state .ship-note { flex-basis: 100%; font-size: 12px; color: var(--ink-3); }
    .ship-toggle { margin-top: 8px; white-space: nowrap; }
    .ship-toggle[aria-expanded="true"] { border-color: var(--accent); background: var(--accent-soft); }
    tr.ship-row > td { background: #fafbfc; padding: 12px; }
    .ship-box { display: grid; gap: 14px; padding: 16px; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; }
    .ship-head { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
    .ship-head h3 { margin: 0; font-size: 16px; }
    .ship-head .ship-links { margin-inline-start: auto; display: flex; gap: 6px; flex-wrap: wrap; }
    .ship-steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
    .ship-steps li { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 13px; min-width: 0; }
    .ship-steps li b { display: block; font-size: 13px; }
    .ship-steps li span { color: var(--ink-3); font-size: 12px; }
    .ship-steps li.done { border-color: #b7e2c8; background: #f1faf4; }
    .ship-steps li.done span { color: var(--ok); }
    .ship-fields { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .ship-fields .field { margin: 0; min-width: 0; }
    .ship-fields input { width: 100%; }
    .ship-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .ship-pay { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; padding-top: 12px; border-top: 1px solid var(--line); }
    .ship-msg { font-size: 13px; font-weight: 600; }
    .ship-msg.ok { color: var(--ok); }
    .ship-msg.bad { color: var(--bad); }
    @media (max-width: 960px) { .ship-fields { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 700px) {
      #tab-orders .orders-card { overflow: visible !important; background: transparent; border: 0; box-shadow: none; }
      #tab-orders table.orders, #tab-orders table.orders tbody, #tab-orders table.orders tr, #tab-orders table.orders td { display: block; width: 100%; }
      #tab-orders table.orders thead { display: none; }
      #tab-orders table.orders tr.order-row { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); margin-top: 10px; padding: 4px 0; }
      #tab-orders table.orders tr.order-row > td { border: 0; padding: 6px 14px; }
      #tab-orders table.orders tr.order-row > td[data-label]::before { content: attr(data-label); display: block; font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 2px; }
      #tab-orders table.orders tr.ship-row > td { padding: 0; background: transparent; border: 0; }
      #tab-orders table.orders tr.ship-row .ship-box { border-top: 0; border-radius: 0 0 var(--radius) var(--radius); margin-top: -8px; }
      #tab-orders table.orders tr.order-row.open { border-radius: var(--radius) var(--radius) 0 0; }
      .ship-steps { grid-template-columns: 1fr 1fr; }
      .ship-fields { grid-template-columns: 1fr; }
      .ship-actions .btn { flex: 1 1 auto; }
      .ship-head .ship-links { margin-inline-start: 0; }
    }
  </style>
</head>
<body data-title-key="admin.pageTitle">
  <header class="site-header">
    <div class="container inner">
      <a class="brand" href="/"><span class="brand-mark">1</span>OneOff Print</a>
      <span class="muted small" data-i18n="admin.production"></span>
      <nav>
        <button class="btn btn-sm lang-toggle" data-lang-toggle data-i18n="lang.other"></button>
        <button class="btn btn-sm" id="logout" hidden data-i18n="admin.signOut"></button>
      </nav>
    </div>
  </header>

  <main class="container">
    <form class="card login" id="login" hidden>
      <h2 data-i18n="admin.loginTitle"></h2>
      <p class="muted small" data-i18n="admin.loginText"></p>
      <div class="field"><label for="password" data-i18n="admin.password"></label><input type="password" id="password" autocomplete="current-password" dir="ltr" required></div>
      <button class="btn btn-dark btn-block" type="submit" data-i18n="admin.signIn"></button>
    </form>

    <div id="dash" hidden>
      <p class="notice" id="weak-pw" hidden data-i18n="admin.weakPw" style="margin:0 0 12px"></p>
      <div class="page-head" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <h1 style="margin:0" data-i18n="admin.queueTitle"></h1>
        <div class="tabs" style="margin:0;margin-inline-start:auto">
          <button class="btn btn-sm active" data-tab="queue" data-i18n="admin.tabQueue"></button>
          <button class="btn btn-sm rv-tab" data-tab="review"><span data-i18n="rv.tab"></span><span class="rv-count" id="rv-count" hidden></span></button>
          <button class="btn btn-sm" data-tab="orders" data-i18n="admin.tabOrders"></button>
          <button class="btn btn-sm" data-tab="film" data-i18n="admin.tabFilm"></button>
          <button class="btn btn-sm" data-tab="library" data-i18n="lib.tab"></button>
          <button class="btn btn-sm" data-tab="houses" data-i18n="houses.tab"></button>
          <button class="btn btn-sm" data-tab="accounts" data-i18n="acc.tab"></button>
          <button class="btn btn-sm" data-tab="coupons" data-i18n="cp.tab"></button>
          <button class="btn btn-sm" data-tab="customers" data-i18n="cu.tab"></button>
        </div>
      </div>

      <section id="tab-queue">
        <div class="stats" id="stats"></div>
        <div id="rv-queue-note"></div>
        <h2 style="font-size:18px" data-i18n="admin.onPress"></h2>
        <div id="current"></div>
        <h2 style="font-size:18px;margin-top:28px" data-i18n="admin.upNext"></h2>
        <div class="queue-list" id="up-next"></div>
        <h2 style="font-size:18px;margin-top:28px" data-i18n="admin.toShip"></h2>
        <div class="queue-list" id="to-ship"></div>
      </section>

      <section id="tab-review" hidden>
        <div class="card rv-intro">
          <h2 data-i18n="rv.title"></h2>
          <p class="muted small" data-i18n="rv.help"></p>
          <p class="rv-screen-note small" data-i18n="rv.screenNote"></p>
        </div>
        <div class="rv-list" id="rv-list"></div>
      </section>

      <section id="tab-film" hidden>
        <div class="card" style="padding:18px;margin-bottom:14px">
          <h2 style="font-size:18px;margin-bottom:6px" data-i18n="admin.filmTitle"></h2>
          <p class="muted small" style="margin:0 0 12px;line-height:1.6" data-i18n="admin.filmText"></p>
          <div class="row" style="flex-wrap:wrap">
            <button class="btn btn-primary shrink" id="film-build" data-i18n="admin.filmBuild"></button>
            <span class="small" id="film-msg" style="color:var(--ok);font-weight:600"></span>
          </div>
        </div>
        <div class="queue-list" id="film-list"></div>
      </section>

      <section id="tab-library" hidden>
        <form class="card lib-add" id="lib-add">
          <h2 style="font-size:16px;margin:0 0 4px" data-i18n="lib.addTitle"></h2>
          <p class="muted small" style="margin:0 0 10px;line-height:1.6" data-i18n="lib.addHelp"></p>
          <div class="lib-form">
            <div class="field"><label for="lib-share" data-i18n="lib.share"></label><input type="url" id="lib-share" dir="ltr" placeholder="https://…/s/…" required></div>
            <div class="field"><label for="lib-name-ar" data-i18n="lib.nameAr"></label><input type="text" id="lib-name-ar" maxlength="60" dir="rtl"></div>
            <div class="field"><label for="lib-name-en" data-i18n="lib.nameEn"></label><input type="text" id="lib-name-en" maxlength="60" dir="ltr"></div>
            <div class="field"><label for="lib-cat" data-i18n="lib.category"></label><select id="lib-cat"></select></div>
          </div>
          <div class="row" style="flex-wrap:wrap;gap:10px;align-items:center">
            <button class="btn btn-primary shrink" type="submit" data-i18n="lib.add"></button>
            <a class="btn shrink" href="/designs" target="_blank" rel="noopener" data-i18n="lib.viewShop"></a>
            <span class="small" id="lib-msg"></span>
          </div>
        </form>
        <div class="queue-list" id="lib-list"></div>
      </section>

      <section id="tab-houses" hidden>
        <p class="notice" id="houses-email-off" hidden data-i18n="houses.emailOff" style="margin:0 0 12px"></p>
        <form class="card house-form" id="house-form">
          <h2 style="font-size:16px;margin:0 0 4px" id="house-form-title" data-i18n="houses.addTitle"></h2>
          <p class="muted small" style="margin:0 0 10px;line-height:1.6" data-i18n="houses.addHelp"></p>
          <input type="hidden" id="house-id">
          <div class="lib-form">
            <div class="field"><label for="house-name" data-i18n="houses.name"></label><input type="text" id="house-name" maxlength="80" required></div>
            <div class="field"><label for="house-email" data-i18n="houses.email"></label><input type="email" id="house-email" maxlength="120" dir="ltr" placeholder="name@example.com"></div>
            <div class="field"><label for="house-wa" data-i18n="houses.whatsapp"></label><input type="tel" id="house-wa" maxlength="24" dir="ltr" placeholder="01012345678"></div>
            <div class="field"><label for="house-prefer" data-i18n="houses.prefer"></label><select id="house-prefer"><option value="email" data-i18n="houses.byEmail"></option><option value="whatsapp" data-i18n="houses.byWhatsApp"></option></select></div>
          </div>
          <div class="field"><label for="house-notes" data-i18n="houses.notes"></label><input type="text" id="house-notes" maxlength="300"></div>
          <div class="row" style="flex-wrap:wrap;gap:10px;align-items:center">
            <button class="btn btn-primary shrink" type="submit" id="house-save" data-i18n="houses.save"></button>
            <button class="btn shrink" type="button" id="house-cancel" hidden data-i18n="houses.cancel"></button>
            <span class="small" id="house-msg"></span>
          </div>
        </form>
        <div class="queue-list" id="house-list"></div>
        <div class="card" style="padding:18px;margin-top:18px">
          <h2 style="font-size:16px;margin:0 0 4px" data-i18n="houses.mapTitle"></h2>
          <p class="muted small" style="margin:0 0 12px;line-height:1.6" data-i18n="houses.mapHelp"></p>
          <div id="house-map"></div>
        </div>
      </section>

      <section id="tab-accounts" hidden>
        <div class="tabs acc-subtabs">
          <button class="btn btn-sm active" data-acc-view="overview" data-i18n="acc.overview"></button>
          <button class="btn btn-sm" data-acc-view="prices" data-i18n="acc.prices"></button>
          <button class="btn btn-sm" data-acc-view="expenses" data-i18n="acc.expenses"></button>
        </div>

        <div id="acc-overview">
          <div class="card acc-period">
            <div class="chips" id="acc-periods"></div>
            <div class="acc-custom" id="acc-custom" hidden>
              <label class="small"><span data-i18n="acc.from"></span> <input type="date" id="acc-from"></label>
              <label class="small"><span data-i18n="acc.to"></span> <input type="date" id="acc-to"></label>
            </div>
            <button class="btn btn-sm" id="acc-csv" data-i18n="acc.csv"></button>
          </div>
          <p class="notice" id="acc-missing" hidden style="margin:0 0 12px"></p>
          <div class="stats acc-stats" id="acc-stats"></div>
          <div class="card acc-ship">
            <label for="acc-ship-cost"><strong data-i18n="acc.shipCost"></strong><br><span class="muted small" data-i18n="acc.shipCostHelp"></span></label>
            <div class="row" style="gap:8px;flex:0 0 auto"><input type="number" id="acc-ship-cost" min="0" step="0.01" style="width:120px" dir="ltr"><button class="btn btn-sm" id="acc-ship-save" data-i18n="houses.save"></button></div>
          </div>
          <h2 class="acc-h" data-i18n="acc.byProduct"></h2>
          <div class="card" style="overflow-x:auto"><table class="orders acc-table" id="acc-products"></table></div>
          <h2 class="acc-h" data-i18n="acc.ordersTitle"></h2>
          <p class="muted small" data-i18n="acc.ordersHelp" style="margin:-4px 0 10px"></p>
          <div class="card" style="overflow-x:auto"><table class="orders acc-table" id="acc-orders"></table></div>
        </div>

        <div id="acc-prices" hidden>
          <p class="muted small" style="line-height:1.7;margin:0 0 12px" data-i18n="acc.pricesHelp"></p>
          <div id="acc-price-list"></div>
        </div>

        <div id="acc-expenses" hidden>
          <form class="card acc-exp-form" id="acc-exp-form">
            <h2 style="font-size:16px;margin:0 0 10px" data-i18n="acc.addExpense"></h2>
            <div class="lib-form">
              <div class="field"><label for="exp-date" data-i18n="acc.date"></label><input type="date" id="exp-date" required></div>
              <div class="field"><label for="exp-cat" data-i18n="acc.category"></label><select id="exp-cat"></select></div>
              <div class="field"><label for="exp-desc" data-i18n="acc.description"></label><input type="text" id="exp-desc" maxlength="200"></div>
              <div class="field"><label for="exp-amount" data-i18n="acc.amount"></label><input type="number" id="exp-amount" min="0.01" step="0.01" required dir="ltr"></div>
            </div>
            <div class="row" style="gap:10px;align-items:center"><button class="btn btn-primary shrink" type="submit" data-i18n="acc.add"></button><span class="small" id="exp-msg"></span></div>
          </form>
          <p class="muted small" id="acc-exp-period" style="margin:14px 0 8px"></p>
          <div class="card" style="overflow-x:auto"><table class="orders acc-table" id="acc-exp-list"></table></div>
        </div>
      </section>

      <section id="tab-coupons" hidden>
        <form class="card house-form" id="cp-form">
          <h2 style="font-size:16px;margin:0 0 4px" id="cp-form-title" data-i18n="cp.addTitle"></h2>
          <p class="muted small" style="margin:0 0 10px;line-height:1.6" data-i18n="cp.help"></p>
          <input type="hidden" id="cp-id">
          <div class="lib-form">
            <div class="field"><label for="cp-code" data-i18n="cp.code"></label><input type="text" id="cp-code" maxlength="24" dir="ltr" required style="text-transform:uppercase" placeholder="EID20"></div>
            <div class="field"><label for="cp-type" data-i18n="cp.type"></label><select id="cp-type"><option value="percent" data-i18n="cp.percent"></option><option value="fixed" data-i18n="cp.fixed"></option><option value="freeship" data-i18n="cp.freeship"></option></select></div>
            <div class="field" id="cp-value-f"><label for="cp-value" data-i18n="cp.value"></label><input type="number" id="cp-value" min="0.01" step="0.01" dir="ltr"></div>
            <div class="field" id="cp-max-f"><label for="cp-max" data-i18n="cp.maxDiscount"></label><input type="number" id="cp-max" min="0" step="0.01" dir="ltr"></div>
            <div class="field"><label for="cp-min" data-i18n="cp.minOrder"></label><input type="number" id="cp-min" min="0" step="0.01" dir="ltr"></div>
            <div class="field"><label for="cp-uses" data-i18n="cp.maxUses"></label><input type="number" id="cp-uses" min="1" step="1" dir="ltr"></div>
            <div class="field"><label for="cp-per" data-i18n="cp.perCustomer"></label><input type="number" id="cp-per" min="1" step="1" dir="ltr"></div>
            <div class="field"><label for="cp-start" data-i18n="cp.startsOn"></label><input type="date" id="cp-start"></div>
            <div class="field"><label for="cp-end" data-i18n="cp.endsOn"></label><input type="date" id="cp-end"></div>
          </div>
          <div class="field"><label data-i18n="cp.appliesTo"></label><div class="chip-row" id="cp-cats"></div><p class="muted small" style="margin:6px 0 0" data-i18n="cp.appliesHelp"></p></div>
          <div class="field"><label for="cp-note" data-i18n="cp.note"></label><input type="text" id="cp-note" maxlength="200"></div>
          <label class="check" style="margin-bottom:10px"><input type="checkbox" id="cp-active" checked> <span data-i18n="cp.active"></span></label>
          <div class="row" style="flex-wrap:wrap;gap:10px;align-items:center">
            <button class="btn btn-primary shrink" type="submit" data-i18n="houses.save"></button>
            <button class="btn shrink" type="button" id="cp-cancel" hidden data-i18n="houses.cancel"></button>
            <span class="small" id="cp-msg"></span>
          </div>
        </form>
        <div class="queue-list" id="cp-list"></div>
      </section>

      <section id="tab-customers" hidden>
        <div class="card" style="padding:16px;margin-bottom:12px">
          <h2 style="font-size:16px;margin:0 0 4px" data-i18n="cu.title"></h2>
          <p class="muted small" style="margin:0 0 10px;line-height:1.6" data-i18n="cu.help"></p>
          <input type="search" id="cu-q" autocomplete="off" maxlength="80" data-i18n-placeholder="cu.search" style="max-width:360px">
          <span class="small muted" id="cu-count" style="margin-inline-start:10px"></span>
        </div>
        <div class="queue-list" id="cu-list"></div>
      </section>

      <section id="tab-orders" hidden>
        <div class="card notify-card">
          <div class="notify-head">
            <h2 style="font-size:16px;margin:0" data-i18n="notify.title"></h2>
            <button class="btn btn-sm" id="notify-test" data-i18n="notify.test"></button>
          </div>
          <div class="notify-list" id="notify-status"></div>
          <p class="muted small" id="notify-msg" style="margin:6px 0 0"></p>
        </div>
        <div class="card orders-card" style="overflow-x:auto">
          <table class="orders">
            <thead><tr><th data-i18n="admin.col.order"></th><th data-i18n="admin.col.customer"></th><th data-i18n="admin.col.items"></th><th data-i18n="admin.col.total"></th><th data-i18n="admin.col.status"></th><th data-i18n="notify.col"></th></tr></thead>
            <tbody id="orders"></tbody>
          </table>
          <datalist id="ship-couriers"></datalist>
        </div>
      </section>
    </div>
  </main>

  <script src="/js/i18n.js"></script>
  <script src="/js/i18n-admin-shipping.js"></script>
  <script src="/js/i18n-review.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
