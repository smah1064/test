<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OneOff Print</title>
  <script>(function(){var l;try{l=localStorage.getItem('pod-lang')}catch(e){}l=l==='en'?'en':'ar';var d=document.documentElement;d.lang=l;d.dir=l==='ar'?'rtl':'ltr'})()</script>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body data-title-key="gang.pageTitle">
  <header class="site-header">
    <div class="container inner">
      <a class="brand" href="/"><span class="brand-mark">1</span>OneOff Print</a>
      <nav>
        <a href="/#products" data-i18n="nav.products"></a>
        <a href="/gangsheet" data-i18n="nav.gang"></a>
        <a class="cart-link" href="/cart"><span data-i18n="nav.cart"></span> <span class="badge" data-cart-count hidden>0</span></a>
        <button class="btn btn-sm lang-toggle" data-lang-toggle data-i18n="lang.other"></button>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="page-head">
      <h1 data-i18n="gang.title"></h1>
      <p class="muted" id="gang-lead" style="max-width:760px;line-height:1.6"></p>
    </div>

    <div class="gang-layout">
      <section>
        <div class="card gang-panel">
          <h2 style="font-size:18px" data-i18n="gang.designs"></h2>
          <label class="dropzone" id="gang-drop" for="gang-file">
            <span data-i18n-html="gang.drop"></span><br>
            <span class="muted small" data-i18n="gang.dropHint"></span>
          </label>
          <input type="file" id="gang-file" accept="image/png,image/jpeg,image/webp" multiple hidden>
          <div id="gang-items" class="gang-items"></div>
        </div>
        <div class="card gang-panel gang-tips">
          <h3 data-i18n="gang.tips"></h3>
          <ul>
            <li data-i18n="gang.tip1"></li>
            <li data-i18n="gang.tip2"></li>
            <li data-i18n="gang.tip3"></li>
          </ul>
        </div>
      </section>

      <aside class="card gang-panel gang-sheet">
        <h2 style="font-size:18px" data-i18n="gang.sheet"></h2>
        <div class="gang-summary">
          <div><div class="amount" id="gang-price"></div><div class="muted small" id="gang-size"></div></div>
          <div class="muted small" id="gang-pieces"></div>
        </div>
        <div class="gang-preview-wrap"><canvas id="gang-preview"></canvas></div>
        <p class="notice" id="gang-error" hidden></p>
        <button class="btn btn-primary btn-lg btn-block" id="gang-add" data-i18n="gang.add" disabled></button>
      </aside>
    </div>
  </main>

  <footer class="site-footer"><div class="container" data-i18n="footer"></div></footer>
  <div class="overlay-busy" id="busy" hidden><div><div class="spinner"></div><span id="busy-text"></span></div></div>

  <script src="/vendor/fabric-5.3.0.min.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/fabric-ext.js"></script>
  <script src="/js/nesting.js"></script>
  <script src="/js/gangsheet.js"></script>
</body>
</html>
