  <style>
    /* ---------- Invoice (screen) ---------- */
    .inv-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; padding: 24px 0 16px; }
    .inv-actions .btn svg { flex: none; }
    .invoice { padding: 40px 44px; color: var(--ink); font-size: 14px; line-height: 1.55; }
    .invoice h1, .invoice h2 { letter-spacing: -.01em; }
    .inv-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; padding-bottom: 24px; border-bottom: 2px solid var(--ink); }
    .inv-brand { display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 800; margin-bottom: 8px; }
    .inv-brand .inv-logo { display: block; height: 52px; width: auto; }
    .inv-contact { list-style: none; margin: 0; padding: 0; color: var(--ink-2); font-size: 13px; }
    .inv-contact li { overflow-wrap: anywhere; }
    .inv-contact span { color: var(--ink-3); }
    .inv-title { text-align: end; min-width: 0; }
    .inv-title h1 { font-size: 30px; font-weight: 800; text-transform: uppercase; margin-bottom: 10px; }
    .inv-meta { display: grid; grid-template-columns: auto auto; gap: 2px 16px; margin: 0; font-size: 13px; justify-content: end; }
    .inv-meta dt { color: var(--ink-3); text-align: start; }
    .inv-meta dd { margin: 0; font-weight: 600; text-align: end; }
    .inv-parties { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; padding: 24px 0; }
    .inv-parties h2 { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); margin-bottom: 6px; }
    html[lang="ar"] .inv-parties h2 { letter-spacing: 0; font-size: 13px; }
    .inv-parties p { margin: 0; overflow-wrap: anywhere; }
    .inv-parties .who { font-weight: 700; font-size: 15px; }
    .inv-pay-status { display: inline-block; margin-top: 4px; padding: 1px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid currentColor; }
    .inv-pay-status.paid { color: var(--ok); }
    .inv-pay-status.pending { color: var(--warn); }
    .inv-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .inv-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    .inv-table th { font-size: 12px; font-weight: 700; color: var(--ink-2); text-align: start; padding: 9px 10px; background: #f1f3f6; border-bottom: 1px solid var(--line); white-space: nowrap; }
    .inv-table td { padding: 11px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
    .inv-table .n { width: 1%; color: var(--ink-3); }
    .inv-table .num { text-align: end; white-space: nowrap; }
    .inv-table .prod { font-weight: 600; }
    .inv-table .desc { color: var(--ink-3); font-size: 12.5px; }
    .inv-table .copies { color: var(--ink-2); font-size: 12.5px; }
    .inv-bottom { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; padding-top: 18px; }
    .inv-note { color: var(--ink-3); font-size: 12.5px; margin: 0; max-width: 320px; }
    .inv-totals { min-width: 280px; margin-inline-start: auto; }
    .inv-totals .line { display: flex; justify-content: space-between; gap: 16px; padding: 4px 0; }
    .inv-totals .line > span:last-child { white-space: nowrap; }
    .inv-totals .total { font-size: 18px; font-weight: 800; border-top: 2px solid var(--ink); margin-top: 6px; padding-top: 10px; }
    .inv-totals .due { color: var(--ink-2); font-size: 13px; }
    .inv-thanks { margin: 32px 0 0; padding-top: 16px; border-top: 1px solid var(--line); text-align: center; font-weight: 600; }
    .inv-foot { margin: 6px 0 0; text-align: center; color: var(--ink-3); font-size: 12px; overflow-wrap: anywhere; }

    @media (max-width: 700px) {
      .invoice { padding: 22px 16px; }
      .inv-head { flex-direction: column; gap: 14px; }
      .inv-title { text-align: start; width: 100%; }
      .inv-title h1 { font-size: 24px; }
      .inv-meta { justify-content: start; }
      .inv-meta dd { text-align: start; }
      .inv-parties { grid-template-columns: 1fr; gap: 16px; }
      .inv-bottom { flex-direction: column-reverse; }
      .inv-totals { min-width: 0; width: 100%; }
    }
    /* Phones: # · item · amount (the copies line under the item carries the unit price). */
    @media screen and (max-width: 560px) {
      .inv-table .opt { display: none; }
      .inv-table th, .inv-table td { padding-inline: 6px; }
    }

    /* ---------- Invoice (print): only the invoice, black on white, A4 ---------- */
    @page { size: A4; margin: 14mm; }
    @media print {
      html, body { background: #fff !important; }
      body { display: block; min-height: 0; }
      .site-header, .site-footer, .inv-actions, #toast-root { display: none !important; }
      main.container { max-width: none !important; padding: 0; margin: 0; }
      .invoice, .invoice * { color: #000 !important; }
      .invoice { border: 0; box-shadow: none; border-radius: 0; padding: 0; font-size: 11pt; }
      .invoice .brand-mark { background: none; border: 1.5px solid #000; }
      .inv-head { flex-direction: row; border-bottom-color: #000; }
      .inv-title { text-align: end; width: auto; }
      .inv-meta { justify-content: end; }
      .inv-meta dd { text-align: end; }
      .inv-parties { grid-template-columns: 1fr 1fr; }
      .inv-table-wrap { overflow: visible; }
      .inv-table { min-width: 0; font-size: 10.5pt; }
      .inv-table th { background: none; border-bottom: 1.5px solid #000; }
      .inv-table td { border-bottom-color: #bbb; }
      .inv-table thead { display: table-header-group; }
      .inv-table tr, .inv-totals, .inv-parties, .inv-head, .inv-thanks { break-inside: avoid; page-break-inside: avoid; }
      .inv-bottom { flex-direction: row; break-inside: avoid; page-break-inside: avoid; }
      .inv-totals { min-width: 60mm; width: auto; }
      .inv-totals .total { border-top-color: #000; }
      .inv-thanks { border-top-color: #bbb; }
      .inv-pay-status { border-color: #000; }
      a { text-decoration: none; }
    }
