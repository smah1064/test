<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إبداع · ebda3</title>
  <link rel="icon" href="/favicon.svg?v=ebda3" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico?v=ebda3" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=ebda3">
  <link rel="manifest" href="/site.webmanifest?v=ebda3">
  <meta name="theme-color" content="#FAFAF7">
  <script>(function(){var l;try{l=localStorage.getItem('pod-lang')}catch(e){}l=l==='en'?'en':'ar';var d=document.documentElement;d.lang=l;d.dir=l==='ar'?'rtl':'ltr'})()</script>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body data-title-key="home.pageTitle">
  <header class="site-header">
    <div class="container inner">
      <a class="brand" href="/" aria-label="إبداع · ebda3"><img class="brand-logo brand-ar" src="/img/logo-ar-header.svg" alt="إبداع" width="61" height="40"><img class="brand-logo brand-en" src="/img/logo-en-header.svg" alt="ebda3" width="98" height="40"><img class="brand-logo brand-mark-logo" src="/img/logo-mark-header.svg" alt="ebda3" width="35" height="40"></a>
      <nav>
        <a href="/#products" data-i18n="nav.products"></a>
        <a href="/designs"><span class="nav-long" data-i18n="nav.designs"></span><span class="nav-short" data-i18n="nav.designsShort"></span></a>
        <a href="/photos"><span class="nav-long" data-i18n="nav.photos"></span><span class="nav-short" data-i18n="nav.photosShort"></span></a>
        <a class="nav-books" href="/?cat=kids#products"><span class="nav-long" data-i18n="nav.books"></span><span class="nav-short" data-i18n="nav.booksShort"></span></a>
        <a class="cart-link" href="/cart"><span data-i18n="nav.cart"></span> <span class="badge" data-cart-count hidden>0</span></a>
        <button class="btn btn-sm lang-toggle" data-lang-toggle data-i18n="lang.other"></button>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <div>
        <h1 data-i18n-html="home.title"></h1>
        <p data-i18n="home.lead"></p>
        <p class="delivery-note" data-i18n="delivery.note"></p>
        <div class="row" style="max-width: 380px; margin-top: 24px;">
          <a class="btn btn-primary btn-lg" href="/editor?product=tshirt" data-i18n="home.start"></a>
          <a class="btn btn-lg" href="#products" data-i18n="home.browse"></a>
        </div>
      </div>
      <div class="hero-art" id="hero-art" aria-hidden="true"></div>
    </section>

    <section class="steps">
      <div class="card step"><div class="num">1</div><h3 data-i18n="home.step1.title"></h3><p data-i18n="home.step1.text"></p></div>
      <div class="card step"><div class="num">2</div><h3 data-i18n="home.step2.title"></h3><p data-i18n="home.step2.text"></p></div>
      <div class="card step"><div class="num">3</div><h3 data-i18n="home.step3.title"></h3><p data-i18n="home.step3.text"></p></div>
    </section>

    <a class="card promo" href="/designs" style="text-decoration:none">
      <div class="promo-art" aria-hidden="true">👕</div>
      <div><h2 data-i18n="home.designsTitle"></h2><p data-i18n="home.designsText"></p></div>
      <span class="btn btn-primary" data-i18n="home.designsCta"></span>
    </a>

    <a class="card promo promo-photos" href="/photos" style="text-decoration:none">
      <div class="promo-art" aria-hidden="true">📸</div>
      <div><h2 data-i18n="home.photosTitle"></h2><p data-i18n="home.photosText"></p></div>
      <span class="btn btn-primary" data-i18n="home.photosCta"></span>
    </a>

    <section class="card biz" id="business" aria-labelledby="biz-title">
      <div class="biz-head">
        <div class="promo-art" aria-hidden="true">🏢</div>
        <div><h2 id="biz-title" data-i18n="home.bizTitle"></h2><p data-i18n="home.bizLead"></p></div>
      </div>
      <div class="cat-chips biz-links" id="biz-links"></div>
      <ul class="biz-points">
        <li data-i18n="home.bizNames"></li>
        <li data-i18n="home.bizMany"></li>
      </ul>
      <a class="btn btn-sm biz-more" href="/designs?cat=business" data-i18n="home.bizDesigns"></a>
    </section>

    <section id="products">
      <div class="section-title">
        <h2 data-i18n="home.pick"></h2>
        <span class="muted small hide-sm" data-i18n="home.priceNote"></span>
      </div>
      <form class="design-search home-search" id="home-search" role="search" autocomplete="off">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="home-q" enterkeyhint="search" maxlength="60" data-i18n-placeholder="home.search" data-i18n-aria="home.searchLabel">
      </form>
      <div class="cat-chips" id="cats"></div>
      <p class="muted small home-count" id="home-count" aria-live="polite"></p>
      <div class="product-grid" id="product-grid"></div>
    </section>
  </main>

  <footer class="site-footer"><div class="container" data-i18n="footer"></div></footer>

  <script src="/js/i18n.js"></script>
  <script src="/js/common.js"></script>
  <script>
    (async () => {
      const { t, tr, esc, money } = POD;
      const grid = document.getElementById('product-grid');
      // ?cat=kids (the "Kids' books" menu): the shop opens on that category.
      let cat = new URLSearchParams(location.search).get('cat') || 'all';
      // Search (?q=): product names, descriptions and categories, both languages.
      let q = (new URLSearchParams(location.search).get('q') || '').slice(0, 60);
      let catalog;
      try {
        catalog = await POD.loadCatalog();
      } catch (e) {
        grid.innerHTML = `<p class="muted">${esc(e.message)}</p>`;
        return;
      }
      const { products, categories } = catalog;
      // Words people use for products that their names don't have (typed both ways).
      const ALIASES = {
        tshirt: 'tee t-shirt tshirt shirt تي شيرت تيشرت تشيرت', kidstee: 'tee t-shirt kids اطفال تيشرت', polo: 'tee shirt تيشرت', oversized: 'tee shirt تيشرت', jersey: 'football soccer shirt تيشرت فانلة',
        hoodie: 'hoody sweater هودى', ziphoodie: 'hoody zip jacket هودى جاكيت', kidshoodie: 'hoody هودى اطفال', sweatshirt: 'sweater سويت شيرت بلوفر',
        cap: 'hat قبعة طاقية', mug: 'cup coffee tea كوب كوباية مق', magicmug: 'cup كوب مق', couplemugs: 'cup كوب مق', tumbler: 'cup travel mug كوب',
        cushion: 'pillow مخدة وسادة', poster: 'frame picture صورة برواز', bottle: 'water flask زجاجة ازازة', tote: 'bag شنطة', phonecase: 'cover iphone samsung كفر',
        notebook: 'كراسة دفتر', mousepad: 'mouse pad', deskmat: 'mouse pad', keychain: 'key ring ميداليه', stickersheet: 'stickers ستيكر لزق',
        bizcards: 'business cards visit كارت فيزيت', canvas: 'painting wall art لوحة', canvaswide: 'painting wall art لوحة', photoprints: 'photos pictures صور',
        storybook: 'kids book story كتاب قصة اطفال', coloringbook: 'kids book coloring تلوين اطفال', caketopper: 'cake topper تورتة', namepuzzle: 'puzzle بازل',
      };
      const norm = (s) => String(s || '').toLowerCase()
        .replace(/[ً-ٰٟـ]/g, '')
        .replace(/[أإآٱ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/ؤ/g, 'و').replace(/ئ/g, 'ي')
        .replace(/[٠-٩]/g, (c) => String(c.charCodeAt(0) - 0x0660))
        .replace(/[^\p{L}\p{N}]+/gu, ' ')
        .trim();
      // Spelt with or without the long ي (تيشرت / تيشيرت).
      const loose = (s) => s.replace(/ي/g, '').replace(/ +/g, ' ');
      const catName = (id) => (categories.find((c) => c.id === id) || {}).name || {};
      const hay = new Map(products.map((p) => {
        const words = norm([p.id, p.name.en, p.name.ar, p.description && p.description.en, p.description && p.description.ar, catName(p.category).en, catName(p.category).ar, ALIASES[p.id] || ''].join(' '));
        return [p.id, { full: ` ${words} `, loose: ` ${loose(words)} `, name: ` ${norm(`${p.name.en} ${p.name.ar}`)} ` }];
      }));
      const terms = () => norm(q).split(' ').filter(Boolean);
      const found = (p, ts) => ts.every((w) => hay.get(p.id).full.includes(w) || hay.get(p.id).loose.includes(loose(w)));

      // Real product photos, recoloured on the server (small cached WebP);
      // the drawn mockup is the fallback if a picture can't load.
      const thumbUrl = (p, color) => (p.kind === 'book' ? `/api/books/${encodeURIComponent(p.book)}/sample/0.jpg?lang=${POD.lang}` : `/api/thumbs/${encodeURIComponent(p.id)}/${encodeURIComponent(color.id)}.webp`);
      document.addEventListener('error', (e) => {
        const img = e.target;
        if (!(img instanceof HTMLImageElement) || !img.dataset.pid || img.dataset.fallback) return;
        const p = products.find((x) => x.id === img.dataset.pid);
        const c = p && p.colors.find((x) => x.id === img.dataset.color);
        if (!c) return;
        img.dataset.fallback = '1';
        img.src = POD.mockupUrl(p.sides[0], c.hex, 'full');
      }, true);
      // Designs the shopper saved in the editor: shown on their product card.
      const drafts = {};
      for (const d of await POD.drafts.all()) {
        if (d && d.productId) drafts[d.productId] = { ...d, url: d.preview instanceof Blob ? URL.createObjectURL(d.preview) : null };
      }
      const savedParam = new URLSearchParams(location.search).get('saved');
      if (savedParam) {
        POD.toast(t('draft.saved'));
        history.replaceState(null, '', '/#products');
      }
      function cardThumb(p) {
        const d = drafts[p.id];
        if (!d || !d.url) return thumbImg(p, p.colors[0]);
        return `<img alt="" src="${d.url}"><span class="saved-badge">${esc(t('draft.badge'))}</span>`;
      }
      function thumbImg(p, color, eager) {
        return `<img alt="" ${eager ? '' : 'loading="lazy" '}decoding="async" class="photo-thumb" data-pid="${esc(p.id)}" data-color="${esc(color.id)}" src="${thumbUrl(p, color)}">`;
      }

      // For companies, schools and events: straight to the products they order.
      const BIZ = ['bizcards', 'idcards', 'certificates', 'invitations', 'namelabels', 'stickersheet', 'letterhead', 'paperbags', 'rollup'];
      function renderBiz() {
        document.getElementById('biz-links').innerHTML = BIZ.map((id) => products.find((p) => p.id === id)).filter(Boolean)
          .map((p) => `<a class="chip" href="/product?id=${encodeURIComponent(p.id)}">${esc(tr(p.name))}</a>`).join('');
      }

      function render() {
        renderBiz();
        document.getElementById('cats').innerHTML = [{ id: 'all', name: null }, ...categories]
          .map((c) => `<button class="chip ${c.id === cat ? 'active' : ''}" data-cat="${c.id}">${esc(c.name ? tr(c.name) : t('cat.all'))}</button>`)
          .join('');
        const ts = terms();
        let list = products.filter((p) => (cat === 'all' || p.category === cat) && (!ts.length || found(p, ts)));
        // Products whose name matches come first.
        // Names that match as typed first, then names spelt another way, then the rest (description, category).
        const rank = (p) => { const h = hay.get(p.id); return ts.every((w) => h.name.includes(w)) ? 0 : ts.every((w) => loose(h.name).includes(` ${loose(w)}`)) ? 1 : 2; };
        if (ts.length) list = list.map((p, i) => [rank(p), i, p]).sort((x, y) => x[0] - y[0] || x[1] - y[1]).map((x) => x[2]);
        document.getElementById('home-count').textContent = ts.length && list.length ? t('home.found', { n: POD.num(list.length), q: q.trim() }) : '';
        if (!list.length) {
          const qq = q.trim();
          grid.innerHTML = `<div class="card empty home-empty">
            <h3>${esc(qq ? t('home.noMatch', { q: qq }) : t('home.noMatchCat'))}</h3>
            <p class="muted">${esc(t('home.noMatchHint'))}</p>
            <div class="design-empty-actions">
              ${qq ? `<button type="button" class="btn btn-primary" data-clear-q>${esc(t('designs.clearSearch'))}</button>` : ''}
              ${cat !== 'all' ? `<button type="button" class="btn" data-all-cats>${esc(t('designs.allCats'))}</button>` : ''}
              ${qq ? `<a class="btn" href="/designs?q=${encodeURIComponent(qq)}">${esc(t('home.searchDesigns', { q: qq }))}</a>` : ''}
            </div>
          </div>`;
          return;
        }
        grid.innerHTML = list.map((p) => `
          <a class="card product-card" href="${p.kind === 'book' ? `/book?b=${encodeURIComponent(p.book)}` : p.kind === 'photoset' ? '/photos' : `/product?id=${p.id}`}">
            <div class="thumb">${cardThumb(p)}</div>
            <div class="body">
              <h3>${esc(tr(p.name))}</h3>
              <p class="desc">${esc(tr(p.description))}</p>
              <div class="foot">
                <span class="price">${esc(t('home.from', { price: money(p.basePrice) }))}</span>
                <span class="dots">${p.colors.slice(0, 6).map((c) => `<span class="dot" title="${esc(tr(c.name))}" style="background:${c.hex}"></span>`).join('')}</span>
              </div>
            </div>
          </a>`).join('');
      }
      document.getElementById('cats').addEventListener('click', (e) => {
        const b = e.target.closest('[data-cat]');
        if (!b) return;
        cat = b.dataset.cat;
        saveUrl();
        render();
      });
      // ---------- Search ----------
      const qInput = document.getElementById('home-q');
      qInput.value = q;
      function saveUrl() {
        const u = new URL(location.href);
        if (q.trim()) u.searchParams.set('q', q.trim()); else u.searchParams.delete('q');
        if (cat !== 'all') u.searchParams.set('cat', cat); else u.searchParams.delete('cat');
        history.replaceState(history.state, '', u.pathname + u.search + u.hash);
      }
      let typing = null;
      qInput.addEventListener('input', () => {
        clearTimeout(typing);
        typing = setTimeout(() => {
          q = qInput.value.slice(0, 60);
          if (q.trim()) cat = 'all'; // a search looks in every category
          saveUrl();
          render();
        }, 200);
      });
      document.getElementById('home-search').addEventListener('submit', (e) => {
        e.preventDefault();
        clearTimeout(typing);
        q = qInput.value.slice(0, 60);
        if (q.trim()) cat = 'all';
        saveUrl();
        render();
        qInput.blur(); // closes the phone keyboard so the results show
      });
      grid.addEventListener('click', (e) => {
        if (e.target.closest('[data-clear-q]')) {
          q = '';
          qInput.value = '';
          saveUrl();
          render();
          qInput.focus();
        } else if (e.target.closest('[data-all-cats]')) {
          cat = 'all';
          saveUrl();
          render();
        }
      });
      // Coming back to the page: the browser may refill the box; the address is what counts.
      window.addEventListener('pageshow', () => { qInput.value = q; });

      const pick = (id, colorId) => {
        const p = products.find((x) => x.id === id);
        const c = p.colors.find((x) => x.id === colorId) || p.colors[0];
        return thumbImg(p, c, true);
      };
      const hero = document.getElementById('hero-art');
      hero.innerHTML = [pick('tshirt', 'navy'), pick('hoodie', 'cream'), pick('mug', 'white')].join('');

      render();
      document.addEventListener('pod:langchange', render);
    })();
  </script>
</body>
</html>
