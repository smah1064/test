<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OneOff Print</title>
  <script>(function(){var l;try{l=localStorage.getItem('pod-lang')}catch(e){}l=l==='en'?'en':'ar';var d=document.documentElement;d.lang=l;d.dir=l==='ar'?'rtl':'ltr'})()</script>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body data-title-key="home.pageTitle">
  <header class="site-header">
    <div class="container inner">
      <a class="brand" href="/"><span class="brand-mark">1</span>OneOff Print</a>
      <nav>
        <a href="/#products" data-i18n="nav.products"></a>
        <a href="/gangsheet" data-i18n="nav.gang"></a>
        <a class="cart-link" href="/cart"><span data-i18n="nav.cart"></span> <span class="badge" data-cart-count hidden>0</span></a>
        <button class="btn btn-sm lang-toggle" data-lang-toggle data-i18n="lang.other"></button>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <div>
        <h1 data-i18n-html="home.title"></h1>
        <p data-i18n="home.lead"></p>
        <div class="row" style="max-width: 380px; margin-top: 24px;">
          <a class="btn btn-primary btn-lg" href="/editor?product=tshirt" data-i18n="home.start"></a>
          <a class="btn btn-lg" href="#products" data-i18n="home.browse"></a>
        </div>
      </div>
      <div class="hero-art" id="hero-art" aria-hidden="true"></div>
    </section>

    <section class="steps">
      <div class="card step"><div class="num">1</div><h3 data-i18n="home.step1.title"></h3><p data-i18n="home.step1.text"></p></div>
      <div class="card step"><div class="num">2</div><h3 data-i18n="home.step2.title"></h3><p data-i18n="home.step2.text"></p></div>
      <div class="card step"><div class="num">3</div><h3 data-i18n="home.step3.title"></h3><p data-i18n="home.step3.text"></p></div>
    </section>

    <a class="card promo" href="/gangsheet" style="text-decoration:none">
      <div class="promo-film" aria-hidden="true">🎞️</div>
      <div><h2 data-i18n="gang.promoTitle"></h2><p data-i18n="gang.promoText"></p></div>
      <span class="btn btn-primary" data-i18n="gang.promoCta"></span>
    </a>

    <section id="products">
      <div class="section-title">
        <h2 data-i18n="home.pick"></h2>
        <span class="muted small hide-sm" data-i18n="home.priceNote"></span>
      </div>
      <div class="cat-chips" id="cats"></div>
      <div class="product-grid" id="product-grid"></div>
    </section>
  </main>

  <footer class="site-footer"><div class="container" data-i18n="footer"></div></footer>

  <script src="/js/i18n.js"></script>
  <script src="/js/common.js"></script>
  <script>
    (async () => {
      const { t, tr, esc, money } = POD;
      const grid = document.getElementById('product-grid');
      let cat = 'all';
      let catalog;
      try {
        catalog = await POD.loadCatalog();
      } catch (e) {
        grid.innerHTML = `<p class="muted">${esc(e.message)}</p>`;
        return;
      }
      const { products, categories } = catalog;

      function render() {
        document.getElementById('cats').innerHTML = [{ id: 'all', name: null }, ...categories]
          .map((c) => `<button class="chip ${c.id === cat ? 'active' : ''}" data-cat="${c.id}">${esc(c.name ? tr(c.name) : t('cat.all'))}</button>`)
          .join('');
        grid.innerHTML = products.filter((p) => cat === 'all' || p.category === cat).map((p) => `
          <a class="card product-card" href="/editor?product=${p.id}">
            <div class="thumb"><img alt="" loading="lazy" src="${POD.mockupUrl(p.sides[0], p.colors[0].hex, 'full')}"></div>
            <div class="body">
              <h3>${esc(tr(p.name))}</h3>
              <p class="desc">${esc(tr(p.description))}</p>
              <div class="foot">
                <span class="price">${esc(t('home.from', { price: money(p.basePrice) }))}</span>
                <span class="dots">${p.colors.slice(0, 6).map((c) => `<span class="dot" title="${esc(tr(c.name))}" style="background:${c.hex}"></span>`).join('')}</span>
              </div>
            </div>
          </a>`).join('');
      }
      document.getElementById('cats').addEventListener('click', (e) => {
        const b = e.target.closest('[data-cat]');
        if (!b) return;
        cat = b.dataset.cat;
        render();
      });

      const pick = (id, colorId) => {
        const p = products.find((x) => x.id === id);
        const c = p.colors.find((x) => x.id === colorId) || p.colors[0];
        return POD.mockupUrl(p.sides[0], c.hex, 'full');
      };
      document.getElementById('hero-art').innerHTML = [pick('tshirt', 'navy'), pick('hoodie', 'cream'), pick('mug', 'white')]
        .map((src) => `<img alt="" src="${src}">`).join('');

      render();
      document.addEventListener('pod:langchange', render);
    })();
  </script>
</body>
</html>
