  <script>
    (async () => {
      const { t, tr, esc, money } = POD;
      const grid = document.getElementById('product-grid');
      // ?cat=kids (the "Kids' books" menu): the shop opens on that category.
      let cat = new URLSearchParams(location.search).get('cat') || 'all';
      // Search (?q=): product names, descriptions and categories, both languages.
      let q = (new URLSearchParams(location.search).get('q') || '').slice(0, 60);
      // The "how it works" step numbers in the page's digits (also while the products can't load).
      const stepNums = () => document.querySelectorAll('.hm-num').forEach((el, i) => { el.textContent = POD.num(i + 1); });
      stepNums();
      document.addEventListener('pod:langchange', stepNums);

      // ---------- No connection ----------
      // What the page needs didn't come (no signal, or the site busy): "No connection" and "Try again" in `box`, in the
      // page's language, until it does. A "not found" from the site is not a connection problem: thrown as it is.
      const noConnection = (e) => !(e && e.status) || e.status >= 500;
      async function loadOrRetry(box, load) {
        let last = null;
        for (;;) {
          try {
            const out = await load();
            box.hidden = true;
            box.innerHTML = '';
            return out;
          } catch (e) {
            if (!noConnection(e)) throw e;
            // The same failure again although the site answers now (a product list kept from before): the page again.
            if (e === last) {
              location.reload();
              return new Promise(() => {});
            }
            await tryAgain(box, Boolean(last));
            last = e;
          }
        }
      }
      /** "No connection" with "Try again" in `box`; resolves once it is tapped and the site answers. */
      function tryAgain(box, focus) {
        return new Promise((resolve) => {
          const paint = () => {
            box.innerHTML = `<h2>${esc(t('net.title'))}</h2><p class="muted">${esc(t('net.text'))}</p><button type="button" class="btn btn-primary" data-net-retry>${esc(t('net.retry'))}</button>`;
          };
          let busy = false;
          const click = async (e) => {
            if (busy || !e.target.closest('[data-net-retry]')) return;
            busy = true;
            const back = await fetch('/api/products', { method: 'HEAD', cache: 'no-store' }).then((r) => r.ok, () => false);
            busy = false;
            if (!back) {
              POD.toast(t('net.still'), 'error');
              return;
            }
            box.removeEventListener('click', click);
            document.removeEventListener('pod:langchange', paint);
            box.innerHTML = '<div class="spinner"></div>';
            resolve();
          };
          paint();
          box.setAttribute('role', 'alert');
          box.hidden = false;
          box.addEventListener('click', click);
          document.addEventListener('pod:langchange', paint);
          if (focus) box.querySelector('[data-net-retry]').focus();
        });
      }

      // (Without the products there is nothing to search: the box comes back with them.)
      const searchForm = document.getElementById('home-search');
      let catalog;
      try {
        catalog = await loadOrRetry(document.getElementById('home-net'), () => POD.loadCatalog().catch((e) => {
          searchForm.hidden = true;
          throw e;
        }));
      } catch (e) {
        grid.innerHTML = `<p class="muted">${esc(e.message)}</p>`;
        return;
      }
      searchForm.hidden = false;
      const { products, categories } = catalog;
      // Words people use for products that their names don't have (typed both ways).
      const ALIASES = {
        tshirt: 'tee t-shirt tshirt shirt تي شيرت تيشرت تشيرت', kidstee: 'tee t-shirt kids اطفال تيشرت', polo: 'tee shirt تيشرت', oversized: 'tee shirt تيشرت', jersey: 'football soccer shirt تيشرت فانلة',
        hoodie: 'hoody sweater هودى', ziphoodie: 'hoody zip jacket هودى جاكيت', kidshoodie: 'hoody هودى اطفال', sweatshirt: 'sweater سويت شيرت بلوفر',
        cap: 'hat قبعة طاقية', mug: 'cup coffee tea كوب كوباية مق', magicmug: 'cup كوب مق', couplemugs: 'cup كوب مق', tumbler: 'cup travel mug كوب',
        cushion: 'pillow مخدة وسادة', poster: 'frame picture صورة برواز', bottle: 'water flask زجاجة ازازة', tote: 'bag شنطة', phonecase: 'cover iphone samsung كفر',
        notebook: 'كراسة دفتر', mousepad: 'mouse pad', deskmat: 'mouse pad', keychain: 'key ring ميداليه', stickersheet: 'stickers ستيكر لزق',
        bizcards: 'business cards visit كارت فيزيت', canvas: 'painting wall art لوحة', canvaswide: 'painting wall art لوحة', photoprints: 'photos pictures صور',
        storybook: 'kids book story كتاب قصة اطفال', coloringbook: 'kids book coloring تلوين اطفال', caketopper: 'cake topper تورتة', namepuzzle: 'puzzle بازل',
        calendar: 'calendar نتيجه نتيجة تقويم نتيجة حيطة', deskcalendar: 'calendar نتيجه نتيجة تقويم مكتب', labels: 'label sticker ليبل استيكر لاصق', banners: 'banner بانر يافطة فليكس لافتة',
        menus: 'menu منيو قايمة طعام مطعم كافيه', brochures: 'brochure flyer بروشور مطوية', booklets: 'catalog catalogue booklet كتالوج كتيب', folders: 'folder فولدر ملف',
        notepads: 'notepad pad بلوك نوت مفكرة', postcards: 'postcard thank you card بوستكارد كارت شكر', giftvouchers: 'voucher gift card كوبون قسيمة جيفت كارد',
        magnets: 'magnet fridge مغناطيس مغنطيس تلاجة ثلاجة', wrappingpaper: 'gift wrap ورق هدايا تغليف', windowstickers: 'window decal vinyl ستيكر فاترينة زجاج',
        photobook: 'album photo book البوم صور', tablenumbers: 'wedding table number ارقام ترابيزات فرح', placecards: 'wedding place name card كروت اسامي فرح معازيم', bookmarks: 'bookmark فاصل كتاب',
      };
      // search-kit:start (the same lines are in public/index.html and public/js/designs.js; test/search-kit.test.js checks both)
      // Forgiving search: what the typed words find, plus plurals (hoodies, تيشيرتات), one word or two (t-shirt, tshirt),
      // both spellings of تيشيرت, and the shop's words for the same thing in either language (mug, مج, كوباية).
      const SEARCH = (() => {
        // Ignore case, Arabic short vowels and tatweel (U+064B-U+065F stops before the Arabic-Indic digits U+0660-U+0669),
        // the alef / yaa / taa marbuta spellings, and Arabic-Indic / Persian digits (100 typed in Arabic digits finds 100).
        const norm = (s) => String(s || '').toLowerCase()
          .replace(/[\u064B-\u065F\u0670\u0640]/g, '')
          .replace(/[أإآٱ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/ؤ/g, 'و').replace(/ئ/g, 'ي')
          .replace(/[٠-٩]/g, (c) => String(c.charCodeAt(0) - 0x0660))
          .replace(/[۰-۹]/g, (c) => String(c.charCodeAt(0) - 0x06F0))
          .replace(/[^\p{L}\p{N}]+/gu, ' ')
          // ("بابا نويل" is Santa, not dad: one word of its own, so a Father's Day search doesn't list Christmas. QA 25 Nov.)
          .replace(/(^| )بابا نويل(?= |$)/g, '$1santa')
          .trim();
        // Spelt with or without the long ي (تيشرت / تيشيرت).
        const loose = (s) => s.replace(/ي/g, '').replace(/ +/g, ' ');
        // The same thing said other ways, in both languages (two words keep their space; plurals are found anyway).
        const SAME = {
          tshirt: 'tshirt, t shirt, tee, tee shirt, shirt, تيشيرت, تي شيرت, تشيرت, قميص, قمصان',
          hoodie: 'hoodie, hoody, هودي',
          sweatshirt: 'sweatshirt, sweat shirt, سويتشيرت, سويت شيرت',
          cap: 'cap, hat, كاب, كاسكيت, قبعة, طاقية',
          mug: 'mug, cup, مج, مجات, مجين, ماج, كوب, كوباية, فنجان, فناجين',
          bag: 'bag, شنطة, شنط, كيس, اكياس',
          card: 'card, كارت, كروت, كارد, بطاقة',
          bizcard: 'business card, visit card, visiting card, بيزنس كارد, بيزنس كارت, بزنس كارد, بزنس كارت, كارت بيزنس, كارت بزنس, كروت بيزنس, كروت بزنس, كارت شخصي, كروت شخصية, كارت فيزيت',
          // (One word alone, as the English "business": everything for a business.)
          business: 'business, بيزنس, بزنس',
          catalog: 'catalog, catalogue, كتالوج, كاتلوج, كاتالوج, كتلوج',
          invitation: 'invitation, invite, دعوة',
          wedding: 'wedding, فرح, أفراح, زفاف',
          poster: 'poster, بوستر',
          notebook: 'notebook, note book, نوت بوك, نوتبوك, كشكول, كشاكيل',
          calendar: 'calendar, نتيجة, تقويم, نتايج',
          sticker: 'sticker, ستيكر, استيكر',
          pillow: 'pillow, cushion, pillowcase, pillow case, cushion cover, كوشن, مخدة, خدادية, وسادة, كيس مخدة',
          // (Not كانفاس or canvas alone: the tote bag and the pencil case are canvas too.)
          canvasprint: 'canvas print, wall canvas, لوحة كانفاس, تابلوه, تابلو',
          photobook: 'photo book, photobook, photo album, فوتو بوك, فوتوبوك, البوم صور',
          idcard: 'id card, id badge, name badge, badge, بادج, كارنيه',
          phonecase: 'phone case, phone cover, mobile case, mobile cover, جراب, جراب موبايل, كفر موبايل',
          christmas: 'christmas, xmas, كريسماس',
          santa: 'santa, santa claus, سانتا, سانتا كلوز',
          // (Arabic as found as English: هدية / هدايا / gift, قهوة / coffee, شاي / tea. QA 25 Nov.)
          gift: 'gift, gifts, present, هدية, هدايا, هديه',
          coffee: 'coffee, قهوة, قهوه, نسكافيه',
          tea: 'tea, شاي, شاى',
          birthday: 'birthday, عيد ميلاد',
          dog: 'dog, puppy, كلب, كلاب',
          cat: 'cat, kitten, قطة, قطط',
          kids: 'kids, kid, children, child, اطفال, طفل, ولاد, اولاد',
          // ("Mother's Day" is searched as "mother day": the 's is left out below.)
          mom: 'mom, mum, mommy, mummy, mama, mother, mother day, mothers day, ماما, الام, امي, عيد الام',
          dad: 'dad, daddy, papa, father, father day, fathers day, بابا, الاب, ابويا, عيد الاب',
          // (Valentine's Day, Teacher's Day, a new baby and the prayer mat (مصلية), in either language. QA 25 Nov.)
          valentine: 'valentine, valentines, valentine day, عيد الحب, عيد حب, فالنتاين, فلانتين',
          teacher: 'teacher, teachers day, teacher day, معلم, المعلم, عيد المعلم, مدرس, يوم المعلم',
          baby: 'baby, newborn, بيبي, نونو, مولود',
          prayermat: 'prayer mat, prayer rug, سجادة صلاة, مصلية, مصلاية',
        };
        const sameAs = new Map();
        for (const [k, list] of Object.entries(SAME)) for (const w of list.split(',')) sameAs.set(norm(w), k);
        /** A word and what else it may be written as: the singular of a plural (hoodies, boxes, puppies, wolves,
            تيشيرتات, مدرسين, ستيكرز) and a word without its taa marbuta (شنطة → شنط finds شنط ورق). */
        function forms(w) {
          const out = [w];
          if (/^[a-z]+$/.test(w) && w.length > 3) {
            if (w.length > 4 && w.endsWith('ies')) out.push(w.slice(0, -3) + 'y');
            if (w.length > 4 && w.endsWith('ves')) out.push(w.slice(0, -3) + 'f', w.slice(0, -3) + 'fe');
            if (/(s|x|z|ch|sh)es$/.test(w)) out.push(w.slice(0, -2));
            if (/[^siu]s$/.test(w)) out.push(w.slice(0, -1));
          } else if (/^[\u0621-\u064A]+$/.test(w)) {
            if (w.endsWith('ات') && w.length >= 5) out.push(w.slice(0, -2), w.slice(0, -2) + 'ه');
            if ((w.endsWith('ين') || w.endsWith('ون')) && w.length >= 6) out.push(w.slice(0, -2));
            if (w.endsWith('ز') && w.length >= 5) out.push(w.slice(0, -1));
            if (w.endsWith('ه') && w.length >= 4) out.push(w.slice(0, -1));
          }
          return [...new Set(out)];
        }
        // The word after "the" / "for the" / "with the" / "and the" in front (التيشيرتات, للأفراح), when 3 letters or more
        // are left; after "the" / "for the", 2 are enough (الأم, للأب); "for" alone before an alef with 3 left (لأمي).
        // A word of 2 is only looked for with its article (للأب: الأب, as the shop's words list it): أب alone is also the
        // "up" of ليفل أب and ستارت أب.
        const article = (w) => { const m = /^(?:وال|بال|لل|ال)([ء-ي]{3,})$|^(?:لل|ال)([ء-ي]{2})$|^ل(ا[ء-ي]{2,})$/.exec(w); return m ? m[1] || m[2] || m[3] : ''; };
        const bare = (w) => { const c = article(w); return !c ? [w] : c.length === 2 ? [w, `ال${c}`] : [w, c]; };
        const allForms = (w) => [...new Set(bare(w).flatMap(forms))];
        const conceptsOf = (w) => [...new Set(allForms(w).map((f) => sameAs.get(f)).filter(Boolean))];
        /** Two words that name one thing: "t shirt", "business cards", "بيزنس كارد". */
        function pairConcepts(a, b) {
          const out = new Set();
          for (const x of allForms(a)) {
            for (const y of forms(b)) {
              for (const k of [`${x} ${y}`, x + y]) if (sameAs.has(k)) out.add(sameAs.get(k));
            }
          }
          return [...out];
        }
        /** A text to search in: its words (as before), the other forms of its words, and the things they name.
            looseAnywhere: a typed word without its ي is looked for anywhere, however short (as the home page always
            did); otherwise at the start of a word and with three letters or more, so تيشرت finds تيشيرت but رسم does
            not find كريسماس (كرسماس) and في does not find every ف. */
        function index(text, looseAnywhere) {
          const ws = norm(text).split(' ').filter(Boolean);
          const extra = new Set();
          const concepts = new Set();
          ws.forEach((w, i) => {
            for (const f of allForms(w)) if (f !== w) extra.add(f);
            for (const c of conceptsOf(w)) concepts.add(c);
            if (i + 1 < ws.length) for (const c of pairConcepts(w, ws[i + 1])) concepts.add(c);
          });
          const all = ` ${ws.join(' ')} ${[...extra].join(' ')} `;
          return { text: all, loose: loose(all), concepts, looseAnywhere: Boolean(looseAnywhere) };
        }
        /** The words of a search: each as typed, its other forms and what it names; two words that name one thing
            ("t shirts", "بيزنس كارد") also count as one. */
        function query(q) {
          // (A lone "s" is the English 's: "mother's day" is "mother day".)
          const ws = norm(q).split(' ').filter((w, i) => w && !(w === 's' && i > 0));
          const one = (w) => ({ word: w, forms: allForms(w).filter((f) => f !== w), concepts: conceptsOf(w) });
          const terms = [];
          for (let i = 0; i < ws.length; i++) {
            const both = i + 1 < ws.length ? pairConcepts(ws[i], ws[i + 1]) : [];
            if (both.length) {
              terms.push({ word: '', forms: forms(ws[i] + ws[i + 1]), concepts: both, or: [one(ws[i]), one(ws[i + 1])] });
              i++;
            } else terms.push(one(ws[i]));
          }
          return terms;
        }
        // A word as typed is found anywhere in a word, as before (with start: at the start of one, to rank names).
        // Its other forms only as whole words ("dogs" → dog, not dogma; "cars" → car, not card), or by what it names.
        // An Arabic word of three letters (most Arabic words are built on three) inside a longer word is another word:
        // it counts at the start of a word only, and without its ي not at all, on both pages (كيس is not the كس of
        // اكسسوارات, ليل not the لل of للأعمال). One or two letters are a word still being typed: found as before.
        // The same rule for a word of two or three letters after its article (الأم, للأب, لأمي): that word after an article
        // (or none, for three letters) at the start of a word; one of the shop's words (الأم, الأب) as a whole word.
        // الأم is not in الامتحانات, للأب not in للأبد, الأب not in الأبعاد, لأمي (without its ي, لام) not in لاما.
        function hasShort(h, word, core, whole) {
          const end = whole || (core.length === 2 && (sameAs.has(core) || sameAs.has(`ال${core}`))) ? ' ' : '';
          const lc = loose(core);
          return ['', 'ال', 'لل', 'بال', 'وال'].some((p) => [word, core].some((w) => (p || w.length > 2) && h.text.includes(` ${p}${w}${end}`))
            || (lc.length > 2 && h.loose.includes(` ${p}${lc}${end}`)));
        }
        // start 'word': the words as whole words only (or another form, or what they name), to rank names: a mug (مج,
        // the same as كوب) before كوبونات, the cap (كاب) before للكابلز, whose words only start with what was typed.
        function has(h, term, start) {
          const whole = start === 'word';
          const core = article(term.word);
          if (core && core.length <= 3) {
            if (hasShort(h, term.word, core, whole)) return true;
            return term.forms.some((f) => h.text.includes(` ${f} `)) || term.concepts.some((c) => h.concepts.has(c));
          }
          const short = term.word.length === 3 && /^[ء-ي]+$/.test(term.word);
          const at = start || short ? ' ' : '';
          const end = whole ? ' ' : '';
          const lw = loose(term.word);
          const looseHit = h.looseAnywhere && !short && !whole ? h.loose.includes(at + lw) : lw.length > 2 && h.loose.includes(` ${lw}${end}`);
          if (term.word && (h.text.includes(at + term.word + end) || looseHit)) return true;
          if (term.forms.some((f) => h.text.includes(` ${f} `) || h.loose.includes(` ${loose(f)} `))) return true;
          return term.concepts.some((c) => h.concepts.has(c)) || Boolean(term.or && term.or.every((x) => has(h, x, start)));
        }
        /** Every word of the search is in the indexed text. */
        const match = (h, terms, start) => terms.every((term) => has(h, term, start));
        return { norm, loose, forms, index, query, match };
      })();
      // search-kit:end
      const { norm, loose } = SEARCH;
      const catName = (id) => (categories.find((c) => c.id === id) || {}).name || {};
      // A product's sizes and quantities, by id and in both languages: "tshirt xl", "A5 flyers", "كروت شخصية 100", "مج 11oz".
      // (Not "One size" / "مقاس واحد": "size", "one" or "واحد" alone would list every bag and cap.)
      const sizeWords = (p) => (p.sizes || []).filter((z) => z.id !== 'one').flatMap((z) => [z.id, z.label && z.label.en, z.label && z.label.ar]).filter(Boolean).join(' ');
      const hay = new Map(products.map((p) => {
        const name = `${p.name.en} ${p.name.ar}`;
        const text = [p.id, name, p.description && p.description.en, p.description && p.description.ar, catName(p.category).en, catName(p.category).ar, ALIASES[p.id] || ALIASES[POD.assetId(p)] || '', sizeWords(p)].join(' ');
        // (true: everything the shop's search found before is still found.)
        return [p.id, { all: SEARCH.index(text, true), name: ` ${norm(name)} `, named: SEARCH.index(name, true), sized: SEARCH.index(sizeWords(p), true) }];
      }));
      // The search, on product text only: markup typed into the box ("<b>") is not a word.
      const typed = () => q.replace(/<[^<>]*>/g, ' ');
      // Its words as typed (names with them come first), and with their other forms (what finds the products).
      const terms = () => norm(typed()).split(' ').filter(Boolean);
      const found = (p, qs) => SEARCH.match(hay.get(p.id).all, qs);

      // Real product photos, recoloured on the server (small cached WebP);
      // the drawn mockup is the fallback if a picture can't load.
      // A photo the product manager uploaded comes first (POD.productPicture).
      const thumbUrl = (p, color) => POD.productPicture(p, color);
      document.addEventListener('error', (e) => {
        const img = e.target;
        if (!(img instanceof HTMLImageElement) || !img.dataset.pid || img.dataset.fallback) return;
        const p = products.find((x) => x.id === img.dataset.pid);
        const c = p && p.colors.find((x) => x.id === img.dataset.color);
        if (!c) return;
        img.dataset.fallback = '1';
        img.src = POD.thumbFallback(p, c);
      }, true);
      // Designs the shopper saved in the editor: shown on their product card.
      const drafts = {};
      for (const d of await POD.drafts.all()) {
        if (d && d.productId) drafts[d.productId] = { ...d, url: d.preview instanceof Blob ? URL.createObjectURL(d.preview) : null };
      }
      const savedParam = new URLSearchParams(location.search).get('saved');
      if (savedParam) {
        POD.toast(t('draft.saved'));
        history.replaceState(null, '', '/#products');
      }
      function thumbImg(p, color, eager) {
        return `<img alt="" ${eager ? '' : 'loading="lazy" '}decoding="async" class="photo-thumb" data-pid="${esc(p.id)}" data-color="${esc(color.id)}" src="${thumbUrl(p, color)}">`;
      }

      // ---------- Lifestyle photos (each product printed with a design, styled) ----------
      // public/img/lifestyle/index.json: { productId: { file, alt } }; products without one keep their studio photo.
      let life = {};
      // public/img/designed/index.json: each product printed with a ready design, on light grey (scripts/render-designed.js).
      let designed = {};
      const loadJson = async (url) => {
        try {
          const r = await fetch(url, { cache: 'no-cache' });
          return r.ok ? await r.json() : {};
        } catch (e) {
          return {};
        }
      };
      [life, designed] = await Promise.all([loadJson('/img/lifestyle/index.json'), loadJson('/img/designed/index.json')]);
      const byId = (id) => products.find((p) => p.id === id);
      // Pictures kept per product id (lifestyle, designed): products made from another one use that one's.
      const lifeOf = (p) => life[POD.assetId(p)];
      const designedOf = (p) => designed[POD.assetId(p)];
      const hrefOf = (p) => (p.kind === 'book' ? `/book?b=${encodeURIComponent(p.book)}` : p.kind === 'photoset' ? '/photos' : `/product?id=${encodeURIComponent(p.id)}`);
      /** The card picture: a saved draft, else the manager's photo, else the lifestyle photo, else the product photo. */
      function cardPicture(p, eager) {
        const d = drafts[p.id];
        if (d && d.url) return `<img alt="" src="${d.url}"><span class="saved-badge">${esc(t('draft.badge'))}</span>`;
        if (p.mainPhoto) return thumbImg(p, POD.firstPick(p.colors), eager);
        const l = lifeOf(p);
        if (l && l.file) return `<img class="hm-life" alt="${esc(tr(l.alt) || tr(p.name))}" ${eager ? '' : 'loading="lazy" '}decoding="async" src="${esc(l.file)}">`;
        const g = designedOf(p);
        if (g && g.file) return `<img class="hm-designed" alt="${esc(tr(p.name))}" ${eager ? '' : 'loading="lazy" '}decoding="async" src="${esc(g.file)}">`;
        return thumbImg(p, POD.firstPick(p.colors), eager);
      }
      /** "From 250 EGP" and, for products sold in quantities, the smallest pack ("A5 × 100"). */
      // (Arabic pages show the label in Arabic digits, ٠-٩: they count as digits too.)
      function priceLine(p) {
        const first = p.sizes && p.sizes[0];
        const label = first ? tr(first.label) : '';
        const pack = label && /[\d٠-٩۰-۹]/.test(label) && !['apparel'].includes(p.category) && /×|x\b|[\d٠-٩۰-۹]{2,}/i.test(label) ? label : '';
        return `<span class="hm-price">${esc(t('home.from', { price: money(POD.fromPrice(p)) }))}</span>${pack ? `<span class="hm-pack" dir="auto">${esc(pack)}</span>` : ''}`;
      }

      // ---------- Rows: new and best sellers, then by theme ----------
      // Ids that don't exist (yet) are skipped, so a row only shows what the shop sells.
      const BEST = ['tshirt', 'mug', 'bizcards', 'stickersheet', 'hoodie', 'cushion', 'invitations', 'tote'];
      const NEW = ['menus', 'calendar', 'labels', 'postcards', 'photobook', 'magnets', 'wrappingpaper', 'brochures', 'engrplaque', 'caketopper'];
      const ROWS = [
        { key: 'fresh', ids: [...NEW.slice(0, 4), ...BEST.slice(0, 6)], badge: (id) => (NEW.includes(id) || (byId(id) || {}).base ? 'new' : 'best') },
        { key: 'cards', ids: ['invitations', 'greetingcard', 'postcards', 'foldedcards', 'giftvouchers', 'bookmarks', 'eidenvelopes', 'certificates'], link: '/?cat=occasions#products' },
        { key: 'wear', ids: ['tshirt', 'hoodie', 'sweatshirt', 'oversized', 'polo', 'kidstee', 'cap', 'tote', 'apron'], link: '/?cat=apparel#products' },
        { key: 'home', ids: ['mug', 'cushion', 'poster', 'canvas', 'coasters', 'calendar', 'deskcalendar', 'bedsheet', 'curtains', 'magnets'], link: '/?cat=home#products' },
        { key: 'gifts', ids: ['magicmug', 'couplemugs', 'photobook', 'engrframe', 'keychain', 'namepuzzle', 'tumbler', 'prayermat', 'wrappingpaper'], link: '/?cat=occasions#products' },
        { key: 'biz', ids: ['bizcards', 'flyers', 'brochures', 'menus', 'labels', 'letterhead', 'logostickers', 'paperbags', 'booklets', 'rollup', 'banners', 'windowstickers', 'idcards', 'notepads', 'folders', 'giftvouchers'], link: '/?cat=business#products' },
        { key: 'events', ids: ['weddingsign', 'tablenumbers', 'placecards', 'caketopper', 'ramadandecor', 'invitations', 'eidenvelopes', 'tablecloth'], link: '/?cat=occasions#products' },
        { key: 'laser', ids: products.filter((p) => p.category === 'laser').map((p) => p.id), link: '/?cat=laser#products' },
      ];
      // Products the manager made from another one show in that one's rows, right after it.
      for (const row of ROWS) row.ids = row.ids.flatMap((id) => [id, ...products.filter((p) => p.base === id).map((p) => p.id)]);
      /** All products: the lifestyle photo (the product printed and styled), as in the rows above. */
      function gridPicture(p) {
        const d = drafts[p.id];
        if (d && d.url) return `<img alt="" src="${d.url}"><span class="saved-badge">${esc(t('draft.badge'))}</span>`;
        if (p.mainPhoto) return thumbImg(p, POD.firstPick(p.colors));
        const l = lifeOf(p);
        if (l && l.file) return `<img class="hm-life" alt="${esc(tr(l.alt) || tr(p.name))}" loading="lazy" decoding="async" src="${esc(l.file)}">`;
        const g = designedOf(p);
        if (g && g.file) return `<img class="hm-designed" alt="${esc(tr(p.name))}" loading="lazy" decoding="async" src="${esc(g.file)}">`;
        return thumbImg(p, POD.firstPick(p.colors));
      }
      const editorHref = (p) => (p.kind === 'book' ? `/book?b=${encodeURIComponent(p.book)}` : p.kind === 'photoset' ? '/photos' : `/editor?product=${encodeURIComponent(p.id)}`);
      function rowCard(p, badge) {
        return `<a class="hm-card" href="${hrefOf(p)}">
          <div class="hm-pic">${cardPicture(p)}${badge ? `<span class="hm-badge hm-badge-${badge}">${esc(t('hm.badge.' + badge))}</span>` : ''}</div>
          <h3>${esc(tr(p.name))}</h3>
          <div class="hm-meta">${priceLine(p)}</div>
        </a>`;
      }
      function renderRows() {
        document.getElementById('hm-rows').innerHTML = ROWS.map((row) => {
          const list = [...new Set(row.ids)].map(byId).filter(Boolean);
          if (list.length < 3) return '';
          return `<section class="hm-section" aria-labelledby="hm-row-${row.key}">
            <div class="hm-head">
              <div><h2 id="hm-row-${row.key}">${esc(t(`hm.row.${row.key}`))}</h2><p class="muted">${esc(t(`hm.row.${row.key}.sub`))}</p></div>
              <div class="hm-head-end">
                ${row.link ? `<a class="hm-more" href="${row.link}">${esc(t('hm.seeAll'))}</a>` : ''}
                <button type="button" class="hm-arrow" data-scroll="-1" aria-label="${esc(t('hm.prev'))}">‹</button><button type="button" class="hm-arrow" data-scroll="1" aria-label="${esc(t('hm.next'))}">›</button>
              </div>
            </div>
            <div class="hm-row">${list.map((p) => rowCard(p, row.badge ? row.badge(p.id) : null)).join('')}</div>
          </section>`;
        }).join('');
      }
      // Arrows: one screenful along the row (in reading direction).
      document.getElementById('hm-rows').addEventListener('click', (e) => {
        const b = e.target.closest('[data-scroll]');
        if (!b) return;
        const row = b.closest('.hm-section').querySelector('.hm-row');
        const dir = getComputedStyle(row).direction === 'rtl' ? -1 : 1;
        row.scrollBy({ left: Number(b.dataset.scroll) * dir * row.clientWidth * 0.9, behavior: 'smooth' });
      });

      // ---------- Three picture tiles ----------
      function renderTiles() {
        // The shop's own pictures (hero-2, hero-3) first; else a product the shop sells now (hidden ones are not in the list).
        const pic = (key, ids, cat) => {
          const l = life[key];
          if (l && l.file) return `<img alt="" loading="lazy" decoding="async" src="${esc(l.file)}">`;
          const p = ids.map(byId).find(Boolean) || products.find((x) => x.category === cat && !x.kind);
          if (!p) return '';
          const pl = !p.mainPhoto && lifeOf(p);
          return pl && pl.file ? `<img alt="" loading="lazy" decoding="async" src="${esc(pl.file)}">` : thumbImg(p, POD.firstPick(p.colors));
        };
        const has = (c) => products.some((p) => p.category === c);
        const tiles = [
          has('occasions') && { key: 'gifts', img: pic('hero-2', ['mug', 'magicmug', 'couplemugs'], 'occasions'), href: '/?cat=occasions#products' },
          has('business') && { key: 'biz', img: pic('hero-3', ['bizcards', 'flyers'], 'business'), href: '/?cat=business#products' },
          { key: 'designs', img: pic('', ['tshirt', 'hoodie', 'mug', ...products.filter((p) => !p.kind).map((p) => p.id)]), href: '/designs' },
        ].filter(Boolean);
        document.getElementById('hm-tiles').innerHTML = tiles.map((x) => `<a class="hm-tile" href="${x.href}">
          <div class="hm-tile-pic">${x.img}</div>
          <div class="hm-tile-body"><h3>${esc(t(`hm.tile.${x.key}`))}</h3><span class="hm-tile-link">${esc(t(`hm.tile.${x.key}.cta`))} <span aria-hidden="true">←</span></span></div>
        </a>`).join('');
      }

      function render() {
        renderRows();
        renderTiles();
        // Only categories with something in them (hidden products are not in the list).
        const used = categories.filter((c) => products.some((p) => p.category === c.id));
        if (cat !== 'all' && !used.some((c) => c.id === cat)) cat = 'all';
        document.getElementById('cats').innerHTML = [{ id: 'all', name: null }, ...used]
          .map((c) => `<button class="chip ${c.id === cat ? 'active' : ''}" data-cat="${c.id}">${esc(c.name ? tr(c.name) : t('cat.all'))}</button>`)
          .join('');
        const ts = terms();
        const qs = SEARCH.query(typed());
        // A search with nothing to look for (only symbols, like "$&") matches nothing, not everything.
        const searching = Boolean(q.trim());
        let list = products.filter((p) => (cat === 'all' || p.category === cat) && (!searching || (ts.length && found(p, qs))));
        // Products whose name matches come first: names with the words as whole words, in another form or language
        // ("hoodies", "مجات", كوب: the mugs), then names with a word that only starts with them (كوبونات after the
        // mugs, للكابلز after the cap; at the start of a word, so "tshirt" puts T-shirts before the Sweatshirt), then
        // names spelt another way, then the rest (description, category). A size typed with the product ("tshirt xl")
        // is not looked for in the name, so the T-shirts still come before the Sweatshirt.
        const rank = (p) => { const h = hay.get(p.id); const tw = ts.filter((w) => ts.length < 2 || !SEARCH.match(h.sized, SEARCH.query(w))); const tq = tw.length === ts.length ? qs : SEARCH.query(tw.join(' ')); return SEARCH.match(h.named, tq, 'word') ? 0 : tw.every((w) => h.name.includes(` ${w}`)) ? 1 : tw.every((w) => loose(h.name).includes(` ${loose(w)}`)) ? 2 : SEARCH.match(h.named, tq, true) ? 3 : 4; };
        if (ts.length) list = list.map((p, i) => [rank(p), i, p]).sort((x, y) => x[0] - y[0] || x[1] - y[1]).map((x) => x[2]);
        document.getElementById('home-count').textContent = searching && list.length ? POD.plural('home.found', list.length, { q: q.trim() }) : '';
        if (!list.length) {
          const qq = q.trim();
          grid.innerHTML = `<div class="card empty home-empty">
            <h3>${esc(qq ? t('home.noMatch', { q: qq }) : t('home.noMatchCat'))}</h3>
            <p class="muted">${esc(t('home.noMatchHint'))}</p>
            <div class="design-empty-actions">
              ${qq ? `<button type="button" class="btn btn-primary" data-clear-q>${esc(t('designs.clearSearch'))}</button>` : ''}
              ${cat !== 'all' ? `<button type="button" class="btn" data-all-cats>${esc(t('designs.allCats'))}</button>` : ''}
              ${qq ? `<a class="btn" href="/designs?q=${encodeURIComponent(qq)}">${esc(t('home.searchDesigns', { q: qq }))}</a>` : ''}
            </div>
          </div>`;
          return;
        }
        // Catalogue cards: the product with a design on, the name, the price, "Start designing" and "Details".
        grid.innerHTML = list.map((p) => `
          <div class="hm-gcard">
            <a class="hm-gpic" href="${hrefOf(p)}" tabindex="-1" aria-hidden="true">${gridPicture(p)}</a>
            <h3><a href="${hrefOf(p)}">${esc(tr(p.name))}</a></h3>
            <div class="hm-meta">${priceLine(p)}</div>
            <a class="btn btn-primary hm-gstart" href="${editorHref(p)}">${esc(t(p.kind ? 'hm.open' : 'home.start'))}</a>
            <a class="btn hm-gdetails" href="${hrefOf(p)}">${esc(t('hm.details'))}</a>
          </div>`).join('');
      }
      document.getElementById('cats').addEventListener('click', (e) => {
        const b = e.target.closest('[data-cat]');
        if (!b) return;
        cat = b.dataset.cat;
        saveUrl();
        render();
      });
      // ---------- Search ----------
      const qInput = document.getElementById('home-q');
      qInput.value = q;
      function saveUrl() {
        const u = new URL(location.href);
        if (q.trim()) u.searchParams.set('q', q.trim()); else u.searchParams.delete('q');
        if (cat !== 'all') u.searchParams.set('cat', cat); else u.searchParams.delete('cat');
        history.replaceState(history.state, '', u.pathname + u.search + u.hash);
      }
      let typing = null;
      qInput.addEventListener('input', () => {
        clearTimeout(typing);
        typing = setTimeout(() => {
          q = qInput.value.slice(0, 60);
          if (q.trim()) cat = 'all'; // a search looks in every category
          saveUrl();
          render();
        }, 200);
      });
      document.getElementById('home-search').addEventListener('submit', (e) => {
        e.preventDefault();
        clearTimeout(typing);
        q = qInput.value.slice(0, 60);
        if (q.trim()) cat = 'all';
        saveUrl();
        render();
        qInput.blur(); // closes the phone keyboard so the results show
      });
      grid.addEventListener('click', (e) => {
        if (e.target.closest('[data-clear-q]')) {
          q = '';
          qInput.value = '';
          saveUrl();
          render();
          qInput.focus();
        } else if (e.target.closest('[data-all-cats]')) {
          cat = 'all';
          saveUrl();
          render();
        }
      });
      // Coming back to the page: the browser may refill the box; the address is what counts.
      window.addEventListener('pageshow', () => { qInput.value = q; });

      // (A product the shop doesn't sell now is left out; another one takes its place.)
      const pick = (id, colorId) => {
        const p = products.find((x) => x.id === id);
        if (!p) return '';
        const c = p.colors.find((x) => x.id === colorId && POD.canPick(x)) || POD.firstPick(p.colors);
        return thumbImg(p, c, true);
      };
      const trio = () => {
        const out = [pick('tshirt', 'navy'), pick('hoodie', 'cream'), pick('mug', 'white')].filter(Boolean);
        for (const p of products) {
          if (out.length >= 3) break;
          if (!p.kind && !['tshirt', 'hoodie', 'mug'].includes(p.id)) out.push(thumbImg(p, POD.firstPick(p.colors), true));
        }
        return out.join('');
      };
      // The hero: the big lifestyle picture of many printed products; until there is one, three product photos.
      const hero = document.getElementById('hero-art');
      hero.innerHTML = life['hero-1'] && life['hero-1'].file
        ? `<img class="hm-hero-photo" alt="" src="${esc(life['hero-1'].file)}" fetchpriority="high">`
        : `<div class="hm-hero-trio">${trio()}</div>`;

      render();
      document.addEventListener('pod:langchange', render);
    })();
  </script>
</body>
</html>
