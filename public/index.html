  <script>
    (async () => {
      const { t, tr, esc, money } = POD;
      const grid = document.getElementById('product-grid');
      // ?cat=kids (the "Kids' books" menu): the shop opens on that category.
      let cat = new URLSearchParams(location.search).get('cat') || 'all';
      // Search (?q=): product names, descriptions and categories, both languages.
      let q = (new URLSearchParams(location.search).get('q') || '').slice(0, 60);
      // "All products" starts with the first 8; "Show all" shows the rest (kept for Back). A search shows everything it
      // finds (owner's OK, UX item D, 26 Nov).
      const FIRST = 8;
      let showAll = Boolean(history.state && typeof history.state === 'object' && history.state.homeAll);
      // The "how it works" step numbers in the page's digits (also while the products can't load).
      const stepNums = () => document.querySelectorAll('.hm-num').forEach((el, i) => { el.textContent = POD.num(i + 1); });
      stepNums();
      document.addEventListener('pod:langchange', stepNums);

      // ---------- Back to the same place ----------
      // Back from a product (or wherever the page led): the same place on the page. The browser can't put it back
      // itself: the rows and "All products" are drawn once the products have come, after it has tried (it kept the FAQ
      // in view while the cards came in above it). So, as the product page does for its ready designs, the place is
      // kept in this history entry when a link is followed: where the page was, and the card (or row) the link is in
      // and its height on the screen, so the place holds even if what is above it is a little taller or shorter by then.
      // The search and the category are in the address. (QA 26 Nov.)
      const back = (history.state && typeof history.state === 'object' && history.state.home) || null;
      document.addEventListener('click', (e) => {
        const a = e.target.closest('a[href]');
        if (!a) return;
        const card = a.closest('[data-place]');
        const home = { y: Math.round(window.scrollY), ...(card ? { place: card.dataset.place, top: Math.round(card.getBoundingClientRect().top) } : {}) };
        try { history.replaceState({ ...(history.state && typeof history.state === 'object' ? history.state : {}), home }, ''); } catch (err) { /* not kept */ }
      });
      /** Once the cards are drawn: back to the card that was followed, at the same height, else to the same scroll. */
      function backToPlace() {
        if (!back || !(back.y > 0)) return;
        if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
        requestAnimationFrame(() => {
          const card = typeof back.place === 'string' && [...document.querySelectorAll('[data-place]')].find((el) => el.dataset.place === back.place);
          const y = card && Number.isFinite(back.top) ? window.scrollY + card.getBoundingClientRect().top - back.top : back.y;
          window.scrollTo(0, Math.max(0, Math.min(Math.round(y), document.documentElement.scrollHeight)));
        });
      }

      // ---------- No connection ----------
      // What the page needs didn't come (no signal, or the site busy): "No connection" and "Try again" in `box`, in the
      // page's language, until it does. A "not found" from the site is not a connection problem: thrown as it is.
      const noConnection = (e) => !(e && e.status) || e.status >= 500;
      async function loadOrRetry(box, load) {
        let last = null;
        for (;;) {
          try {
            const out = await load();
            box.hidden = true;
            box.innerHTML = '';
            return out;
          } catch (e) {
            if (!noConnection(e)) throw e;
            // The same failure again although the site answers now (a product list kept from before): the page again.
            if (e === last) {
              location.reload();
              return new Promise(() => {});
            }
            await tryAgain(box, Boolean(last));
            last = e;
          }
        }
      }
      /** "No connection" with "Try again" in `box`; resolves once it is tapped and the site answers. */
      function tryAgain(box, focus) {
        return new Promise((resolve) => {
          const paint = () => {
            box.innerHTML = `<h2>${esc(t('net.title'))}</h2><p class="muted">${esc(t('net.text'))}</p><button type="button" class="btn btn-primary" data-net-retry>${esc(t('net.retry'))}</button>`;
          };
          let busy = false;
          const click = async (e) => {
            if (busy || !e.target.closest('[data-net-retry]')) return;
            busy = true;
            const back = await fetch('/api/products', { method: 'HEAD', cache: 'no-store' }).then((r) => r.ok, () => false);
            busy = false;
            if (!back) {
              POD.toast(t('net.still'), 'error');
              return;
            }
            box.removeEventListener('click', click);
            document.removeEventListener('pod:langchange', paint);
            box.innerHTML = '<div class="spinner"></div>';
            resolve();
          };
          paint();
          box.setAttribute('role', 'alert');
          box.hidden = false;
          box.addEventListener('click', click);
          document.addEventListener('pod:langchange', paint);
          if (focus) box.querySelector('[data-net-retry]').focus();
        });
      }

      // (Without the products there is nothing to search: the box comes back with them.)
      const searchForm = document.getElementById('home-search');
      let catalog;
      try {
        catalog = await loadOrRetry(document.getElementById('home-net'), () => POD.loadCatalog().catch((e) => {
          searchForm.hidden = true;
          throw e;
        }));
      } catch (e) {
        grid.innerHTML = `<p class="muted">${esc(e.message)}</p>`;
        return;
      }
      searchForm.hidden = false;
      const { products, categories } = catalog;
      // Words people use for products that their names don't have (typed both ways).
      const ALIASES = {
        tshirt: 'tee t-shirt tshirt shirt تي شيرت تيشرت تشيرت', kidstee: 'tee t-shirt kids اطفال تيشرت', polo: 'tee shirt تيشرت', oversized: 'tee shirt تيشرت', jersey: 'football soccer shirt تيشرت فانلة',
        hoodie: 'hoody sweater هودى', ziphoodie: 'hoody zip jacket هودى جاكيت', kidshoodie: 'hoody هودى اطفال', sweatshirt: 'sweater سويت شيرت بلوفر',
        cap: 'hat قبعة طاقية', mug: 'cup coffee tea كوب كوباية مق', magicmug: 'cup كوب مق', couplemugs: 'cup كوب مق', tumbler: 'cup travel mug كوب',
        cushion: 'pillow مخدة وسادة', poster: 'frame picture صورة برواز', bottle: 'water flask زجاجة ازازة', tote: 'bag شنطة', phonecase: 'cover iphone samsung كفر',
        notebook: 'كراسة دفتر', mousepad: 'mouse pad', deskmat: 'mouse pad', keychain: 'key ring keyring key chain ميداليه ميدالية مفاتيح سلسلة مفاتيح', stickersheet: 'stickers ستيكر لزق',
        flyers: 'flyer flier leaflet فلاير منشورات',
        bizcards: 'business cards visit كارت فيزيت', canvas: 'painting wall art لوحة', canvaswide: 'painting wall art لوحة', photoprints: 'photos pictures صور',
        storybook: 'kids book story كتاب قصة اطفال', coloringbook: 'kids book coloring تلوين اطفال', caketopper: 'cake topper تورتة', namepuzzle: 'puzzle بازل',
        engrpen: 'pen pens ballpoint قلم اقلام أقلام قلم جاف', engrwallet: 'wallet purse محفظة محفظه محافظ',
        calendar: 'calendar نتيجه نتيجة تقويم نتيجة حيطة', deskcalendar: 'calendar نتيجه نتيجة تقويم مكتب', labels: 'label sticker ليبل استيكر لاصق', banners: 'banner بانر يافطة فليكس لافتة',
        menus: 'menu منيو قايمة طعام مطعم كافيه', brochures: 'brochure flyer leaflet بروشور مطوية', booklets: 'catalog catalogue booklet كتالوج كتيب', folders: 'folder فولدر ملف',
        notepads: 'notepad pad بلوك نوت مفكرة', postcards: 'postcard thank you card بوستكارد كارت شكر', giftvouchers: 'voucher gift card كوبون قسيمة جيفت كارد',
        magnets: 'magnet fridge مغناطيس مغنطيس تلاجة ثلاجة', wrappingpaper: 'gift wrap ورق هدايا تغليف', windowstickers: 'window decal vinyl ستيكر فاترينة زجاج',
        photobook: 'album photo book البوم صور', tablenumbers: 'wedding table number ارقام ترابيزات فرح', placecards: 'wedding place name card كروت اسامي فرح معازيم', bookmarks: 'bookmark فاصل كتاب',
      };
      // search-kit:start (the same lines are in public/index.html and public/js/designs.js; test/search-kit.test.js checks both)
      // Forgiving search: what the typed words find, plus plurals (hoodies, تيشيرتات), one word or two (t-shirt, tshirt),
      // both spellings of تيشيرت, and the shop's words for the same thing in either language (mug, مج, كوباية).
      const SEARCH = (() => {
        // Ignore case, Arabic short vowels and tatweel (U+064B-U+065F stops before the Arabic-Indic digits U+0660-U+0669),
        // the alef / yaa / taa marbuta spellings, and Arabic-Indic / Persian digits (100 typed in Arabic digits finds 100).
        const norm = (s) => String(s || '').toLowerCase()
          .replace(/[\u064B-\u065F\u0670\u0640]/g, '')
          .replace(/[أإآٱ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/ؤ/g, 'و').replace(/ئ/g, 'ي')
          .replace(/[٠-٩]/g, (c) => String(c.charCodeAt(0) - 0x0660))
          .replace(/[۰-۹]/g, (c) => String(c.charCodeAt(0) - 0x06F0))
          .replace(/[^\p{L}\p{N}]+/gu, ' ')
          // ("بابا نويل" is Santa, not dad: one word of its own, so a Father's Day search doesn't list Christmas. QA 25 Nov.)
          .replace(/(^| )بابا نويل(?= |$)/g, '$1santa')
          .trim();
        // Spelt with or without the long ي (تيشرت / تيشيرت).
        const loose = (s) => s.replace(/ي/g, '').replace(/ +/g, ' ');
        // The same thing said other ways, in both languages (two words keep their space; plurals are found anyway).
        const SAME = {
          tshirt: 'tshirt, t shirt, tee, tee shirt, shirt, تيشيرت, تي شيرت, تشيرت, قميص, قمصان',
          hoodie: 'hoodie, hoody, هودي',
          sweatshirt: 'sweatshirt, sweat shirt, سويتشيرت, سويت شيرت',
          cap: 'cap, hat, كاب, كاسكيت, قبعة, طاقية',
          mug: 'mug, cup, مج, مجات, مجين, ماج, كوب, كوباية, فنجان, فناجين',
          bag: 'bag, شنطة, شنط, كيس, اكياس',
          card: 'card, كارت, كروت, كارد, بطاقة',
          bizcard: 'business card, visit card, visiting card, بيزنس كارد, بيزنس كارت, بزنس كارد, بزنس كارت, كارت بيزنس, كارت بزنس, كروت بيزنس, كروت بزنس, كارت شخصي, كروت شخصية, كارت فيزيت',
          // (One word alone, as the English "business": everything for a business.)
          business: 'business, بيزنس, بزنس',
          catalog: 'catalog, catalogue, كتالوج, كاتلوج, كاتالوج, كتلوج',
          invitation: 'invitation, invite, دعوة',
          wedding: 'wedding, فرح, أفراح, زفاف',
          poster: 'poster, بوستر',
          notebook: 'notebook, note book, نوت بوك, نوتبوك, كشكول, كشاكيل',

        // The word after "the" / "for the" / "with the" / "and the" in front (التيشيرتات, للأفراح), when 3 letters or more
        // are left; after "the" / "for the", 2 are enough (الأم, للأب); "for" alone before an alef with 3 left (لأمي).
        // A word of 2 is only looked for with its article (للأب: الأب, as the shop's words list it): أب alone is also the
        // "up" of ليفل أب and ستارت أب. One of the shop's words of 2 (مج, الأم, الأب) also after "with the" / "and the"
        // (بالمج, والأب; not بالون or والده), and مج, a word of the shop alone, also without its article: المج, للمج, والمج
        // and بالمج find what مج finds.
        const article = (w) => {
          const m = /^(?:وال|بال|لل|ال)([ء-ي]{3,})$|^(?:لل|ال)([ء-ي]{2})$|^ل(ا[ء-ي]{2,})$|^(?:وال|بال)([ء-ي]{2})$/.exec(w);
          if (!m) return '';
          return m[4] ? (sameAs.has(m[4]) || sameAs.has(`ال${m[4]}`) ? m[4] : '') : m[1] || m[2] || m[3];

        if (p.mainPhoto) return thumbImg(p, POD.firstPick(p.colors));
        const l = lifeOf(p);
        if (l && l.file) return `<img class="hm-life" alt="${esc(tr(l.alt) || tr(p.name))}" loading="lazy" decoding="async" ${photoSrc(l.file, 'card')}>`;
        const g = designedOf(p);
        if (g && g.file) return `<img class="hm-designed" alt="${esc(tr(p.name))}" loading="lazy" decoding="async" ${photoSrc(g.file, 'card')}>`;
        return thumbImg(p, POD.firstPick(p.colors));
      }
      const editorHref = (p) => (p.kind === 'book' ? `/book?b=${encodeURIComponent(p.book)}` : p.kind === 'photoset' ? '/photos' : `/editor?product=${encodeURIComponent(p.id)}`);
      function rowCard(p, badge) {
        return `<a class="hm-card" href="${hrefOf(p)}">
          <div class="hm-pic">${cardPicture(p)}${badge ? `<span class="hm-badge hm-badge-${badge}">${esc(t('hm.badge.' + badge))}</span>` : ''}</div>
          <h3>${esc(tr(p.name))}</h3>
          <div class="hm-meta">${priceLine(p)}</div>
        </a>`;
      }
      function renderRows() {
        document.getElementById('hm-rows').innerHTML = ROWS.map((row) => {
          const list = [...new Set(row.ids)].map(byId).filter(Boolean);
          if (list.length < 3) return '';
          return `<section class="hm-section" aria-labelledby="hm-row-${row.key}" data-place="row:${row.key}">
            <div class="hm-head">
              <div><h2 id="hm-row-${row.key}">${esc(t(`hm.row.${row.key}`))}</h2><p class="muted">${esc(t(`hm.row.${row.key}.sub`))}</p></div>
              <div class="hm-head-end">
                ${row.link ? `<a class="hm-more" href="${row.link}">${esc(t('hm.seeAll'))}</a>` : ''}
                <button type="button" class="hm-arrow" data-scroll="-1" aria-label="${esc(t('hm.prev'))}">‹</button><button type="button" class="hm-arrow" data-scroll="1" aria-label="${esc(t('hm.next'))}">›</button>
              </div>
            </div>
            <div class="hm-row">${list.map((p) => rowCard(p, row.badge ? row.badge(p.id) : null)).join('')}</div>
          </section>`;
        }).join('');
      }
      // Arrows: one screenful along the row (in reading direction).
      document.getElementById('hm-rows').addEventListener('click', (e) => {
        const b = e.target.closest('[data-scroll]');
        if (!b) return;
        const row = b.closest('.hm-section').querySelector('.hm-row');
        const dir = getComputedStyle(row).direction === 'rtl' ? -1 : 1;
        row.scrollBy({ left: Number(b.dataset.scroll) * dir * row.clientWidth * 0.9, behavior: 'smooth' });
      });

      // ---------- Three picture tiles ----------
      function renderTiles() {
        // The shop's own pictures (hero-2, hero-3) first; else a product the shop sells now (hidden ones are not in the list).
        const pic = (key, ids, cat) => {
          const l = life[key];
          if (l && l.file) return `<img alt="" loading="lazy" decoding="async" ${photoSrc(l.file, 'tile')}>`;
          const p = ids.map(byId).find(Boolean) || products.find((x) => x.category === cat && !x.kind);
          if (!p) return '';
          const pl = !p.mainPhoto && lifeOf(p);
          return pl && pl.file ? `<img alt="" loading="lazy" decoding="async" ${photoSrc(pl.file, 'tile')}>` : thumbImg(p, POD.firstPick(p.colors));
        };
        const has = (c) => products.some((p) => p.category === c);
        const tiles = [
          has('occasions') && { key: 'gifts', img: pic('hero-2', ['mug', 'magicmug', 'couplemugs'], 'occasions'), href: '/?cat=occasions#products' },
          has('business') && { key: 'biz', img: pic('hero-3', ['bizcards', 'flyers'], 'business'), href: '/?cat=business#products' },
          { key: 'designs', img: pic('', ['tshirt', 'hoodie', 'mug', ...products.filter((p) => !p.kind).map((p) => p.id)]), href: '/designs' },
        ].filter(Boolean);
        document.getElementById('hm-tiles').innerHTML = tiles.map((x) => `<a class="hm-tile" href="${x.href}">
          <div class="hm-tile-pic">${x.img}</div>
          <div class="hm-tile-body"><h3>${esc(t(`hm.tile.${x.key}`))}</h3><span class="hm-tile-link">${esc(t(`hm.tile.${x.key}.cta`))} <span aria-hidden="true">←</span></span></div>
        </a>`).join('');
      }

      function render() {
        renderRows();
        renderTiles();
        // Only categories with something in them (hidden products are not in the list).
        const used = categories.filter((c) => products.some((p) => p.category === c.id));
        if (cat !== 'all' && !used.some((c) => c.id === cat)) cat = 'all';
        document.getElementById('cats').innerHTML = [{ id: 'all', name: null }, ...used]
          .map((c) => `<button class="chip ${c.id === cat ? 'active' : ''}" data-cat="${c.id}">${esc(c.name ? tr(c.name) : t('cat.all'))}</button>`)
          .join('');
        const ts = terms();
        const qs = SEARCH.query(typed());
        // A search with nothing to look for (only symbols, like "$&") matches nothing, not everything.
        const searching = Boolean(q.trim());
        let list = products.filter((p) => (cat === 'all' || p.category === cat) && (!searching || (ts.length && found(p, qs))));
        // Products whose name matches come first: names with the words as whole words, in another form or language
        // ("hoodies", "مجات", كوب: the mugs), then names with a word that only starts with them (كوبونات after the
        // mugs, للكابلز after the cap; at the start of a word, so "tshirt" puts T-shirts before the Sweatshirt), then
        // names spelt another way (a whole word without its ي too: كتيب is not the كتب of فواصل كتب, so the booklets come
        // before the bookmarks; QA 26 Nov), then the rest (description, category). A size, a colour or a year typed with
        // the product ("tshirt xl", "white t-shirt", "calendar 2027") is not looked for in the name, so the T-shirts still
        // come before the Sweatshirt. (A colour only when another word is left: in "card 100" the calendar, in "Matte card"
        // with 100 calendars, is not a card by name.)
        const rank = (p) => { const h = hay.get(p.id); const tz = ts.filter((w) => ts.length < 2 || !SEARCH.match(h.sized, SEARCH.query(w))); const tc = tz.filter((w) => !SEARCH.query(w).every((term) => isColor(h, term) || forYear(h, term))); const tw = tc.length ? tc : tz; const tq = tw.length === ts.length ? qs : SEARCH.query(tw.join(' ')); return SEARCH.match(h.spelt, tq, 'word') ? 0 : tw.every((w) => h.name.includes(` ${w}`)) ? 1 : SEARCH.match(h.named, tq, 'word') || tw.every((w) => loose(h.name).includes(` ${loose(w)}`)) ? 2 : SEARCH.match(h.named, tq, true) ? 3 : 4; };
        if (ts.length) list = list.map((p, i) => [rank(p), i, p]).sort((x, y) => x[0] - y[0] || x[1] - y[1]).map((x) => x[2]);
        document.getElementById('home-count').textContent = searching && list.length ? POD.plural('home.found', list.length, { q: q.trim() }) : '';
        if (!list.length) {
          const qq = q.trim();
          grid.innerHTML = `<div class="card empty home-empty">
            <h3>${esc(qq ? t('home.noMatch', { q: qq }) : t('home.noMatchCat'))}</h3>
            <p class="muted">${esc(t('home.noMatchHint'))}</p>
            <div class="design-empty-actions">
              ${qq ? `<button type="button" class="btn btn-primary" data-clear-q>${esc(t('designs.clearSearch'))}</button>` : ''}
              ${cat !== 'all' ? `<button type="button" class="btn" data-all-cats>${esc(t('designs.allCats'))}</button>` : ''}
              ${qq ? `<a class="btn" href="/designs?q=${encodeURIComponent(qq)}">${esc(t('home.searchDesigns', { q: qq }))}</a>` : ''}
            </div>
          </div>`;
          return;
        }
        // Catalogue cards: the product with a design on, the name, the price, "Start designing" and "Details".
        const total = list.length;
        if (!searching && !showAll && total > FIRST + 2) list = list.slice(0, FIRST);
        grid.innerHTML = list.map((p) => `
          <div class="hm-gcard" data-place="${esc(p.id)}">
            <a class="hm-gpic" href="${hrefOf(p)}" tabindex="-1" aria-hidden="true">${gridPicture(p)}</a>
            <h3><a href="${hrefOf(p)}">${esc(tr(p.name))}</a></h3>
            <div class="hm-meta">${priceLine(p)}</div>
            <a class="btn btn-primary hm-gstart" href="${editorHref(p)}">${esc(t(p.kind ? 'hm.open' : 'home.start'))}</a>
            <a class="btn hm-gdetails" href="${hrefOf(p)}">${esc(t('hm.details'))}</a>
          </div>`).join('') + (list.length < total ? `
          <div class="hm-showall">
            <button type="button" class="btn btn-lg" data-show-all>${esc(t('home.showAll', { n: POD.num(total) }))}</button>
            <span class="muted small">${esc(t('home.showing', { n: POD.num(list.length), total: POD.num(total) }))}</span>
          </div>` : '');
      }
      document.getElementById('cats').addEventListener('click', (e) => {
        const b = e.target.closest('[data-cat]');
        if (!b) return;
        cat = b.dataset.cat;
        saveUrl();
        render();
      });
      // ---------- Search ----------
      const qInput = document.getElementById('home-q');
      qInput.value = q;
      function saveUrl() {
        const u = new URL(location.href);
        if (q.trim()) u.searchParams.set('q', q.trim()); else u.searchParams.delete('q');
        if (cat !== 'all') u.searchParams.set('cat', cat); else u.searchParams.delete('cat');
        history.replaceState(history.state, '', u.pathname + u.search + u.hash);
      }
      let typing = null;
      qInput.addEventListener('input', () => {
        clearTimeout(typing);
        typing = setTimeout(() => {
          q = qInput.value.slice(0, 60);
          if (q.trim()) cat = 'all'; // a search looks in every category
          saveUrl();
          render();
        }, 200);
      });
      document.getElementById('home-search').addEventListener('submit', (e) => {
        e.preventDefault();
        clearTimeout(typing);
        q = qInput.value.slice(0, 60);
        if (q.trim()) cat = 'all';
        saveUrl();
        render();
        qInput.blur(); // closes the phone keyboard so the results show
      });
      grid.addEventListener('click', (e) => {
        if (e.target.closest('[data-show-all]')) {
          showAll = true;
          try { history.replaceState({ ...(history.state && typeof history.state === 'object' ? history.state : {}), homeAll: true }, ''); } catch (err) { /* not kept */ }
          render();
          // On to the first of the products that just came in.
          const next = grid.querySelectorAll('.hm-gcard h3 a')[FIRST];
          if (next) next.focus({ preventScroll: true });
          return;
        }
        if (e.target.closest('[data-clear-q]')) {
          q = '';
          qInput.value = '';
          saveUrl();
          render();
          qInput.focus();
        } else if (e.target.closest('[data-all-cats]')) {
          cat = 'all';
          saveUrl();
          render();
        }
      });
      // Coming back to the page: the browser may refill the box; the address is what counts.
      window.addEventListener('pageshow', () => { qInput.value = q; });

      // (A product the shop doesn't sell now is left out; another one takes its place.)
      const pick = (id, colorId) => {
        const p = products.find((x) => x.id === id);
        if (!p) return '';
        const c = p.colors.find((x) => x.id === colorId && POD.canPick(x)) || POD.firstPick(p.colors);
        return thumbImg(p, c, true);
      };
      const trio = () => {
        const out = [pick('tshirt', 'navy'), pick('hoodie', 'cream'), pick('mug', 'white')].filter(Boolean);
        for (const p of products) {
          if (out.length >= 3) break;
          if (!p.kind && !['tshirt', 'hoodie', 'mug'].includes(p.id)) out.push(thumbImg(p, POD.firstPick(p.colors), true));
        }
        return out.join('');
      };
      // The hero: the big lifestyle picture of many printed products; until there is one, three product photos.
      const hero = document.getElementById('hero-art');
      hero.innerHTML = life['hero-1'] && life['hero-1'].file
        ? `<img class="hm-hero-photo" alt="" ${photoSrc(life['hero-1'].file, 'hero')} fetchpriority="high">`
        : `<div class="hm-hero-trio">${trio()}</div>`;

      render();
      backToPlace();
      document.addEventListener('pod:langchange', render);
    })();
  </script>
</body>
</html>
